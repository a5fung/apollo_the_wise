  - review_id: flag_detector_post_breakout_label
    title: "Flag detector mislabels post-breakout days as TIGHTENING"
    question: |
      User-flagged 2026-05-15 via TRT case study.

      TRT 2026-05-14: close $14.02, range $11.68-$14.48 (intraday $2.80),
      vol 2.35M. Detector emitted: `FLAG · TIGHTENING — base 13d r0.49 v0.57`.
      TRT 2026-05-15: close $20.05 (+43% one day), range $14.53-$21.38
      (intraday $6.85), vol 4.6M. Detector emitted:
      `FLAG · TIGHTENING — base 14d r0.67 v0.85`.

      These are explosive breakout days, NOT contraction. The "TIGHTENING"
      label is semantically wrong.

      Root cause (flag_detector.py:615-620): the state-machine evaluates
      base contraction ratios using PRIOR bars (the base), not today's
      bar. When the breakout day arrives, today's bar isn't included in
      the base ratios — so they still register as tight. If TRIGGERED
      gate can't fire (requires COILED today or in last 5 days, neither
      of which TRT achieved), the elif falls through to TIGHTENING
      based on lagging base data.

      The detector has no label for "broke out but precursor base
      didn't reach COILED." Falls back to TIGHTENING which misleads.

      Possible fixes (not yet picked):
      1. Add a `UNCOILED_BREAKOUT` state for days where breakout_now=True
         but COILED prerequisite wasn't met — distinct telemetry
      2. Mark the day INVALIDATED when today's bar breaks above
         base_high but state machine can't promote to TRIGGERED
      3. Suppress TIGHTENING when today's bar is itself a clear
         breakout (close > base_high AND vol > 1.5x AND wide body)
      4. Keep current behavior; emphasize in display that TIGHTENING
         reflects BASE state not today's bar

      Option 3 is the least disruptive (just a display suppression).
      Option 1 is the most informative (operator learns about the
      coverage gap). Option 2 is the most aggressive (acknowledges
      the setup left the flag-friendly regime).
    predicate_sql: |
      -- Predicate: flag candidates labeled TIGHTENING on days when
      -- close > base_high_close AND volume > 1.5x base_avg.
      -- Approximation — exact base values need code-level data.
      -- For now use audit-presence: any TIGHTENING row where the
      -- ticker also had a 2x+ intraday gain that day.
      SELECT COUNT(*) FROM mi_flag_candidates f
      JOIN mi_daily_closes d
        ON d.ticker = f.ticker AND d.trade_date = f.scan_date
      WHERE f.stage = 'TIGHTENING'
        AND f.scan_date > CURRENT_DATE - 60
        AND (d.high_price - d.open_price) / d.open_price >= 0.15;  -- 15%+ intraday
    threshold: 5
    earliest_review_date: 2026-06-01
    action_when_ready: |
      1. Pull all TIGHTENING-labeled candidates from last 60d with
         intraday gain ≥15% (predicate query above). Eyeball: how
         many are real breakouts mislabeled?
      2. Pick fix option (1, 2, or 3 from question section). Lean
         toward option 1 (UNCOILED_BREAKOUT state) — gives the
         EP Selectivity Phase 1 cohort study an explicit telemetry
         category for "Class B breakout the flag pipeline missed."
      3. Backtest the new label against historical data; ensure no
         downstream consumer (briefing, /flags command, Sunday
         digest) breaks on the new state value.
      4. Update flag_continuation.md SSoT change log.
      Origin: 2026-05-15 TRT case study. Related to EP Selectivity
      Phase 1 §G Class A vs B framework.
    status: done
    added_on: 2026-05-15
    resolution_2026_07_04: |
      CLOSED as OBE (operator 7/4): the 7/1 monthly sweep's own verdict stands (EOD-TRIGGERED is post-hoc, structural NO-GO); HTF Phase-3 rides the #94 intraday break instead.
  - review_id: breadth_cluster_view_ideation
    kind: cadence
    title: "Breadth cluster-matrix view + missing Stockbee secondaries"
    question: |
      Pradeep tweet 2026-05-15 showed Stockbee Market Monitor in
      CLUSTER-MATRIX format: rows = dates (most recent on top),
      columns = breadth indicators (primary on left, secondary
      right, T2108 + S&P at far right). Red clusters in vertical
      columns made deterioration visually obvious — past week of
      down-4% reds in primary, today's first red day in 25%/3M
      secondaries, today's first red T2108.

      Our system has the same DATA (most of it) but presents it
      one-day-at-a-time in regime + briefing text. We don't see
      "primary indicators have been red 5 days running, now
      secondaries are joining" without manual SQL.

      Two ideation prongs (this review is ideation-only; not
      shipping until shape decided):

      A. **Cluster matrix render** — produce a 10-row × N-column
         table (date × indicator) in a Telegram code block or
         dashboard, color-coded red/green/yellow per cell. Highlight
         vertical runs (consecutive red days in a column) as the
         primary signal. Same data we already have, new shape.

      B. **Compute-vs-surface gap + truly missing indicators** —
         CORRECTION 2026-05-15 (user feedback): we compute MORE than
         the evening briefing surfaces. Inventory:

         COMPUTED AND SURFACED (evening briefing breadth line):
            - 50%/1M ✓ (briefing.py:199-205, `50%/M` label)
            - 25%/3M ✓ (briefing.py:206-212, `25%/Q` label)

         COMPUTED BUT NOT SURFACED IN BRIEFING:
            - 25%/1M (regime.py:254, never rendered in evening brief)
            - +/-4% ratio rolling 5d/10d (in regime signals list, NOT
              the breadth section)
            - Consecutive 700+ down-4% days (signals list)
            - T2108 (signals list, but not in the matrix-style cell)

         TRULY MISSING — not computed:
            - up/down 13%+ in 34 days (Wm O'Neil thrust-style)
            - up 20%+ in 5 days (Pradeep thrust — see 2026-05-24 SPY
              annotation, Screenshot 2026-05-24 161935.png)
            - Worden Common Stocks (closed-source; needs A/D-line
              or similar proxy if we want to fill the column)

         Two-tier work: (i) low-cost surfacing of already-computed
         25%/1M into the briefing breadth section closes the most
         obvious user-visible gap; (ii) compute 13%+/34d + 20%+/5d
         from `mi_daily_closes` if cluster matrix becomes the render.

      Reference matrix (2026-05-24 Pradeep screenshot 162223 —
      full Stockbee cluster view we want to render):
         Primary (4 cols): up_4%_today · down_4%_today ·
                           5d_ratio · 10d_ratio
         Secondary (6 cols): up_25%/Q · down_25%/Q ·
                             up_25%/M · down_25%/M ·
                             up_50%/M · down_50%/M
         Far right (3 cols): Worden_common · T2108 · S&P
         Rows: 10 most-recent trading dates (newest on top).
         Per-cell color encoding visible — green / pale yellow
         neutral / red. Operator can spot vertical-run signals
         (e.g., past 5 days red in down-cols).

      Color-rule design constraint (2026-05-24 evidence):
        Metrics do NOT all share a monotone "high=green, low=red"
        rule. Four distinct classes; cluster-matrix render cannot
        ship until the per-metric rule table is explicit:

         CLASS A — Paired up/down counts (matrix columns above)
            up_X%/N and down_X%/N are SIBLING columns. Up cell
            green when high; down cell red when high. Both can
            light up independently. This covers MOST of the
            cluster-matrix cells.

         CLASS B — Unpaired thrust metric (NOT in matrix; separate
                   signal class)
            up_20%+/5d alone, up_13%+/34d alone — single-direction
            surge counts without a paired sibling. Pradeep
            2026-05-24 SPY annotation (Screenshot 162223 sibling
            162038): "historically such high readings result in
            stalling action / pullbacks." High isn't green, it's
            amber exhaustion-warning. RSI-shape logic.

         CLASS C — Contrarian extremes (T2108)
            low <20 = green (oversold-bounce setup, ALREADY in
            briefing.py:243 today); high >85 = amber (overbought
            caution, NOT yet wired).

         CLASS D — Persistence (sequence-as-signal)
            Consecutive 700+ down-4% days — single-day color not
            meaningful; the SEQUENCE is the signal. Render as
            count-of-consecutive at far right of date row.

      Open design questions:
        - Render target: Telegram monospace table, or a new dashboard
          page (would need streamlit/mobile-accessible)?
        - Color encoding in Telegram is limited (emoji only — 🟥🟧🟩);
          how many cells can we fit before it's noise?
        - Should we add the missing secondaries first (data) or build
          the cluster view first (shape) — which delivers more value
          if shipped alone?
        - Pradeep's signal-of-signals: 5+ consecutive red days in
          primary + first red in secondary = regime warning. Should
          this become an explicit L2/L3 audit event?
