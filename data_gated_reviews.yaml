      alert-time distribution.

      PRICE BASIS (note for the reviewer): ADV$ here = `adv_20 * prev_close`
      (the PRE-GAP price, same basis as `mi_stock_scores.close` and this
      review's own predicate/action-query joins) — NOT `current_price`
      (today's already-gapped price). Using the gapped price would run every
      ADV$ figure hot by the gap size and admit names the retrospective
      cohort would have excluded. Both raw `adv_20` and `prev_close` are
      captured in the payload alongside the derived `adv_dollar` so either
      definition can be reconstructed if this needs reconciling.

      SAMPLING/TIMING BASIS (note for the reviewer): a ticker is scored
      (and its `mi_ep_alerts` row inserted) EXACTLY ONCE per day — the
      first scan tick it clears every filter (`already_today` dedup,
      ep_detector.py ~1963-1967, `continue`s any ticker already in
      today's mi_ep_alerts; the INSERT has no ON CONFLICT). rel_volume is
      therefore FROZEN at that single tick — there is no later/"settled"
