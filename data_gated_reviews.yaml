      ESTC 28->95, MDB 20->88, SNOW 80->99, OKTA 87->98; CRWD/DDOG/PANW/FTNT 94-98
      throughout. 12/15 top-decile rs_1m. Engine captured ONLY a 2-member {DDOG,FTNT}
      "Network Security" fragment — OKTA/CRWD/SNOW/NOW/PANW/NET/MDB/TEAM/ESTC/ORCL all
      theme-less. ROOT CAUSE visible: most have BLANK sector (outside top-300 RS sector
      enrichment) -> RS-by-sector clustering structurally CANNOT group a cross-name
      narrative rotation with no shared sector label. This is why OKTA's 5/29 gap scored
      routine/28.8/filtered (fundamentals-only, theme-blind) — a likely methodology
      false-negative (theme #1). Fix must validate against THIS cohort.

      MECHANISM PINNED 2026-05-31 (read-only prod trace of the 5/28 drone ignition):
      cohort was IGNITING (UMAC rank 933->50->23 over 5/26-5/29, ONDS 2772->412, RCAT
      3751->1619, SWMR 165->57; rs_1m 95-100 / rs_6m ~0 = textbook nascent). EVERY discovery
      path required ALREADY-ESTABLISHED status: (1) uncovered pool = leaders[:40] — on 5/28
      ZERO drone names cleared top-40 (best UMAC 50, SWMR 57); (2) the theme existed only as
      two FADING 2-member fragments ({KYTX,SWMR} score 1.1; {ISSC,KTOS} score 0) whose
      'covered' members are STRIPPED from all discovery pools -> the stub both blocked the
      real theme AND decayed; (3) correlation pre-pass = 0 drone clusters (blind to staggered
      ignition by its 0.85/20d/>=4 design). Names WERE caught individually (RCAT EP HIGH 101,
      AVAV 72, UMAC 9M +32.8%) — only the THEME was missed. Confirmed lifecycle bug: 'Fading'
      while SWMR rs_1m=100. NET: structurally surfaces the obvious, misses the nascent
      (inverse of purpose). Mechanism = candidate #1 (rank-gate) + #4 (covered-Fading trap);
      #3 (correlation) ruled out. DESIGN PULLED FORWARD to North Star week (operator
      2026-05-31) — confirmed months-running defect in a STANDALONE-INTELLIGENCE product
      (evening brief), decoupled from the 6/22 trading cutover. Residual unknown:
      velocity/turners pool contents (not persisted) — minor.
    predicate_sql: |
      SELECT COUNT(*) FROM mi_themes WHERE theme_date >= CURRENT_DATE - 7;
    threshold: 1
    earliest_review_date: 2026-07-28  # bumped 7/21 (operator: pull all into next week)
    action_when_ready: |
