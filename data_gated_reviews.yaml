      - feedback_methodology_insights_need_periodic_revalidation.md
        (this entry IS the periodic re-evaluation)
    status: deferred
    deferred_reason: "OFF the EP critical path (operator triage 2026-08-24) - and this is exactly the decision branch this entry already scripts: the intraday flag-break detector (#94 / ADR 0005) did NOT ship by 2026-08-15, so its urgency is re-evaluated against other priorities, and EP profitability wins. The structural no-go conclusion does not change with more N, so nothing is lost by waiting. PULLS FORWARD when #94 ships - at that point close this entry and open the intraday-entry cohort review that supersedes it."
