  - review_id: cooldown_admission_unassumed
    question: |
      Should the 60-day EP cooldown admit some suppressed candidates - and if
      so, on WHAT criterion? Deliberately UNASSUMED: do not pre-commit to a
      hypothesis, let the data name the discriminator.

      Why this framing (operator 2026-07-26): the prior attempt failed exactly
      by pre-committing. `ep_cooldown_resetup_admission` correctly argued TIME
      is a bad proxy for "still extended" - then the shipped classifier
      (`_is_cooldown_resetup`) used a 10-day separation test anyway. Measured
      2026-07-26, that time test is not merely weak but INVERTED: 0-7d since
      the prior alert returns +4.0% mean / 47% win, while 21d+ (the admit zone)
      returns -6.0% / 32% win. It steers toward the worst bucket. FCEL's +88%
      came 2 days after its prior alert and could never have been flagged.
      Gap size DOES discriminate (>=15%: 62% win, positive mean AND median;
      <15%: 35% win, negative both) - but that is one factor found post-hoc on
      n=24, not a rule to enshrine.

      So: NO new shadow, NO re-pointed label. Every input is already persisted.
      Run the analysis clean when n supports it.
    predicate_sql: |
      SELECT COUNT(DISTINCT (ticker, scan_date)) FROM mi_ep_scan_log
      WHERE filter_reason ILIKE 'EP cooldown%' AND gap_pct >= 15;
    threshold: 55
    # Deliberately NON-BLOCKING (operator 2026-07-26: "if we reach it earlier, we
    # should review earlier"). Firing is AND (count >= threshold AND today >=
    # this date), so a late date can only DELAY a review whose data is already
    # ready. Data-readiness is the whole question here, and the threshold already
    # encodes it — a calendar floor adds nothing and can only get in the way.
    earliest_review_date: 2026-07-26
    status: pending
    action_when_ready: |
      ⚠ CALIBRATION NOTE (set 2026-07-26 from measured accrual, NOT guessed): the
      cohort was 39 distinct ticker-days at registration and is DECELERATING with
      the regime - May 20, Jun 15, Jul 4 (through 07-21). A 75 bar projected 6+
      months out and risked becoming an unreachable gate (the #335 failure mode:
      a threshold nobody can hit, so the question never gets asked). 55 needs ~16
      more and is reachable even at the reduced rate.

      If the count STALLS anyway - still <55 by ~2027-01 - do NOT keep waiting.
      Run the analysis at whatever n exists, report the wider error bars honestly,
      and re-date. An underpowered answer that names its own limits beats a
      question that silently never gets asked.

      Assumption-free analysis over `mi_ep_scan_log` (filter_reason ILIKE
      'EP cooldown%') joined to alerts + forward outcomes. Test ALL available
      factors together rather than one pre-chosen story - at minimum: gap_pct,
      days-since-prior-alert, EXTENSION at the re-alert (the factor the original
      review said was "the bigger one" and which was never actually implemented),
      catalyst grade/freshness, RVOL, ADV/market-cap, regime, and whether the
      PRIOR alert was itself traded or a winner. Report what separates winners
      from losers; explicitly report if NOTHING does.

      Ship bar (same both-measures rule as the ORB-cutoff review, for the same
