      -- (87 in last 10d alone). Phase 1 diagnostic can start any time.
      -- Phase 2 (shadow telemetry) is what needs 30 days of new data;
      -- Phase 3 (ship) needs N>=20 shadow settled.
      SELECT COUNT(*) FROM (
        SELECT 1 FROM mi_ep_alerts WHERE alert_date >= CURRENT_DATE - 60
        UNION ALL
        SELECT 1 FROM mi_live_trades
        WHERE account_mode='paper' AND status='closed'
          AND closed_at >= CURRENT_DATE - 30
      ) t;
    threshold: 100
    earliest_review_date: 2026-05-17
    action_when_ready: |
