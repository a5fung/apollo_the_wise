  - review_id: l2_baseline_window_trending_metrics
    title: "L2 baseline window too sluggish for trending metrics (earnings-season transitions)"
    question: |
      30d trailing median lags on metrics with secular trend, producing
      false-positive L2 alerts during transitions (post-earnings tail-off,
      etc). Confirmed evidence (2026-05-20):
        - 2026-05-19 L2 9m_alerts_per_day: today=8, 30d median=17.5,
          z=-3.17. Verified FP — earnings season ended, monotonic
          decline 45 → 8 over 13 days.
        - 2026-05-12 L2 HIGH_ep_entry_rate: today=10, fired against
          baseline trending down. Likely FP — same range as 5/06=10,
          5/14=11 during the burst.

      Candidate fixes:
        (a) Shorter window (7-14d) for trending metrics
        (b) EWMA (exponentially weighted MA) — recent days weighted more
        (c) Trend-aware test — if 30d shows monotonic decline, treat
            current as within trend rather than anomalous
        (d) Seasonal-aware — flag known transition periods (earnings
            close, holiday weeks) and use conditional baselines

      Need cohort evidence to pick. Each fix has tradeoffs (shorter
      window = more noise; EWMA = lag drift; trend-aware = false-
      negative risk during real anomalies).
    predicate_sql: |
      SELECT COUNT(*) FROM mi_audit_log
      WHERE event_type = 'anomaly_detected'
        AND summary LIKE 'L2%'
        AND created_at >= NOW() - INTERVAL '90 days'
    threshold: 6
    earliest_review_date: 2026-08-20
    action_when_ready: |
      With ≥6 L2 events in last 90d, categorize each:
        - FP (false positive, metric in transition): supports change
        - TP (real anomaly correctly surfaced): cautions against
            window change

      If ≥4 of 6 are FPs from trending-metric class:
        Phase 1 — Telemetry-only ship: tag each L2 with a `trending`
          classifier (monotonic-3-of-5d?, regression slope?) and emit
          an audit event for FP-likely L2s. Keep firing the alert but
          downgrade the framing. 30d telemetry.
        Phase 2 — Threshold change: shift to EWMA OR shorter window
          for metrics flagged trending, based on cohort outcomes.

      If <4 of 6 are FPs: keep current 30d window. The L2 sensitivity
      is doing its job.

      Cross-reference: silent_failure_taxonomy_audit (this is the
      observability-class case: alarm fires but signal is noise).
    status: pending
    added_on: 2026-05-20

  - review_id: ninem_day2_mechanical_vs_methodology_alignment
    title: "9M Day 2 ORB mechanical entry vs Pradeep watchlist methodology — architectural gap"
    question: |
      Per `user_pradeep_9m_universe_methodology.md`: "9M EP = universe-to-
      watch (1% rare event), NOT entry trigger. Entry comes from
      tightness→expansion (flag-class pattern). Telemetry-first."

      But our 9M Day 2 path is MECHANICAL: yesterday's 9M event → today's
      ORB high breakout = entry. No pattern recognition step. No catalyst
      grade. No revenue-stage check (which protects MAGNA53 from clinical-
      stage biotech misalignments).

      Two paths currently coexist with overlapping ticker pools:
        - 9M Day 2 ORB (mechanical, fires next-day at ORB high) — NOT
          methodologically aligned
        - 9M → flag detector via `ninem_universe_watch` tag (P7.3b 5/17) —
          methodologically aligned (tightness→expansion state machine)

      Concrete trigger cases:
        - ROIV 2026-05-21 (clinical-stage biotech, $0 yfinance Revenue Avg).
          MAGNA53 path would block via revenue-stage gate. 9M Day 2 path
          mechanically entered at 9:31 ET ($32.34, stop $29.35). Trade
          currently open (paper).
        - PURR 2026-05-20: similar profile, also mechanical entry, also
          open (paper).
        - Closed 9M Day 2 cohort (N=4 over 90d, methodology-attribution):
          KLAR -$854, KLAR -$914, ARM -$392, GOOGL +$619. Net -$1,541.
          3/4 losers (75% loss rate).

      Question: should we
        (A) deprecate 9M Day 2 mechanical, rely on flag-detector→ninem-watch
            for methodologically-aligned 9M-watchlist entries
        (B) add gating to 9M Day 2 (e.g., require concurrent COILED/
            TIGHTENING in flag detector, OR exclude clinical-stage names)
        (C) accept current 9M Day 2 mechanical as a SEPARATE strategy (not
            Pradeep methodology) and rename/reframe honestly

      PRELIMINARY PHASE-1 READ (2026-05-31, read-only daily-bar backfill —
      directional ONLY, NOT the decision): split last-120d sugar babies by
      whether the ticker was COILED/TIGHTENING in the flag detector (±3d).
        - flag-confirmed: 4 triggered, +0.72 avg-R at Day-2 close, 4/4 positive
        - no-flag:       60 triggered, +0.07 avg-R, 50%
      Flag-confirmation looks like the discriminator (consistent with the
      methodology thesis). CAVEATS: N=4 on the decisive cell (noise-dominated);
      daily-bar CLOSE proxy (no trailing stop / intraday stop-vs-high sequencing,
      soft per #94 rule); simulated across ALL sugar babies incl. gate-skipped
      (ungated universe, not the exact traded strategy); ±3d window heuristic.
      VERDICT: promising -> make it STANDING telemetry + accrue; do NOT act at N=4.

      CORRECTED FRAMING (2026-05-31, advisor + operator): tracking and demoting
      are INDEPENDENT. Telemetry != paper-trading, so we ADD the dual outcome
      telemetry (Day-2-ORB + flag-entry-on-9M) NOW with zero phase change, and
      KEEP 9m_day2 paper running as the hard broker-ground-truth stream (sim-from-
      bars is the soft proxy we don't over-trust). The demote is a SEPARATE later
      call once standing telemetry shows whether flag beats ORB at real N — do NOT
      bundle it. NOTE: the entry-technique tables carry NO 9M-origin label today;
      "flag entries on 9M EPs" is reconstructable only via join (16 incidental
      detections found) — first-class labeling + outcome accrual is the build.

      Cross-references:
        - feedback_sample_size_discipline.md (N≥10-30 required)
        - user_pradeep_9m_universe_methodology.md (canonical methodology)
        - flag carryforward path (e) shipped 2026-05-19 (carries
          flag-detector setups across RS dips — alternative entry mechanism)
    predicate_sql: |
      SELECT COUNT(*) FROM mi_live_trades
      WHERE signal_type = '9m_day2'
        AND status = 'closed'
        AND account_mode = 'paper'
        AND alert_date >= '2026-04-01'
        AND pnl_attribution IS NULL
    threshold: 10
    earliest_review_date: 2026-07-15
    action_when_ready: |
      With N≥10 closed 9M Day 2 trades (methodology-attribution):

      Phase 1 — Cohort outcome analysis (~30 min):
        - Compute win rate, R-expectancy, max-favorable-excursion
        - Separate cohort by "would-have-passed-flag-detector" vs not
          (i.e., did the ticker show COILED/TIGHTENING on the entry day?)
        - Separate by revenue-stage class (pre-revenue / small-cap /
          mid-cap / large-cap)

      Phase 2 — Methodology decision:
        - If 9M Day 2 cohort R is positive AND comparable to MAGNA53
