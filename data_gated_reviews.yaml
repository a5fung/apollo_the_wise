  - review_id: perplexity_hallucination_keyword_leak
    title: "Perplexity disclaimer text leaks into M&A keyword scanner (RAL/P-class FPs)"
    question: |
      When Perplexity is asked about an unknown ticker it returns
      disclaimer text like "No recent catalysts found for RAL stock...
      Search results reference Rocket Lab (RKLB) wins..." or "No direct
      information available on WAT. Nearest match is 5N Plus (FPLSF)..."
      That filler is then passed verbatim to `ma_filter.is_likely_ma` as
      `catalyst_texts`, and the keyword scanner matches against words in
      the IRRELEVANT content Perplexity returned (e.g. "merger" in a
      mention of an unrelated company, "strategic transaction" in a
      generic phrase).

      90d audit: 11 `mna_filter_fired` events have disclaimer-pattern
      news_summary text. RAL/P were two such cases analyzed during the
      2026-05-13 M&A direction-blind fix.

      The same bug class likely affects other detectors that feed
      Perplexity output to keyword scanners (flag detection, theme
      description ingestion, EP catalyst grading). A systematic
      sanitizer detecting disclaimer phrases and suppressing them
      before keyword matching would close the class.
    predicate_sql: |
      SELECT COUNT(*) FROM mi_audit_log
      WHERE event_type = 'mna_filter_fired'
        AND created_at > NOW() - INTERVAL '90 days'
        AND (detail ILIKE '%nearest match%'
             OR detail ILIKE '%closest match%'
             OR detail ILIKE '%no direct catalyst%'
             OR detail ILIKE '%no recent catalysts%'
             OR detail ILIKE '%no specific news%');
    threshold: 11
    earliest_review_date: 2026-05-13
    action_when_ready: |
      Predicate threshold already met (11 hits in 90d). Actions:

      1. Add `_strip_perplexity_disclaimer(text)` helper in collector.py.
         Detects lead patterns ("No recent catalysts", "No direct
         information", "I dont have information" (note ASCII apostrophe
         convert), "Nearest match", "Closest match", "Search results
         reference") in the first 100 chars and returns
         (clean_text, is_disclaimer). Conservative — only strip when
         pattern is in the LEAD, not when it appears mid-content as a
         legitimate quote.

      2. Hook at ep_detector.py (~line 898) before catalyst_texts list
         is built. When is_disclaimer=True, pass empty string for
         catalyst_texts[1] so Polygon news headlines (different source)
         drive the M&A check alone. Emit
         `perplexity_disclaimer_stripped` audit event with original /
         stripped length for verification.

