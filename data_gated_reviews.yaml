      positions held ≥5 trading days with highest_price_seen excursion
      <+3%. Hypothesis: the meandering pattern (small unrealized loss,
      stop not hit, no real run) has negative expected value once the
      position has failed to confirm continuation; the opportunity cost
      of the held slot exceeds the chance of late recovery.

      Trigger observation (2026-05-23 user-flagged): 3 of 4 current
      open positions are 9M Day 2 meanderers (IBM/ROIV/PURR-class).
      Stops at prior-day-low + smaller sizing means small dollar bleed
      but slots locked for 1-3+ weeks. PURR specifically had a brief
      +13% excursion (excluded from time-stop class — not a meanderer,
      partial-take logic issue). GOOGL historical example: 17 days held,
      +6.8% peak, closed +3.17% — slow runner that would NOT trigger
      the time-stop (peak >+3%).

      Question: at N≥10 time_stop_executed events, did the time-stop
      cohort outperform a counterfactual "hold to natural stop or
      hard exit" path?
    predicate_sql: |
      -- N≥10 time_stop_executed audit events
      SELECT COUNT(*) FROM mi_audit_log
      WHERE event_type = 'time_stop_executed'
        AND created_at > NOW() - INTERVAL '180 days';
    threshold: 10
    earliest_review_date: 2026-07-15
    action_when_ready: |
      Re-run analysis at N≥10:

      1. Pull all time_stop_executed events (parse exit price + entry
         price + hold days from audit detail or join to mi_live_trades
         where exits[]->'reason' = 'time_stop').
      2. For each, compute actual exit P&L vs counterfactual:
         (a) Held to natural hard stop OR (b) held to 20 trading days
         then market exit at close. Counterfactual price is closing
         price on whichever event fired first.
      3. Aggregate: did time-stop average outcomes beat
         counterfactual?
         - Time-stop avg P&L < counterfactual avg P&L: time-stop
           DESTROYED value (we exited winners too early). RETRACT.
         - Time-stop avg P&L > counterfactual + opportunity-cost
