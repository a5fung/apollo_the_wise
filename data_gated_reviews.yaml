  - review_id: ep_adv_probe_volume_sanity
    title: "ADV probe event volume sanity (rank 21-50 audit firing)"
    question: |
      Option B promoted ADV-from-Polygon synthesis from top-20 to top-50
      with audit logging on ranks 21-50. Expected volume: ~400-1000
      ep_adv_probe_synthesized events/day. If after 5 trading days the
      rate is < 50/day, the audit-emit code path inside ep_detector.py
      isn't running for those ranks (silent telemetry hole — would defeat
      the Option B retirement decision later).
    predicate_sql: |
      SELECT COUNT(DISTINCT date_trunc('day', created_at AT TIME ZONE 'America/New_York'))
      FROM mi_audit_log
      WHERE event_type = 'ep_adv_probe_synthesized'
        AND created_at > NOW() - INTERVAL '14 days'
    threshold: 5
    earliest_review_date: 2026-05-08
    action_when_ready: |
      Verify daily emission rate:
        SELECT (created_at AT TIME ZONE 'America/New_York')::date AS day,
               COUNT(*) AS n
        FROM mi_audit_log
        WHERE event_type = 'ep_adv_probe_synthesized'
          AND created_at > NOW() - INTERVAL '14 days'
        GROUP BY 1 ORDER BY 1;
      Expected: 400-1000/day on trading days. If < 50/day on multiple
      days, the rank>20 branch in ep_detector.py is unreachable —
      check that candidates list reaches len>=21 in pre-market scans
      AND that the gap_rank>20 conditional fires before the
      log_audit_event call. If 0/day, the pre-9:30 universe is too thin
      and Option B can't be evaluated; revert to top-20 early.
      Origin: 2026-04-30 deploy. Failure mode: silent under-emission
      would let adv_probe_retirement (review_id above) misjudge "no
      winners → retire" when reality is "no telemetry → can't tell".
    status: done
    added_on: 2026-04-30
    closed_on: 2026-05-13
    outcome: |
      Emit path WORKS. 9d sample 2026-05-01..05-13: 5/06=1131, 5/07=922
      both within the originally-expected 400-1000/day range, proving
      the rank>20 audit-emit code path is reachable when the universe
      supports it. Other days varied 5-218 (5/04=5, 5/12=21, 5/01=14
      below the 50 "telemetry hole" threshold but on otherwise-thin
      pre-market days — scan_log shows only 15-28 max_rank on those
      days, so few rank-21-50 candidates exist to probe).

      Root cause of variance: rate is determined by how many candidates
      per scan tick have rank>20 AND adv_source='pending' (outside
      pre-cached top-500 universe). On wide gap-list days that's
      hundreds; on thin days it's a handful. Naturally varies with
      pre-market gap-list width — not a code bug.

      Implication for adv_probe_retirement (2026-06-01 review): the
      "no winners → retire" decision must base on relative cohort
      outcomes (rank-21-50 win rate vs rank<=20 in the same period),
      not absolute audit-event count. A 50/day floor is not a
      meaningful gate; substitute "rank-21-50 cohort N >= 30
      observations" instead.

