  - review_id: fishhook_TI3_revisit
    title: "TI3 Fishhook detector cohort feasibility"
    question: |
      2026-04-29 deferred TI3: strict cohort had only 2 unique tuples in
      180d (Apollo's pre-trade filter is too good — ~1 real Day-1 stop-out
      per quarter). Revisit at 365d window: does the cohort cross n=20 with
      Apollo's current filter set?
    predicate_sql: |
      SELECT COUNT(DISTINCT (a.ticker, a.alert_date))
      FROM mi_ep_alerts a
      JOIN mi_live_trades lt ON lt.ticker = a.ticker AND lt.alert_date = a.alert_date
      WHERE a.alert_date > CURRENT_DATE - 365
        AND a.score_tier = 'HIGH'
        AND lt.status = 'closed'
        AND COALESCE(lt.total_pnl, 0) < 0
    threshold: 20
    earliest_review_date: 2026-10-29
    action_when_ready: |
      docker exec apollo-market python -m scripts.fishhook_explorer
        --strict-cohort --days 365 --label-threshold 0.10
      If range_over_atr14 still shows the cleanest separation AND threshold
      sweep yields > 2x precision lift at recall ≥ 50%, build TI3 Stage 1
      detector. Otherwise close TI3 permanently.
      Origin: fishhook_explorer.py docstring + project_trading_ideas_backlog.md.
    status: pending
    added_on: 2026-04-29

