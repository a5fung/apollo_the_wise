  - review_id: orb_entry_stuck_pending_new
    kind: tripwire
    title: "P0 — ORB entry stuck in `pending_new` (missed RDW 2026-05-26)"
    closed_on: 2026-05-28
    outcome: |
      Predicate threshold hit at N=1 (RDW). Cohort scan (90d) confirmed
      RDW was the only genuine same-session stuck-pending_new — 9 other
      hits were #123 reconcile job catching pre-existing DB drift, not
      same-session broker stalls.

      Root cause identified: APScheduler misfired the 10:00:00 ET tick
      on 2026-05-26. mi_job_runs shows orb_window_cleanup missing for
      that exact day (ran every other weekday in the window). Multiple
      other 10:00:00 jobs (stop_ack_timeout_watchdog, stuck_fill_watchdog)
      also skipped the same tick — scheduler-side hiccup, not code-logic.

      Fix shape: defensive watchdog inside existing reconcile_order_states
      (#123 job, 15-min cadence). When Alpaca confirms a pending_new
      order is older than 15 min during market hours, emit
      `stuck_pending_new_detected` audit + Telegram alert. Per-day dedup
      so we don't re-alert the same ticker. No auto-cancel — operator
      decides per post-mortem STOP-and-CONSULT discipline.

      Live-cutover gate UNBLOCKED. Scheduler-misfire root cause filed
      separately as #147 for further investigation (sibling restart at
      10:04:31 same day; pattern suggests a host-level event).

    question: |
      RDW ORB entry submitted 2026-05-26 09:31:02 ET stayed in Alpaca
      `pending_new` state the entire session, never routed to exchange,
      expired overnight. Price crossed entry trigger many times that
      day (open $19.645, high $23.10, close $22.04 vs entry $19.68).
      Methodology lost a winner. With low-WR-by-design, missing
      winners is fatal — and on live this would be real money lost.

      Investigation tracked in task #142. Five branches:
        1. Historical cohort scan — N≥3 in 90d means recurring class
        2. Alpaca support ticket for the specific order
        3. OTO + stop-limit parent isolation test
        4. Apollo submission code review
        5. Stuck-pending_new watchdog (defensive)

    predicate_sql: |
      -- Count ORB entries where status went to expired/canceled with
      -- filled_qty=0 AND elapsed >4h (i.e. stuck across the session).
      -- Excludes EOD cancellations (orb_unfilled_entry_cleanup at
      -- 10:00 ET is intentional + fast). This is the recurring-class
      -- detector — RECURRENCE = a POST-FIX occurrence only.
      -- WINDOW FIX 2026-06-18 (verified read): a rolling 90d window
      -- false-counted the PRE-fix history (RDW 5/26 + 9 April orders
      -- the #123 reconcile cancelled in a 5/27 sweep = drift, NOT
      -- session stalls) → it read 10 and would have FALSELY BLOCKED
      -- the 6/22 cutover gate (RDW still inside the 30d window at 6/22).
      -- Floor at the 5/28 watchdog-fix date so this means "has it
      -- recurred SINCE the fix?" — verified 0 post-fix on 2026-06-18.
      SELECT COUNT(*) FROM mi_live_orders o
      WHERE o.side = 'buy'
        AND o.order_type = 'stop_limit'
        AND o.filled_at IS NULL
        AND o.status IN ('expired', 'cancelled', 'canceled')
        AND o.cancelled_at IS NOT NULL
        AND EXTRACT(EPOCH FROM (o.cancelled_at - o.submitted_at)) > 4 * 3600
        AND o.submitted_at > '2026-05-28';  -- post-fix only (was NOW()-90d, pre-fix-contaminated)
    threshold: 1
    earliest_review_date: 2026-05-28
    action_when_ready: |
      Threshold=1 because this is P0 — even ONE confirmed recurrence
      means the bug is structural and a live cutover blocker.

      1. Pull all qualifying rows; list ticker + alert_date +
         submitted_at + cancelled_at + raw_response.
      2. For each: was the order a fresh ORB entry OR a stop-loss
         that got stuck? (filter side=buy in predicate already
         excludes most stop-losses but verify.)
      3. Map to whether other Apollo systems detected the stuck state
         intra-session (audit log + Telegram). If we missed it
         intra-session, the stuck-pending_new watchdog (task #142
         step 5) is the must-ship.
      4. Cross-reference Alpaca paper API status page / known issues
         for the dates in question. Some incidents are broker-side
         and Apollo can't prevent — but should still alert + log.

      **LIVE CUTOVER GATE:** any strategy flipping from `phase='paper'`
      to `phase='live'` MUST verify this predicate returns 0 (post-fix
      window, since 2026-05-28 — verified 0 on 2026-06-18) AND task #142
      steps 1-3 are complete AND a stuck-pending_new
      watchdog is in place. Codify in preflight_check.py before any
      live flip.
    status: pending
    added_on: 2026-05-27

