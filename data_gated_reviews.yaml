      mi_ep_alerts for HIGH tier inside 9:30-9:44 ET. If ≥1 match AND fwd_5d_pct
      ≥ 10% on that match, promote the cap to 50 in ep_detector.py
      (line ~556) and remove the probe instrumentation. If zero matches OR no
      winners, retire by reverting the cap to 20.
      Origin: 2026-04-30 dead-zone investigation, advisor priority B.
    # ── ANSWERED 2026-08-06 (measured against prod, $0) ───────────────────────
    # THE ANSWER IS ZERO, and the reason is structural, not statistical:
    # `ep_detector.py:2791` scores `candidates[:20]`. Ranks 21-50 receive real
    # ADV and a real rel_volume (:2636-2643) but NEVER enter the scoring loop,
    # so they cannot produce an alert of any tier. The probe is telemetry-only
    # exactly as this entry assumed — confirmed in code, not inferred.
    #
    # WHAT THE PROBE ACTUALLY BOUGHT, over 3 months / 3,445 rows / 522 tickers:
    #   16 ticker-days ever synthesized rel_volume >= 3x.
