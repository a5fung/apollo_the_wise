# Data-gated reviews registry
#
# Items here are pending reviews that require data accumulation (n alerts, days
# elapsed, etc.) before they can be answered. The Sunday weekly system review
# auto-surfaces items whose predicate has flipped to ready.
#
# Schema per entry:
#   review_id: short unique id (snake_case)
#   title: 1-line summary surfaced in Telegram
#   question: what we're trying to answer
#   predicate_sql: must return single integer count; ready when count >= threshold
#                  OR set predicate_sql=null and rely on earliest_review_date alone
#   threshold: int — predicate must reach this for ready=true
#   discriminates_on: ["table.column", ...] — REQUIRED whenever predicate_sql has a FROM clause
#                  and is not a COUNT(DISTINCT ...) predicate (#573, 2026-08-30). Declares which
#                  column(s) on the table(s) the predicate reads separate GENUINELY DIFFERENT
#                  QUESTIONS (which setup, which account, which entry variant) — not just
#                  different rows of the same one. Written by whoever writes the predicate, at the
#                  time they write it — they know the population; a global table->column dict
#                  inferred later does not, and silently misses new tables/columns as the schema
#                  grows (the defect #573 fixed). `data_gated_reviews.py::find_population_mismatch`
#                  then flags any declared column the predicate text never actually filters.
#                  Set to `[]` when you've reviewed the table(s) and confirmed no column applies —
#                  that is a real declaration, distinct from omitting the field entirely,  which
#                  fails the registry's `test_registry_has_no_undeclared_population_gaps` /
#                  `scripts/preflight_yaml_dupe_keys.py` hard gate (unless the review_id is still
#                  on the pre-existing `POPULATION_DECLARATION_PENDING_MIGRATION` backlog in
#                  data_gated_reviews.py). A date-only predicate (no FROM clause) needs nothing
#                  here — same fixed syntactic invariant as `is_date_fire_predicate`.
#   earliest_review_date: ISO date — never surface as ready before this
#   action_when_ready: what the user should do when surfaced
#   status: pending | done | deferred
#   kind: accrual | tripwire | cadence   (optional; default accrual)
#         accrual  — needs N samples before the question can be ANSWERED. Age = how long it has
#                    been answerable and unanswered, i.e. real staleness.
#         tripwire — fires on an OCCURRENCE/recurrence. count 0 means the bug HAS NOT happened,
#                    which is GOOD NEWS. Age here = length of the silence, never neglect.
#                    ADDED 2026-08-03: rendering these by age put `orb_entry_stuck_pending_new`
#                    (P0, 0/1 across 67 post-fix days) at the top of the "most neglected" list,
#                    one step from being closed — which would have deleted a working tripwire.
#         cadence  — a periodic review on a date, not a data threshold (quarterly sweeps,
#                    ideation items). threshold 0 is correct for these, not a bug.
#   added_on: ISO date when entry was created (for audit)
#
#   Optional fields for status=deferred:
#     deferred_reason: short string explaining why deferral (e.g. "Gate 3
#                       paper R still negative; need more cohort growth")
#     deferred_on: ISO date deferral was decided
#     deferred_until: ISO date for next evaluation (also reflected in
#                     earliest_review_date so weekly surfacing respects it)
#
#   Optional fields for status=done:
#     closed_on: ISO date the decision was made
#     outcome: what was decided / found (the answer)
#
#   Optional fields while status STAYS pending (#517, 2026-08-17):
#     last_run_inconclusive_on: ISO date the review was RUN but could not be
#                                answered (predicate fired on a mis-scoped
#                                cohort, N was too thin after a correction,
#                                etc.) — distinct from "never touched." The
#                                review re-fires normally; this is a note that
#                                someone already looked and it wasn't ready.
#     last_run_note: what was found on that run (kept even though it isn't a
#                     decision — real findings from a false-ready fire are
#                     worth keeping, they just don't close the entry).
#     ⚠ Both fields belong to the entry they describe — attach them ONLY to
#       that review_id's block. Landing them on the WRONG entry (copy-paste
#       into the next block down) shipped once, 2026-08-17, on this exact
#       registry: the note read `stop_too_wide_outcome_cohort`'s findings but
#       was pasted under `gap_alignment_331_accrual`. Nothing failed — YAML
#       parsed fine, the dupe-key/status lint passed — because there is no
#       mechanical way to check "this text describes review X" against
#       "this text lives under review Y." Caught only by reading it. No gate
#       for this; care on the edit is the only fix.
#
# Status semantics:
#   pending  — review hasn't fired ready yet (predicate not met OR date not reached)
#   done     — review has been acted on; decision made; no further action.
#              Parser skips done entries when checking ready. Kept as audit trail.
#   deferred — review fired ready, operator looked, decision is "not yet — wait
#              for more data / time / cohort." Sets earliest_review_date to a
#              new date (deferred_until). Parser treats deferred similarly to
#              pending: re-evaluates on the new date. Distinct from pending so
#              audit trail captures the explicit deferral decision.
#
# Update flow:
#   - New item: append entry, set status=pending, added_on=today
#   - Weekly Sunday digest surfaces ready (predicate met + date reached) items
#   - Operator acts when surfaced. Options:
#       (a) Decision made → set status=done. Keep entry for audit.
#       (b) Decision deferred (more data needed) → set status=deferred,
#           add deferred_reason + deferred_on + deferred_until, AND
#           bump earliest_review_date to deferred_until so it doesn't
#           keep surfacing every Sunday in the meantime.
#       (c) Decision made + creates new review question →
#           set this status=done, append NEW review entry for the next
#           question.
#   - Done + deferred entries are kept (audit trail). Parser skips done.
#
# Example deferral (live_cutover_decision 2026-05-22):
#   - Gate 3 paper R is RED (-$2,175 over 3 trades)
#   - Operator decides to wait 4 weeks for cohort growth
#   - Set status=deferred
#   - deferred_reason: "Gate 3 paper_r_expectancy negative; need N≥10 closed methodology trades + positive R"
#   - deferred_on: 2026-05-22
#   - deferred_until: 2026-06-22
#   - earliest_review_date: bump to 2026-06-22 (will re-surface then)

reviews:
  - review_id: runner_rule_sweep_recut
    # kind=tripwire, not accrual, though the predicate has both arms. The mis-ranking cost is
    # ASYMMETRIC: labelled accrual, a rules change would surface as "just more data has arrived"
    # and be deprioritised — which is precisely the failure that retracted the 2026-08-29
    # geometry analysis. Labelled tripwire, the accrual arm firing merely brings a review
    # forward, which is harmless.
    kind: tripwire
    title: "Re-cut the runner-exit sweep — on NEW TRADES or on a RULES CHANGE, whichever comes first"
    question: |
      Does any looser runner rule beat the current breakeven-after-partial stop, on
      evidence that is neither too thin nor stale?

      THE 2026-08-29 READ (docs/analysis/runner_rule_sweep_2026-08-29.md, n=194): every
      looser rule earns MORE on the mean — hold-20-sessions +0.36R, hold-5 +0.30R,
      sma20 +0.28R, against the control's +0.14R — because 82 of 106 winners currently
      give the whole runner back to breakeven and finish at exactly +0.33R. But the
      median FLIPS negative (+0.33R -> -0.33R), the win rate falls 55% -> 25-44%, and
      NO rule separates from the control at 95% confidence. The gain sits in a handful
      of correlated April/July semiconductor names.

      ⚠ TWO REASONS THIS IS NOT A CALENDAR ITEM. First, more trades genuinely move it —
      this is a fat-tailed strategy and the tails ARE the edge, so the sample has to
      grow before the tails stabilise. Second, and the reason the predicate below has
      two arms: a change to the exit stack, the admission stack or a safeguard VOIDS
      the last read entirely. The operator, 2026-08-29: "as we continue to evolve this
      system, we need to know when to review as needed as well." A read taken under
      rules that no longer exist is the exact defect that retracted the geometry
      analysis the same day.
    predicate_sql: >-
      SELECT
        (SELECT count(*) FROM mi_live_trades
          WHERE status = 'closed' AND risk_dollars > 0
            AND alert_date > '2026-08-29')
        + 40 * (SELECT count(*) FROM mi_safeguard_state
                 WHERE last_transition_at > '2026-08-29');
    threshold: 40
    discriminates_on: [mi_live_trades.signal_type, mi_live_trades.account_mode, mi_safeguard_state.account_mode]  # backfilled 2026-08-30 (#573) from the verified 2026-08-17 table->column mapping
    earliest_review_date: 2026-09-29
    status: pending
    action_when_ready: |
      RE-RUN THE SWEEP, do not re-derive it: scripts/probes/_bt_replay.py plus the Run-U
      population from docs/analysis/ep_backtest_run1_2026-08-29.md. It is a $0 query —
      an exit rule is arithmetic over bars we already store, so there is nothing to
      shadow and nothing to spend.

      WHICH ARM FIRED MATTERS:
        - trade-count arm  -> the same question with a bigger n. Report whether any
          rule now separates from the control at 95%, and whether the concentration in
          a few correlated names has broken up.
        - safeguard-change arm (each transition counts 40, so ONE fires it alone) ->
          the prior read is STALE, not merely thin. Say which toggle moved and re-cut
          the population under the new rules before comparing anything.

      REPORT: mean AND median per rule, n on every row, the win-rate cost, and the
      concentration check. Then say plainly whether anything beats the control —
      "the current rule is best" is a real answer.

      ⚖ THE LINE — exit discipline is the operator's. Evidence only; flip nothing.
      ⚠ Blocked in practice by #605: while capture stays survivor-only the sample
      cannot improve honestly, so check #605 first.

  - review_id: model_selection_quarterly_review
    kind: cadence
    title: "Quarterly LLM model-selection review (incremental, not from-scratch)"
    question: |
      Has any new model (Claude release, Perplexity tier, price change) appeared
      since the baseline's `Last reviewed`, and does it beat the recorded incumbent
      on the probe library? Roles: catalyst grade + materiality (Sonnet), sourcing
      (sonar-pro), cross-validation (base sonar), HOLISTIC JUDGE (Opus 4.8 since
      6/10 — the load-bearing row; eval_judge_models.py --grounded). Last swaps:
      judge Sonnet→Opus 2026-06-10 (#252), theme validation Haiku→Sonnet 6/06 (#213).
      ▶ CANDIDATE 2026-06-30: Claude Sonnet 5 (claude-sonnet-5) released — "most agentic Sonnet",
      ~Opus 4.8 at higher effort, cheaper ($2/$10 intro thru 8/31, $3/$15 std). Evaluate esp. for the
      ORCHESTRATOR (Sonnet 4.6) + the #212 investigator loop (agentic gains); the grade converges across
      models so INPUT-sourcing is the lever there. See the reference_sonnet5_release memory + the blog.
    predicate_sql: null
    threshold: 0
    earliest_review_date: 2026-08-01
    status: done
    closed_on: 2026-08-06
    outcome: >-
      RETIRED as a manual review — it contradicts the design the operator ruled on
      2026-07-30 and restated 2026-08-06: models auto-track the newest in their TIER,
      he is notified on a change, and guardrails catch degradation. Verbatim:
      "There is no manual prompt and checks to update models, that is the design we
      aligned on and that is how it should be." A quarterly prompt asking a human to
      go compare models is exactly the manual step that design removes, and surfacing
      it re-created the confusion on 08-06. Cross-tier moves (should the JUDGE be a
      different tier at all?) remain a real question and belong on a PLAN line with
      evidence, NOT on a calendar.
    action_when_ready: |
      FOLLOW THE PLAYBOOK: docs/model_selection_baseline.md → "PLAYBOOK —
      evaluating a new model and executing a flip" (codified 2026-06-10 from the
      judge Sonnet→Opus flip; operator-requested so decisions are SYSTEMATIC).
      Steps 0–6 there are the procedure: candidate intake as versioned registry
      constants → eval on GROUNDED, input-gap-CLOSED probes (fix the input before
      comparing models) → OPERATOR labels the disagreement table (agent never
      self-certifies) → majority-label winner via its own registry commit (per-role
      versioned pin if the family constant shouldn't flip everywhere) → move
      timeouts/budgets WITH the model → baseline row + eval doc + change log +
      first-production-call verify + recorded flip-back condition.
      Quarterly-specific preface:
        1. docker exec apollo-market python scripts/dump_unknown_cohort.py --days 120
           --json /tmp/unknown_cohort.json  → adjudicate NEW unknown cases vs the
           actual filing; promote clear ones into the baseline Probe Library.
        2. Only models released since baseline `Last reviewed` are candidates.
        3. Eval scripts per role are in the baseline decision table (now incl.
           eval_judge_models.py --grounded for the judge). ALWAYS adjudicate any
           "FOUND" vs the filing (the RUM keyword-trap).
      Mid-quarter MAJOR release on a load-bearing role → pull this forward ad-hoc;
      the playbook applies identically. Tracked by #207. Re-bump
      earliest_review_date +1 quarter each time this runs (recurring, not one-shot).

  - review_id: anticipation_270_shadow_graduation
    title: "#270 anticipation shadow → actionable graduation (forward-data gate)"
    question: |
      Does the LIVE #270 shadow tactic's forward-outcome data match the gate-free
      backtest (FIRST5-BREAK entry + derisk-fast harvest = realized median +1-2R;
      buy-and-hold loses the median)? If live shadow tracks the backtest, graduate the
      surfacing informational → actionable (real-time entry alerts). The ANTICIPATION
      entry mode stays OBSERVATIONAL regardless — no realized-R edge (advisor 6/14:
      price-capture + complementarity only; the +2.9–15R were MFE ceilings, realized ≈0R).
    # ⚠ FLAGGED 2026-08-15 (sweep: does the counted thing accrue?): count 0 with NO
    # path to rise as-is. The #270 pipeline is ALIVE (63 anticipation_coil_buyout_pin_rejected
    # events in 21d) but mi_anticipation_lifecycle last wrote 2026-06-16, and across all
    # 19 rows ever, state='triggered' and realized_r have NEVER occurred (states seen:
    # watched/armed/ready/expired). The pin rejects everything before the lifecycle
    # table. Needs a #270 funnel look (detector-side), not a re-gate here — the right
    # quantity depends on #270's design intent. Same finding applies to
    # anticipation_270_calibration_revalidation below.
    predicate_sql: |
      SELECT COUNT(*) FROM mi_anticipation_lifecycle
      WHERE state = 'triggered' AND realized_r IS NOT NULL
        AND entry_tactic IN ('first5_break', 'gdl_reclaim')
    threshold: 5
    earliest_review_date: 2026-07-15
    status: pending
    added_on: 2026-06-14
    action_when_ready: |
      Compare the live shadow cohort's realized R (recorded vs the forward path) to the
      backtest: (1) is the median positive and is derisk-fast confirmed (same-day
      spike-and-give-back)? (2) does the FIRST5 entry fill-rate + stop geometry hold
      out-of-sample? This first surfacing at N≥5 is an EARLY DIRECTIONAL PEEK, NOT a ship
      (operator 6/14). Three valid outcomes: (a) if it's clearly tracking → graduate
      shadow→actionable alerts, re-bump threshold to N≥30 + open a SIZING review for real
      money (still gated on multi-window re-validation, data-blocked today); (b) DEFAULT —
      HOLD FOR MORE DATA: set status=deferred + deferred_until a later date and bump
      earliest_review_date, so it re-surfaces with a bigger cohort (this is the designed
      "wait" path, expected at N=5); (c) if the read is NEGATIVE → diagnose the divergence
      (IEX-vs-SIP fill bias, cohort drift) before graduating.
      ALSO at this peek: re-run `scripts/_270_calibration_probe.py` against the live cohort and
      eyeball the two calibration conclusions (knob #1 EXPANSION-floor cosmetic; knob #2 NO
      trigger-volume floor — the SILO-class thin WINNER). Flag early if live thin triggers now
      FAIL (would reopen knob #2); the deep tune is the separate N≥30 review below.
      ⚠ THRESHOLD (5) + earliest date (7/15) are PROVISIONAL operator knobs — triggers are
      RARE (~1/week), so even N=5 may take ~5 weeks; the deferred-status loop is how you
      wait for more without the review going silent.
      ✅ PREREQ MET (2026-06-16, #270 Step 3 Phases 1–5): table `mi_anticipation_lifecycle` BUILT;
      predicate verified against the shipped columns (`state`, `realized_r`). The `entry_tactic IN
      ('first5_break','gdl_reclaim')` guard was ADDED so the verdict can't ripen on an anticipation-only
      cohort (anticipation settles realized_r too but stays observational — no realized edge). TIMING
      (advisor 6/16): 3a (anticipation + readiness) shipped before 3b (the FIRST5/gdl execution watch,
      Phase 6); until 3b is live AND ~5 FIRST5 entries have forward-settled, this stays at COUNT 0 and
      the 7/15 date passes with the review still empty — that is CORRECT, not a miss (Prong-B escalation
      only fires once a review is genuinely ready).
      The predicate gates on `realized_r` (the HARVESTED Layer-3 R, NOT `fwd_mfe_pct`/MFE) so it
      fires only when the number the action compares actually exists — advisor 6/14: gating on MFE
      would recreate the MFE-vs-realized gap this tactic's analysis closed. Ensure Step 3 captures
      `realized_r` (or the exit-fill data to derive it); repoint here if the column name differs.

  - review_id: anticipation_270_calibration_revalidation
    title: "#270 calibration re-validation — EXPANSION floor + trigger-volume floor (tune/confirm)"
    question: |
      The two #270 calibration knobs were set on N=17 ILLUSTRATIVE (gate-free historical cohort,
      `scripts/_270_calibration_probe.py`, 2026-06-14): knob #1 = floor EXPANSION base at 0.5×ADV20
      (cosmetic; the 1.5× gate is fine, ratio magnitude doesn't predict outcome); knob #2 = NO
      trigger-volume floor (the cohort REFUTED it — SILO +37% was a thin winner tied at $2M with the
      CAMP +6% dud; the $20M gap-day liquidity seed already gates name liquidity). On a larger LIVE
      cohort, do BOTH conclusions still hold, or does the data now support tuning? This is the
      methodology-revalidation guard (memory feedback_methodology_insights_need_periodic_revalidation
      — a "proven" finding silently going stale is the exact failure mode).
    # ⚠ FLAGGED 2026-08-15: same finding as anticipation_270_shadow_graduation above —
    # 'triggered' + realized_r have never been produced (0 all-time); table dark since
    # 2026-06-16 while the pipeline's pin rejects all candidates. Cannot ripen as-is.
    predicate_sql: |
      SELECT COUNT(*) FROM mi_anticipation_lifecycle
      WHERE state = 'triggered' AND realized_r IS NOT NULL
    threshold: 30
    earliest_review_date: 2026-09-15
    status: pending
    added_on: 2026-06-14
    action_when_ready: |
      Re-run `scripts/_270_calibration_probe.py` adapted to the LIVE cohort (the table now has the
      per-trigger volume metrics). Re-test specifically: (#1) does flooring base at 0.5×ADV20 still
      change nothing material, and does the ratio still fail to predict outcome? Adjust the floor
      only if the larger cohort shows it matters. (#2) THE KEY ONE — do thin trigger bars now
      separate winners from losers (i.e. is the SILO thin-WINNER an artifact of the small N, or
      real)? If thin triggers systematically fail at N≥30, knob #2 REOPENS → propose a $-vol floor
      via CHANGE_PROCESS + sign-off; if SILO-class thin winners persist, the NO-floor decision is
      CONFIRMED. Either way: update SSoT decisions #1/#2 in docs/setups/delayed_ep_reentry.md with
      the N≥30 verdict, and re-bump this review (recurring, not one-shot). Tuning thresholds = a
      detection-criterion change → N≥30 backtest + operator sign-off (CHANGE_PROCESS), never
      self-certified.
      ⚠ PREREQ: same as the graduation review — needs the live `mi_anticipation_lifecycle` cohort;
      predicate gates on `realized_r` (harvested R, NOT MFE — winner/loser separation is a realized
      question, advisor 6/14). Ensure Step 3 captures it; repoint if the column name differs. Also
      wire the probe into the Monthly backward-check sweep when live data flows (build-spec
      checkpoint) so the conclusion is re-confirmed even between data-gated surfacings.

  - review_id: kill_scale_bands_quarterly_review
    kind: cadence
    title: "Quarterly kill/scale band review (operator sign-off condition #1, 2026-06-12)"
    question: |
      Are the SIGNED live-money kill/scale bands (safeguards.md, #268b) still
      correctly calibrated? Inputs: (a) live closed-trade R-distribution since
      cutover vs the Phase B calibration envelope (exp +0.95R, maxDD -24R,
      worst streak 15, trailing-20 p5 -0.63R); (b) the P6 replay-regression
      weekly reports (divergence between accruing replay and the calibration);
      (c) the override log (kill_scale_override audit rows + safeguards.md
      change-log entries) - repeated overrides in one direction = the bands
      are mis-set, recalibrate rather than keep overriding; (d) the standing
      demote-side watch-metric (judge-demoted cohort forward R - Phase B showed
      demotes averaging +1.01R, i.e. NOT reliably saves).
    # RE-GATED 2026-08-06 from a bare date to the sample floor the evaluator itself
    # enforces (was `predicate_sql: null` + `threshold: 0`, i.e. date-surfaced only).
    # See the RUN block below: at n<20 the strategy-health arms cannot evaluate, so a
    # date-surfaced quarterly review can only ever report "cannot evaluate".
    predicate_sql: |
      SELECT COUNT(*) FROM mi_live_trades
      WHERE status = 'closed' AND account_mode = 'live' AND total_pnl IS NOT NULL
    threshold: 20
    discriminates_on: [mi_live_trades.signal_type, mi_live_trades.account_mode]  # backfilled 2026-08-30 (#573) from the verified 2026-08-17 table->column mapping
    earliest_review_date: 2026-11-26
    # >> RAN 2026-08-26 (Opus): docs/analysis/kill_scale_quarterly_2026-08-26.md.
    #    Verdict HOLD from the shipped evaluator against prod (module md5 matched): n=23,
    #    trailing-20 -0.44R, cumulative -11.93R, streak 1, drawdown tier OK, no override.
    #    FIRST review clearing the 20-trade floor, so the strategy-health arms could actually
    #    evaluate rather than abstain.
    #    Distance to REDUCE: 12 straight full stop-outs — but the driver is NOT the losses.
    #    PLTR's +3.4R rolls out of the trailing-20 window at exactly trade 12; losses 1-11 move
    #    the number only -0.444 -> -0.489. One more winner pushes both arms out. KILL is 19 away.
    #    Pop-check clean (magna53=23, no contamination). Zero rows dropped by the degenerate
    #    guard; risk_dollars_actual is NULL on all 23 so the fallback carries every row and the
    #    actual-branch is dead code on live data.
    #    ERA: 22 of 23 are pre-2R; only MRVL closed under the 2R stop. The #268b calibration was
    #    itself simulated on stop-model=orb_low, so both sides are pre-2R TODAY and consistent —
    #    increasingly not, as 2R closes accrue. Operator's fork, not pre-decided.
    #    Two measurement defects found, neither touched: the SCALE arm's equity_above_start
    #    compares to a $0 bootstrap snapshot so it can essentially never read False (inert, but
    #    not what its name says); and the YAML predicate and evaluator use different filters,
    #    agreeing at 23 only because the book is clean.
    #    TRAP: the weekly replay-regression series through 08-23 used the OLD pre-#586
    #    denominator, so it is NOT comparable to today's corrected figure. 08-30 is the first
    #    comparable snapshot.
    status: pending
    action_when_ready: |
      Part of the operator's QUARTERLY RULE REVIEW (rides the same 8/1 session
      as model_selection_quarterly_review; quarterly sweep cadence Feb/May/Aug/
      Nov 1). Re-derive the band statistics from live trades + latest replay
      (scripts/_killscale_bands_268.py pattern over the live cohort), present
      keep/retune to the operator, log the outcome as a safeguards.md
      change-log entry (bands are never silently re-tuned). Re-bump
      earliest_review_date +1 quarter each run (recurring, not one-shot).
    # ── RUN 2026-08-06 (read-only, $0). THE BANDS ARE FINE. THE COHORT IS NOT. ──
    #
    # (a) LIVE R-DISTRIBUTION vs the Phase B envelope — measured, all 14 closed
    #     live trades:
    #                            calibration envelope      live reality
    #       expectancy           +0.95R                    -0.82R
    #       win rate             30%                       0%   (0 of 14)
    #       worst losing streak  15                        14 and running
    #       cumulative R         maxDD -24.1R              -11.5R
    #       trailing-20 p5       -0.63R                    n/a (n<20)
    #
    # ⚠ FIRST, THE THING I ALMOST GOT WRONG AND CHECKED: at -0.82R the trailing-20
    # expectancy is already past the REDUCE threshold (<= -0.70R), so the state
    # SHOULD read REDUCE and mi_safeguard_state says HOLD — which looks like a
    # safeguard that failed to transition. It is not. `evaluate_kill_scale_bands`
    # applies a 20-trade sample floor (_SAMPLE_FLOOR, kill_scale_bands.py:125) and
    # returns HOLD below it; the live evaluator prints exactly that:
    #   "n=14 · t20=n/a · t40=n/a · streak=14 · cum=-11.5R
    #    14 closed trades < 20 sample floor — only equity guards bind"
    # HOLD is CORRECT behaviour, not a missed transition. Verified by running
    # scripts/evaluate_kill_scale_bands.py against prod before writing this.
    #
    # (b) THE BANDS WILL BIND ON THEIR OWN, SOON, WITHOUT ANY CHANGE:
    #       streak arm   REDUCE at >= 16 — we are at 14, i.e. TWO more losses
    #       expectancy   REDUCE at <= -0.70R — already true at -0.82R, but invisible
    #                    until trade 20 (six more trades)
    #       KILL arms    cum <= -30R (at -11.5R) or t20 <= -1.05R — not close
    #     So the design is working as signed: a kill rule that does not fire on the
    #     normal variance of a healthy year, reaching for the REDUCE rung first.
    #     NO RETUNE PROPOSED. Nothing here argues the thresholds are mis-set —
    #     there are zero kill_scale_override rows (one transition ever, `live ∅ →
    #     HOLD` on 2026-06-19), so criterion (c)'s "repeated overrides in one
    #     direction" does not apply.
    #
    # 🔴 (c) THE FINDING THAT MATTERS IS NOT ABOUT THE BANDS. **13 of the 14 closed
