      That filler is then passed verbatim to `ma_filter.is_likely_ma` as
      `catalyst_texts`, and the keyword scanner matches against words in
      the IRRELEVANT content Perplexity returned (e.g. "merger" in a
      mention of an unrelated company, "strategic transaction" in a
      generic phrase).

      90d audit: 11 `mna_filter_fired` events have disclaimer-pattern
      news_summary text. RAL/P were two such cases analyzed during the
      2026-05-13 M&A direction-blind fix.

      The same bug class likely affects other detectors that feed
      Perplexity output to keyword scanners (flag detection, theme
      description ingestion, EP catalyst grading). A systematic
      sanitizer detecting disclaimer phrases and suppressing them
      before keyword matching would close the class.
    predicate_sql: |
      SELECT COUNT(*) FROM mi_audit_log
      WHERE event_type = 'mna_filter_fired'
        AND created_at > NOW() - INTERVAL '90 days'
        AND (detail ILIKE '%nearest match%'
             OR detail ILIKE '%closest match%'
             OR detail ILIKE '%no direct catalyst%'
             OR detail ILIKE '%no recent catalysts%'
             OR detail ILIKE '%no specific news%');
