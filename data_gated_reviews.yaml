      the series is comparable across regimes.

      ⚖ THE LINE: any exit-rule change is CHANGE_PROCESS + #151 harness +
      operator sign-off. This review produces EVIDENCE and a recommendation; it
      never flips anything.

      🔗 **RUNS INSIDE #545 (filed 2026-08-07).** The operator asked that all entry/exit
      analysis be connected rather than answered one axis at a time: *"we already have triggers to
      eval once we have more samples, are they linked? We should connect all the entry/exit
