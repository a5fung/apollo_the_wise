        SELECT (created_at AT TIME ZONE 'America/New_York')::date AS day,
               COUNT(*) AS n
        FROM mi_audit_log
        WHERE event_type = 'ep_adv_probe_synthesized'
          AND created_at > NOW() - INTERVAL '14 days'
        GROUP BY 1 ORDER BY 1;
      Expected: 400-1000/day on trading days. If < 50/day on multiple
