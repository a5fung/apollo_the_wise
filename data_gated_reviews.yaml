    outcome: |
      ROOT CAUSE IDENTIFIED + FIX SHIPPED 2026-05-14 (Wave 2). Review
      was closed today after audit verification.

      Mechanism (option c — structural placement during Pass1):
      `theme_pass1_protect_strip` at theme_engine.py line 2733-2793.
      When two themes both have `protected_names` membership AND
      overlap, the default behavior stripped the overlap from theme i
      (iteration-order earlier) to preserve theme j. SNDK on 2026-05-14
      17:01:44 ET: 'AI Memory & Storage' (i, 8 tickers, established)
      was stripped to preserve 'Semiconductor Front-End Interconnect &
      Wafer Processing Equipment' (j, 3 tickers, newer). SNDK +
      2 others migrated to the smaller new theme.

      Fix shipped 2026-05-14 (BOTH_PROTECTED tiebreaker):
      `theme_engine.py:2750-2754`: when both i and j are protected AND
      len(tickers_i) >= len(tickers_j), strip from j instead of i.
      The larger/equal protected theme keeps the intersection — preserves
      the more-established theme's membership.

      Audit log evidence post-fix (2026-05-15 onwards): no protect_strip
