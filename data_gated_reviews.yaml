        ROKU  +6.1% close  / stopped 09:32  (-1R)
        PWR   +15.8% close / filled, held   (+0.99R)
        ELVR  +7.9% close  / stopped 10:24  (-1R)
        ARM   +14.8% close / stopped 09:55  (-1R)
        DFTX  +2.2% close  / stopped 09:32  (-1R)
      Net: 1/6 win, -3.01R total, -0.50R avg. Five of six closed green but
      stopped intraday — the early-dip-then-recover pattern blew through
      ORB-low. PWR is the lone hold-to-close winner.
      Methodology caveat (advisor): MAGNA53 zero-rates float/neglect/vol_conv
      for large-caps near 52w highs by design (Qullamaggie/Pradeep doctrine).
      PWR's "institutional gap" shape may belong in a separate detector
      class (Institutional Gap), not a MAGNA53 floor patch. n=6 too small
