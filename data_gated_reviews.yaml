  - review_id: ep_selectivity_deep_dive
    title: "EP entry selectivity overhaul — EXHAUSTIVE review of every tracked variable"
    question: |
      **User mandate 2026-05-14**: Current EP system fires on essentially
      every earnings gap-up during earnings season. Past 10 trading days:
      87 HIGH alerts (8.7/day average; 11 on 5/14 alone). Almost all
      graded `catalyst_quality='strong'` — near-zero `game_changer`
      discrimination. Linear extrapolation: ~180/month → ~550/quarter.

      **Target**: EPs should be RARE — "a handful per quarter, not 100+."
      50-100x reduction in entry rate. Pradeep/Qullamaggie methodology
      accepts low win rates IF entries are exceptional setups. Current
      selectivity admits every earnings gapper, then depends on stop-loss
      to manage risk. Result: trade-by-trade losses compound; win rate
      stays low because entries lack edge.

      **Specific examples flagged**:
      - NBIS (2026-05-13): 700%+ revenue growth — truly game-changing.
        Missed by M&A direction-blind bug (fix 446f700), but ALSO would
        have been graded only "strong" not "game_changer". Grader
        doesn't see fundamentals magnitude.
      - 5/14 cohort: 11 HIGH alerts → 3 traded (CRMD/KLAR/CSCO) → 0
        winners. Methodology cohort -$2,041 over 4 trades (excluding
        bug).

      **EXHAUSTIVE LIST of variables in play — Phase 1 must evaluate ALL**

      ### A. Existing entry filters (already coded)
      A1. Gap percentage (≥8% floor; scoring tiers 20%+ / 15%+ / 10%+ / 8-9%)
      A2. Pre-market RVOL@T (`MIN_PM_RVOL=1.0`)
      A3. Session RVOL@T post-9:30 (`MIN_SESSION_RVOL=1.0`)
      A4. Pre-market shares absolute floor (25K, with pm_rvol≥5x carve-out)
      A5. ADV dollar volume min ($1M floor)
      A6. ATR% ceiling (≤15%)
      A7. Market cap floor (≥$500M)
      A8. Prev-close ≥ $5
      A9. Extension cap (prev_close > 1.50× SMA-10 → skip)
      A10. 60-day EP cooldown (with earnings-day bypass at ≥15% gap)
      A11. Already-scored-today dedup
      A12. M&A filter (direction-aware after 446f700 fix)
      A13. Stop-too-wide rejection (ORB range > 1.5× ATR) —
            already its own review `stop_too_wide_outcome_cohort` (N=2)
      A14. Fade guard (`fade_midpoint_ratio` 0.25 for 9M Day 2; MAGNA53 skipped)
      A15. ORB submission window cutoff (9:31 ≤ now < 9:45 ET)
      A16. Strategy_position_cap (#65 per-strategy slot limit)
      A17. Daily loss limit / circuit breaker / drawdown breaker — gates
            new entries but doesn't influence selectivity

      ### B. Existing scoring weights (already coded)
      B1. Gap magnitude points (20%+=25, 15%+=20, 10%+=15, 8-9%=10)
      B2. Catalyst quality points (game_changer=25, strong=15, routine=0)
      B3. Relative volume points (5x+=15, 2-4x=10, 1-2x=5)
      B4. Neglect period points (6mo+=15, 3mo=8, <3mo=0)
      B5. Volume conviction (pm vol ≥90th pct=5, ≥70th=3)
      B6. Analyst upgrades (3+=5)
      B7. Low float (<50M shares=5)
      B8. Bull regime multiplier (1.2x)
      B9. Perplexity agreement multiplier (1.2x; stacks with regime)
      B10. Score threshold (HIGH ≥ ep_threshold regime-dependent;
           MODERATE 50-69)
      B11. Earnings-day pre-score boost (routine→strong if is_earnings_day)
      B12. MODERATE→HIGH override on earnings (gap≥15% + earnings_day)

      ### C. Entry-mechanic dimensions (already tracked, parallel telemetry)
      C1. **5-min ORB shadow** (`mi_orb_shadow_trades`) vs 1-min live
          — would 5-min entries have better R? Existing shadow data.
      C2. Re-entry attempts (Day-1 attempt 1 vs attempt 2 win rates)
      C3. Stop placement: ORB-low (current) vs ATR-based vs prior-day-low
      C4. Position sizing: 1% risk fixed vs scaled by conviction score
      C5. Entry order type: stop-limit (current) vs market-on-trigger
      C6. ORB cutoff extension review (filed separately
          `orb_cutoff_extension`)
      C7. Fade guard tier — 9M Day 2 uses 0.25; MAGNA53 skipped;
          should MAGNA53 also use a tier?

      ### D. NEW filter dimensions (user-specified — not yet in code)
      D1. **Catalyst fundamentals magnitude** — revenue growth tier
          (50%+, 100%+, 300%+ YoY), guidance raise magnitude vs
          consensus, margin expansion / FCF inflection, sequential
          acceleration. Requires structured earnings fetch (Polygon
          `/v3/financials` or similar), not just LLM-grading press
          release.
      D2. **Gap-above-key-MAs** — 10/20/50/200d. Gapping THROUGH MA
          resistance is fundamentally different from gapping in
          mid-range.
      D3. **Gap-above-price-congestion** — volume profile / prior
          consolidation. Likely needs minute-bar volume by price
          analysis over prior 20-90 days.
      D4. **Distance to round numbers** — $50/$100/$200 psychological
          resistance. Cheap heuristic, possibly high-signal.
      D5. **Prior base shape** — rectangle / flag / VCP vs no base /
          extended. Methodology-specific; needs base detection (mostly
          in flag_detector.py already).
      D6. **Distance from 52-week high** — leaders gap to FRESH highs.
          Already-near-high before gap = continuation; far-from-high =
          recovery (different setup class).
      D7. **Multi-quarter context** — 1st EP after base vs Nth in trend.
          Pradeep's methodology specifically targets EPs after NEGLECT.

      ### E. Setup-context dimensions (related-system signal)
      E1. **Theme membership** — is the ticker in an active Accelerating
          or Mainstream theme? Leaders gapping into themes have
          different prior probability. Theme engine tracks this; just
          needs join.
      E2. **Sector rotation** — is the ticker's sector hot? Theme rs_avg
          data.
      E3. **Continuation flag overlap** — is the ticker already COILED
          per flag_detector? Strong continuation signal.
      E4. **9M Day 2 cohort comparison** — sister methodology with
          different criteria. Cross-tab outcomes.
      E5. **Missed-EP outcomes by skip-reason** — already tracked in
          `mi_ep_missed_outcomes`. Which existing filters shed winners?
          Direct read of opportunity cost per gate.

      ### F. Already-shipped recent gate changes (evaluate effectiveness)
      F1. Catalyst hedge-phrase downgrade (2026-05-03) — did downgrades
          improve win rate vs admits?
      F2. Earnings-day pre-score boost (2026-05-08) — did the boost
          admit net winners or losers? Audit `catalyst_earnings_boost`.
      F3. EP cooldown bypass on earnings (2026-05-08) — outcomes of
          bypassed-cooldown alerts.
      F4. Re-entry gap-through gate (2026-05-11 #73) — outcomes by
          gate decision.
      F5. Pre-market shares relative-anomaly carve-out (2026-05-08) —
          carve-out admits vs absolute-floor blocks.

      ### G. Post-EP entry-timing CLASS (user case studies 2026-05-14)
      User flagged 4 cases that crystallize a hypothesis: EPs split into
      TWO classes that need DIFFERENT entry tactics:

      G1. **Class A — Explosive gap-and-go** (current MAGNA53 ORB capture)
          Gaps up, runs immediately, ORB-high entry within 9:31-9:45 ET
          window works. This is what the current system targets.

      G2. **Class B — Delayed EP** (Pradeep Bonde nomenclature;
          currently UNCAPTURED). EP day fires on catalyst (gap +
          volume) but doesn't immediately follow through. Stock then
          DIGESTS — could be intraday only, could be days or weeks —
          before the real breakout. Entry tactic per Pradeep: anchor
          off the EP-day's low (catalyst-day low) as risk reference,
          watch for breakout of the digestion structure. Risk-managed
          off EP-day low + nearby 20MA confluence.

          Two sub-shapes within delayed EP:
          (B-intra) Same-day digest, breaks out post-ORB-cutoff. 620
              method (OWL trader, 6/20 EMA cross) is one tactical
              framework (https://theowltrader.com/2023/05/25/
              tools-of-the-trade-the-620-chart/). ONDS/KLAR 5/14
              fit here.
          (B-multi) Multi-day/week digest, eventual breakout. EP-day
              low + 20MA = risk anchor; breakout above digest range
              = entry trigger. TRT 4/23 → 5/15 fits here (3-week
              digest, then +43% explosive breakout on 5/15).

          Both sub-shapes share the principle: ORB-day-of capture
          (MAGNA53) is the wrong mechanic. The EP signal is correct;
          the entry timing is delayed.

          User uses the "620 method" by OWL trader for intraday entry
          framework on these (https://theowltrader.com/2023/05/25/
          tools-of-the-trade-the-620-chart/). Key primitives: 6 EMA / 20
          EMA cross, candle pattern, basing structure.

      ### Case studies — preserve for Friday Phase 1 analysis

      **ONDS 2026-05-14**: Class B. Gap with strong technicals (above
      10/20/50 MAs, multi-month base). 1-min ORB entry stopped TWICE
      before working the 3rd time. 620 method entry signal flashed
      ~7:25 PT (10:25 ET) — past our 10:00 ET ORB cutoff. Currently
      uncaptured. The setup was real, the timing was wrong for our
      pipeline.

      **CPA 2026-05-14**: EP FIRED AFTER ORB window — gap happened
      pre-open, earnings the previous night, MAs cleared, basing
      structure. Why did the EP detector fire late? Investigate
      latency in mi_ep_scan_log: scan_time_et vs first eligible
      tick. Possible causes: pre-market RVOL gate not satisfied
      until later, catalyst grading turnaround latency, snapshot
      cache staleness.

      **KLAR 2026-05-14**: Class B variant. Entered once today,
      stopped with loss. SECOND signal ~7:10 PT (10:10 ET, just past
      ORB cutoff) would have worked. Reinforces ONDS pattern —
      second-chance entries within 30-60 min post-ORB-cutoff are
      losing real alpha.

      **CSCO 2026-05-14**: counter-example for catalyst grading.
      11% earnings growth, 10% revenue growth — "hardly
      transformative" per user. Large-cap AI catch-up play. Current
      grader called this "strong"; by fundamentals-magnitude rubric
      this is at most "routine+". Entered, stopped. User nuance:
      not that CSCO won't work, but it's the wrong ENTRY TACTIC —
      Class A explosive ORB-high doesn't fit. Class B "let it base
      and see" might.

      ### Missed-winners cohort (user-flagged 2026-05-14)
      EPs that worked out OK/well recently. Apollo entered ZERO of
      these successfully. This is the false-NEGATIVE side of the
      selectivity problem — the system is BOTH firing too many
      losers AND missing real winners. Each case is a labeled
      fixture for Phase 1 diagnosis.

      For each, Phase 1 must determine: was it filtered (which
      gate?), under-scored (score band threshold?), wrong-class
      (Class B uncaptured?), or wrong-entry (signal fired but ORB
      timing wrong)?

      - **OSS** — small-cap AI hardware
      - **STRL** — 5/05 was rejected by `setup:stop_too_wide` (ORB
        range > 1.5× ATR). 5d close +17.0%, 5d max +22.2%. Already
        the trigger case for the `stop_too_wide_outcome_cohort`
        review (N=2 of 10 currently). Strong signal — stop-too-wide
        filter is shedding winners.
      - **FTNT** — 5/7→5/8 was the TI5 origin case. HIGH EP score
        96 on 5/7, +6% follow-through 5/8. Failed EVERY existing
        post-EP detector (no undercut for fishhook, close-in-range
        0.44 not 0.75 for sugar baby, no base for continuation
        flag). "Mid-range close that continues anyway" — exactly
        the Class B shape from §G.
      - **TWLO** — investigated earlier this session (scripts
        replay_twlo_reentry.py + replay_twlo_sameday.py exist as
        diagnostic artifacts). Likely re-entry / Day-2 ORB class.
      - **BAND** — cloud comms / VoIP. Appears in recent theme
        assignment candidate pools (uncovered). Likely no theme
        anchor + low pm_rvol.
      - **MXL** — optical components. Was 2026-05-09 theme
        assignment under-anchoring case (was uncovered despite
        top-30 RS); manually anchored 5/9. EP miss is probably
        separate — investigate why no EP alert fired on its move.
      - **HIMX** — 2026-05-07 was rejected by 60-day EP cooldown.
        Gap +28%, pm_rvol 65×. Earnings catalyst was the cooldown
        bypass trigger case (shipped 2026-05-08). HIMX miss
