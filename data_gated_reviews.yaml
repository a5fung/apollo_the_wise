  - review_id: ep_selectivity_deep_dive
    title: "EP entry selectivity overhaul — EXHAUSTIVE review of every tracked variable"
    question: |
      **User mandate 2026-05-14**: Current EP system fires on essentially
      every earnings gap-up during earnings season. Past 10 trading days:
      87 HIGH alerts (8.7/day average; 11 on 5/14 alone). Almost all
      graded `catalyst_quality='strong'` — near-zero `game_changer`
      discrimination. Linear extrapolation: ~180/month → ~550/quarter.

      **Target**: EPs should be RARE — "a handful per quarter, not 100+."
      50-100x reduction in entry rate. Pradeep/Qullamaggie methodology
      accepts low win rates IF entries are exceptional setups. Current
      selectivity admits every earnings gapper, then depends on stop-loss
      to manage risk. Result: trade-by-trade losses compound; win rate
      stays low because entries lack edge.

      **Specific examples flagged**:
      - NBIS (2026-05-13): 700%+ revenue growth — truly game-changing.
        Missed by M&A direction-blind bug (fix 446f700), but ALSO would
        have been graded only "strong" not "game_changer". Grader
        doesn't see fundamentals magnitude.
      - 5/14 cohort: 11 HIGH alerts → 3 traded (CRMD/KLAR/CSCO) → 0
        winners. Methodology cohort -$2,041 over 4 trades (excluding
        bug).

      **EXHAUSTIVE LIST of variables in play — Phase 1 must evaluate ALL**

      ### A. Existing entry filters (already coded)
      A1. Gap percentage (≥8% floor; scoring tiers 20%+ / 15%+ / 10%+ / 8-9%)
      A2. Pre-market RVOL@T (`MIN_PM_RVOL=1.0`)
      A3. Session RVOL@T post-9:30 (`MIN_SESSION_RVOL=1.0`)
      A4. Pre-market shares absolute floor (25K, with pm_rvol≥5x carve-out)
      A5. ADV dollar volume min ($1M floor)
      A6. ATR% ceiling (≤15%)
      A7. Market cap floor (≥$500M)
      A8. Prev-close ≥ $5
      A9. Extension cap (prev_close > 1.50× SMA-10 → skip)
      A10. 60-day EP cooldown (with earnings-day bypass at ≥15% gap)
      A11. Already-scored-today dedup
      A12. M&A filter (direction-aware after 446f700 fix)
      A13. Stop-too-wide rejection (ORB range > 1.5× ATR) —
            already its own review `stop_too_wide_outcome_cohort` (N=2)
      A14. Fade guard (`fade_midpoint_ratio` 0.25 for 9M Day 2; MAGNA53 skipped)
      A15. ORB submission window cutoff (9:31 ≤ now < 9:45 ET)
      A16. Strategy_position_cap (#65 per-strategy slot limit)
      A17. Daily loss limit / circuit breaker / drawdown breaker — gates
            new entries but doesn't influence selectivity

      ### B. Existing scoring weights (already coded)
      B1. Gap magnitude points (20%+=25, 15%+=20, 10%+=15, 8-9%=10)
      B2. Catalyst quality points (game_changer=25, strong=15, routine=0)
      B3. Relative volume points (5x+=15, 2-4x=10, 1-2x=5)
      B4. Neglect period points (6mo+=15, 3mo=8, <3mo=0)
      B5. Volume conviction (pm vol ≥90th pct=5, ≥70th=3)
      B6. Analyst upgrades (3+=5)
      B7. Low float (<50M shares=5)
      B8. Bull regime multiplier (1.2x)
      B9. Perplexity agreement multiplier (1.2x; stacks with regime)
      B10. Score threshold (HIGH ≥ ep_threshold regime-dependent;
           MODERATE 50-69)
      B11. Earnings-day pre-score boost (routine→strong if is_earnings_day)
      B12. MODERATE→HIGH override on earnings (gap≥15% + earnings_day)

      ### C. Entry-mechanic dimensions (already tracked, parallel telemetry)
      C1. **5-min ORB shadow** (`mi_orb_shadow_trades`) vs 1-min live
          — would 5-min entries have better R? Existing shadow data.
      C2. Re-entry attempts (Day-1 attempt 1 vs attempt 2 win rates)
      C3. Stop placement: ORB-low (current) vs ATR-based vs prior-day-low
      C4. Position sizing: 1% risk fixed vs scaled by conviction score
      C5. Entry order type: stop-limit (current) vs market-on-trigger
      C6. ORB cutoff extension review (filed separately
          `orb_cutoff_extension`)
      C7. Fade guard tier — 9M Day 2 uses 0.25; MAGNA53 skipped;
          should MAGNA53 also use a tier?

      ### D. NEW filter dimensions (user-specified — not yet in code)
      D1. **Catalyst fundamentals magnitude** — revenue growth tier
          (50%+, 100%+, 300%+ YoY), guidance raise magnitude vs
          consensus, margin expansion / FCF inflection, sequential
          acceleration. Requires structured earnings fetch (Polygon
          `/v3/financials` or similar), not just LLM-grading press
          release.
      D2. **Gap-above-key-MAs** — 10/20/50/200d. Gapping THROUGH MA
          resistance is fundamentally different from gapping in
          mid-range.
      D3. **Gap-above-price-congestion** — volume profile / prior
          consolidation. Likely needs minute-bar volume by price
          analysis over prior 20-90 days.
      D4. **Distance to round numbers** — $50/$100/$200 psychological
          resistance. Cheap heuristic, possibly high-signal.
      D5. **Prior base shape** — rectangle / flag / VCP vs no base /
          extended. Methodology-specific; needs base detection (mostly
          in flag_detector.py already).
      D6. **Distance from 52-week high** — leaders gap to FRESH highs.
          Already-near-high before gap = continuation; far-from-high =
          recovery (different setup class).
      D7. **Multi-quarter context** — 1st EP after base vs Nth in trend.
          Pradeep's methodology specifically targets EPs after NEGLECT.

      ### E. Setup-context dimensions (related-system signal)
      E1. **Theme membership** — is the ticker in an active Accelerating
          or Mainstream theme? Leaders gapping into themes have
          different prior probability. Theme engine tracks this; just
          needs join.
      E2. **Sector rotation** — is the ticker's sector hot? Theme rs_avg
          data.
      E3. **Continuation flag overlap** — is the ticker already COILED
          per flag_detector? Strong continuation signal.
      E4. **9M Day 2 cohort comparison** — sister methodology with
          different criteria. Cross-tab outcomes.
      E5. **Missed-EP outcomes by skip-reason** — already tracked in
          `mi_ep_missed_outcomes`. Which existing filters shed winners?
          Direct read of opportunity cost per gate.

      ### F. Already-shipped recent gate changes (evaluate effectiveness)
      F1. Catalyst hedge-phrase downgrade (2026-05-03) — did downgrades
          improve win rate vs admits?
      F2. Earnings-day pre-score boost (2026-05-08) — did the boost
          admit net winners or losers? Audit `catalyst_earnings_boost`.
      F3. EP cooldown bypass on earnings (2026-05-08) — outcomes of
          bypassed-cooldown alerts.
      F4. Re-entry gap-through gate (2026-05-11 #73) — outcomes by
          gate decision.
      F5. Pre-market shares relative-anomaly carve-out (2026-05-08) —
          carve-out admits vs absolute-floor blocks.

      ### G. Post-EP entry-timing CLASS (user case studies 2026-05-14)
      User flagged 4 cases that crystallize a hypothesis: EPs split into
      TWO classes that need DIFFERENT entry tactics:

      G1. **Class A — Explosive gap-and-go** (current MAGNA53 ORB capture)
          Gaps up, runs immediately, ORB-high entry within 9:31-9:45 ET
          window works. This is what the current system targets.

      G2. **Class B — Delayed EP** (Pradeep Bonde nomenclature;
          currently UNCAPTURED). EP day fires on catalyst (gap +
          volume) but doesn't immediately follow through. Stock then
          DIGESTS — could be intraday only, could be days or weeks —
          before the real breakout. Entry tactic per Pradeep: anchor
          off the EP-day's low (catalyst-day low) as risk reference,
          watch for breakout of the digestion structure. Risk-managed
          off EP-day low + nearby 20MA confluence.

          Two sub-shapes within delayed EP:
          (B-intra) Same-day digest, breaks out post-ORB-cutoff. 620
              method (OWL trader, 6/20 EMA cross) is one tactical
              framework (https://theowltrader.com/2023/05/25/
              tools-of-the-trade-the-620-chart/). ONDS/KLAR 5/14
              fit here.
          (B-multi) Multi-day/week digest, eventual breakout. EP-day
              low + 20MA = risk anchor; breakout above digest range
              = entry trigger. TRT 4/23 → 5/15 fits here (3-week
              digest, then +43% explosive breakout on 5/15).

          Both sub-shapes share the principle: ORB-day-of capture
          (MAGNA53) is the wrong mechanic. The EP signal is correct;
          the entry timing is delayed.

          User uses the "620 method" by OWL trader for intraday entry
          framework on these (https://theowltrader.com/2023/05/25/
          tools-of-the-trade-the-620-chart/). Key primitives: 6 EMA / 20
          EMA cross, candle pattern, basing structure.

      ### Case studies — preserve for Friday Phase 1 analysis

      **ONDS 2026-05-14**: Class B. Gap with strong technicals (above
      10/20/50 MAs, multi-month base). 1-min ORB entry stopped TWICE
      before working the 3rd time. 620 method entry signal flashed
      ~7:25 PT (10:25 ET) — past our 10:00 ET ORB cutoff. Currently
      uncaptured. The setup was real, the timing was wrong for our
      pipeline.

      **CPA 2026-05-14**: EP FIRED AFTER ORB window — gap happened
      pre-open, earnings the previous night, MAs cleared, basing
      structure. Why did the EP detector fire late? Investigate
      latency in mi_ep_scan_log: scan_time_et vs first eligible
      tick. Possible causes: pre-market RVOL gate not satisfied
      until later, catalyst grading turnaround latency, snapshot
      cache staleness.

      **KLAR 2026-05-14**: Class B variant. Entered once today,
      stopped with loss. SECOND signal ~7:10 PT (10:10 ET, just past
      ORB cutoff) would have worked. Reinforces ONDS pattern —
      second-chance entries within 30-60 min post-ORB-cutoff are
      losing real alpha.

      **CSCO 2026-05-14**: counter-example for catalyst grading.
      11% earnings growth, 10% revenue growth — "hardly
      transformative" per user. Large-cap AI catch-up play. Current
      grader called this "strong"; by fundamentals-magnitude rubric
      this is at most "routine+". Entered, stopped. User nuance:
      not that CSCO won't work, but it's the wrong ENTRY TACTIC —
      Class A explosive ORB-high doesn't fit. Class B "let it base
      and see" might.

      ### Missed-winners cohort (user-flagged 2026-05-14)
      EPs that worked out OK/well recently. Apollo entered ZERO of
      these successfully. This is the false-NEGATIVE side of the
      selectivity problem — the system is BOTH firing too many
      losers AND missing real winners. Each case is a labeled
      fixture for Phase 1 diagnosis.

      For each, Phase 1 must determine: was it filtered (which
      gate?), under-scored (score band threshold?), wrong-class
      (Class B uncaptured?), or wrong-entry (signal fired but ORB
      timing wrong)?

      - **OSS** — small-cap AI hardware
      - **STRL** — 5/05 was rejected by `setup:stop_too_wide` (ORB
        range > 1.5× ATR). 5d close +17.0%, 5d max +22.2%. Already
        the trigger case for the `stop_too_wide_outcome_cohort`
        review (N=2 of 10 currently). Strong signal — stop-too-wide
        filter is shedding winners.
      - **FTNT** — 5/7→5/8 was the TI5 origin case. HIGH EP score
        96 on 5/7, +6% follow-through 5/8. Failed EVERY existing
        post-EP detector (no undercut for fishhook, close-in-range
        0.44 not 0.75 for sugar baby, no base for continuation
        flag). "Mid-range close that continues anyway" — exactly
        the Class B shape from §G.
      - **TWLO** — investigated earlier this session (scripts
        replay_twlo_reentry.py + replay_twlo_sameday.py exist as
        diagnostic artifacts). Likely re-entry / Day-2 ORB class.
      - **BAND** — cloud comms / VoIP. Appears in recent theme
        assignment candidate pools (uncovered). Likely no theme
        anchor + low pm_rvol.
      - **MXL** — optical components. Was 2026-05-09 theme
        assignment under-anchoring case (was uncovered despite
        top-30 RS); manually anchored 5/9. EP miss is probably
        separate — investigate why no EP alert fired on its move.
      - **HIMX** — 2026-05-07 was rejected by 60-day EP cooldown.
        Gap +28%, pm_rvol 65×. Earnings catalyst was the cooldown
        bypass trigger case (shipped 2026-05-08). HIMX miss
        predates the bypass — verify post-bypass behavior.
      - **INOD** — appears in cohort lists from recent audits.
        Theme: AI / data services. Investigate gate.
      - **DDOG** — 2026-05-07 scored 30 every tick (gap 19-31%,
        pm_rvol 30-89×) — blocked by `score < 50 catalyst=routine`.
        Earnings-day pre-score boost shipped 2026-05-08 to fix
        this exact case. User now confirms DDOG worked out — boost
        was the right move. Verify boost is firing in production
        for similar cases going forward.
      - **TRT (2026-04-23 → 2026-05-15)** — **Delayed EP per Pradeep
        Bonde** (Class B-multi exemplar). 9M EP on 4/23 (+33% gap,
        31M vol on catalyst). Then 3-week digest in $10.50-$16.50
        range. Two lose days 5/12-5/13 broke below EP-day low
        ($10.76 intraday); 5/14 recovered ($12.00 → $14.02 close);
        5/15 explosive breakout ($14.90 → $20.05 close, +43% on
        4.6M vol). User entered manually using **EP-day low + nearby
        20MA as risk reference** — textbook Pradeep anticipation
        entry tactic. NOT an ORB-high entry. Exactly the pattern
        that MAGNA53 ORB-day-of capture misses by design.
        Methodology vocabulary: this is the OG case to design
        Apollo's anticipation capture mechanic around — anchor on
        EP-day's low, watch the digest range, breakout-of-range +
        20MA confluence = trigger. Apollo's flag detector also
        labeled 5/14 + 5/15 TIGHTENING (semantically wrong — those
        were explosive breakouts, not contraction). Separate
        `flag_detector_post_breakout_label` review filed below.

      Phase 1 cross-tab: for each name, pull
        - mi_ep_alerts (was alert generated? score / tier / catalyst)
        - mi_ep_scan_log (filtered? which skip_reason?)
        - mi_ep_missed_outcomes (5d / 20d forward returns)
        - mi_live_trades (did entry attempt fire? skip_reason if not)
      Then categorize each miss by mechanism:
        (a) Pre-scan filter blocked (ADV / mcap / extension / cooldown / M&A)
        (b) Score below tier threshold (catalyst grading too conservative)
        (c) Stop-too-wide / fade-guard / ORB window cutoff
        (d) Class B (Apollo never had an entry mechanic for this shape)
        (e) Theme/sector context missed (would have entered if surfaced)
        (f) Other (timing, infra, data corruption)

      Mechanism (d) Class B reinforces the §G hypothesis — separate
      tactic needed.
      Mechanism (b) reinforces the catalyst-magnitude (D1) hypothesis.
      Mechanism (c) reinforces the orb_cutoff_extension /
      stop_too_wide_outcome_cohort reviews.

      ### G implications for Phase 1
      - Cross-tab existing alerts × (Class A vs Class B) using
        proxy: did the 1-min ORB-high get hit within 14 minutes
        post-9:31 (Class A) vs later (Class B)?
      - Measure win rate / R-expectancy by class. Hypothesis:
        Class A success conditional on fundamentals-magnitude (D1);
        Class B requires a different entry signal AND probably
        looser cutoff or basing-detection.
      - Related to existing `orb_cutoff_extension` review (filed
        for 7/15) — user's case studies materially strengthen the
        case for revisiting that window.
      - 620 method is a candidate signal framework for Class B
        detection. Feasibility prototype in Phase 1.3 as D7:
        "intraday basing-then-breakout" detector.

      **Working hypothesis** (test before shipping):
        Single biggest selectivity gate is "earnings is actually
        game-changing magnitude" (D1). NBIS-class. Most earnings
        gappers are routine beats. Fundamentals-magnitude filter alone
        could drop alert volume 80%+ while keeping best setups.

        Technical structure (D2/D3/D4/D5/D6) likely adds further
        selectivity at modest cost — Phase 1 measures contribution.

        Setup-context (E) and entry-mechanic (C) dimensions are
        likely tiebreakers — small gains over fundamentals + technical
        primary filter. But C1 (5-min vs 1-min ORB) is structurally
        independent — could be a separate ship (better entries on
        same selectivity).

        Volume / multi-quarter (B3/B4) are existing scoring weights
        likely under-calibrated. Re-weight from outcome data.

        **Class A vs Class B split** (G) is structurally orthogonal
        to fundamentals/technicals — even after we pick the right
        SETUPS, we still need different ENTRY TACTICS per class.
        Phase 1 must measure class split rates and per-class outcomes
        as a first-order analysis, not a tiebreaker. If 50%+ of
        otherwise-good setups are Class B, fixing only selectivity
        without addressing entry timing leaves real alpha on the
        table.
    predicate_sql: |
      -- Predicate data already exists: 60d EP scan history has ~500+ rows
      -- (87 in last 10d alone). Phase 1 diagnostic can start any time.
      -- Phase 2 (shadow telemetry) is what needs 30 days of new data;
      -- Phase 3 (ship) needs N>=20 shadow settled.
      SELECT COUNT(*) FROM (
        SELECT 1 FROM mi_ep_alerts WHERE alert_date >= CURRENT_DATE - 60
        UNION ALL
        SELECT 1 FROM mi_live_trades
        WHERE account_mode='paper' AND status='closed'
          AND closed_at >= CURRENT_DATE - 30
      ) t;
    threshold: 100
    discriminates_on: [mi_live_trades.signal_type, mi_live_trades.account_mode]  # backfilled 2026-08-30 (#573) from the verified 2026-08-17 table->column mapping
    earliest_review_date: 2026-05-17
    action_when_ready: |
      **PHASE 1 — DIAGNOSTIC BASELINE (no code change yet)**

      Goal: produce a wide-cohort outcome table joining every tracked
      attribute to settled forward returns. Single-pass analysis;
      output is a spreadsheet/table the operator can review.

      ## P1.1 — Master cohort table
      For every `mi_ep_alerts` row in last 60d, join:
        - mi_ep_scan_log (last tick before alert: rank_by_gap,
          projected_vol_multiple, pm_rvol, adv, adv_source)
        - mi_live_trades (entry/exit if traded; pnl_attribution filter)
        - mi_ep_scan_outcomes (5d forward return)
        - mi_orb_shadow_trades (5-min ORB outcome — C1 dimension)
        - mi_ep_missed_outcomes (per-skip-reason outcomes for SKIPPED)
        - mi_themes (theme membership / stage — E1/E2)
        - mi_flag_candidates (COILED overlap — E3)
        - mi_daily_closes (prior 20d for MA distance + base context —
          D2/D5/D6/D7)
      Materialize as a view or CSV export for analysis.

      ## P1.2 — Per-dimension outcome breakdown
      Each variable in §A–§F produces a 2×N table (alert count, win
      count, avg pnl, R-expectancy) bucketed by the variable. Examples:

        - Gap size: 8-10% / 10-15% / 15-25% / 25%+ → win rate, avg R
        - Catalyst quality: routine / strong / game_changer → outcomes
        - pm_rvol: 1-2x / 3-5x / 5-10x / 10x+ → outcomes
        - Score tier: MOD-low / MOD-high / HIGH-low / HIGH-mid / HIGH-high
        - Score band promotion path (B11 earnings boost, B12 override):
          admitted by boost → win rate vs other-path admits
        - Entry attempt: 1 vs 2 win rates
        - 5-min ORB vs 1-min: paired comparison for same alert
        - Theme membership: in-theme vs uncovered
        - Time of alert: pre-market vs 9:30-9:44 vs 9:45+
        - Catalyst hedge-phrase downgrade: downgraded vs admitted
        - EP cooldown bypass on earnings: bypassed vs blocked outcomes
        - Re-entry gap-through gate: gated vs admitted outcomes
        - pm-shares relative-anomaly carve-out: admitted-by-carve-out
          win rate
        - Missed-EP by skip-reason: per-category win rate among
          rejected — which gates shed winners?

      ## P1.3 — NEW-dimension feasibility prototypes
      Build minimal prototypes for §D dimensions (data-fetch + score):

        D1. Earnings fundamentals fetch — try Polygon `/v3/financials`
            on past 50 EPs. Capture: revenue_growth_yoy, eps_beat_pct,
            guidance_change_pct (if available). Label which would have
            been game_changer vs strong vs routine by magnitude
            thresholds.
        D2. MA-distance signal — for each alert, compute
            close_at_alert / SMA(10/20/50/200). Score "gapping THROUGH"
            (close > SMA-X by less than today's range) vs "mid-range".
        D3. Volume profile / congestion — for prior 20d, build
            price-bucket volume histogram. Distance from
            high-volume zone to gap close.
        D4. Round-number distance — abs(close - nearest($10, $25, $50,
            $100, $250)) as a fraction of ATR.
        D5. Base shape — borrow flag_detector's COILED/TRIGGERED logic.
        D6. 52-week-high distance — close / max(close, 252d) as fraction.

      For each prototype, eyeball the labeled distribution: does the
      signal separate winners from losers visually?

      ## P1.4 — Catalyst-prose labeled training set
      Pull all "strong"-graded catalysts from past 60d (~400-500).
      Operator labels each:
        - True game_changer (NBIS-class — 100%+ revenue growth, guidance
          raise, segment inflection)
        - True strong (clean beat + raise, but not 10x magnitude)
        - Routine mis-labeled (single-digit beat, no inflection)
        - Other (M&A leak, hedge phrase that should've downgraded)
      Output: labeled CSV that can train a refined catalyst classifier
      (LLM with magnitude rubric, or rule-based fundamentals filter).

      ## P1.5 — Score-weight recalibration
      Using the master cohort, fit a simple linear/logistic regression
      of forward 5d R against existing scoring components (gap pts,
      catalyst pts, rel_vol pts, neglect pts, etc.). Compare fitted
      weights to current hardcoded weights. Identify under-weighted
      and over-weighted dimensions.

      ## P1.6 — Class A vs Class B split (per §G — user case studies)
      For each historical HIGH alert, classify post-EP shape:
        - Class A (gap-and-go): 1-min ORB-high broken within 14 min of
          open (i.e. by 9:45 ET), and held above for ≥5 min.
        - Class B (gap-digest-breakout): ORB-high not broken in window,
          OR broken but immediately stopped back below; then a later
          intraday consolidation low forms and gets broken upward
          (proxy: first 5-min high made after 10:00 ET that exceeds
          all preceding session highs).
        - Class C (fade): ORB-low broken, no recovery.

      Compute by class:
        - Distribution (% Class A / B / C in cohort)
        - Per-class win rate, R-expectancy, max-favorable-excursion
        - Class A × fundamentals-magnitude (D1) interaction
        - Class B × technical-structure (D2-D5) interaction

      Use today's 2026-05-14 case studies as labeled fixtures:
        - ONDS = Class B (1-min stopped 2x, 3rd worked; 620 signal 10:25 ET)
        - CPA  = Class B (also a late EP-detector fire — separate
                 latency investigation)
        - KLAR = Class B partial (entered Class A, stopped; Class B
                 entry at 10:10 ET worked)
        - CSCO = wrong-class-for-setup (Class A entry attempted but
                 fundamentals didn't support explosive class)

      If Class B is 30%+ of HIGH alerts, the recommendation is a
      parallel entry path, not just a selectivity tightening. Filed
      as cross-reference to `orb_cutoff_extension` review — user's
      observations materially strengthen that case.

      Candidate Class B entry-signal framework: OWL trader 620 method
      (6 EMA / 20 EMA cross + candle + basing). Prototype as D7 in
      P1.3 alongside other technical-structure dimensions.

      ## P1.7 — EP detector latency investigation (CPA-class)
      User flagged CPA 2026-05-14 fired AFTER ORB window despite
      pre-open earnings catalyst. Investigate:
        - mi_ep_scan_log: scan_time_et of CPA's first eligible tick
          vs market open
        - Was pre-market RVOL gate not satisfied until later?
        - Was catalyst grading turnaround too slow?
        - Is snapshot cache stale at open?
      Goal: surface late-firing root causes; quantify how many HIGH
      alerts fire AFTER 9:31 ET that should have fired pre-open.

      **PHASE 1 OUTPUT**: one document `docs/decisions/0003-ep-selectivity-overhaul.md`
      with:
        - Cohort outcome breakdowns (tables)
        - Per-dimension separation signal
        - Class A / B / C split + per-class outcomes (§G)
        - Recommended new filters (chosen set, not all candidates)
        - Recommended scoring weight adjustments
        - Recommended scope split: what ships first, what stays shadow
        - Parallel-entry-path proposal IF Class B share ≥30%
        - Late-fire latency findings (CPA-class)

      ---

      **PHASE 2 — SHADOW FILTER TELEMETRY (30-day window)**

      For the filter set chosen in Phase 1, add a single audit event
      `ep_selectivity_filter_shadow` that fires on every current-system
      HIGH alert with:
        - Verdict (would-admit / would-reject)
        - Reject reason (which sub-filter blocked)
        - Forward-return prediction (regression-implied R if shipped)

      Telemetry-only: NO change to actual entries. Run 30 days. Measure:
        - Alert reduction ratio (current vs shadow)
        - Win rate on shadow-admitted vs current cohort
        - R-expectancy on shadow-admitted (target: at least +0.3R better)
        - False-rejection rate: shadow rejects that were winners

      **PHASE 3 — SHIP (after N≥20 shadow alerts settled)**

      Promote shadow filter to live ONLY IF:
        - Shadow-admitted cohort R-expectancy > current cohort
        - Shadow-admitted win rate ≥ current OR shadow-admitted R per win
          materially higher
        - No single dimension dominates (avoid overfit to one ticker)

      Concrete deliverable types (pick from):
        - Fundamentals-magnitude gate (D1) — new earnings_grade column
          on mi_ep_alerts, populated at scoring time
        - Technical-structure gate (D2/D3 ensemble) — composite score
          column, threshold in ep_threshold
        - Scoring weight tweaks (B-section recalibration)
        - 5-min ORB promotion to primary (C1) — separate ship if
          independently profitable
        - MODERATE-tier drop or promotion-criteria change
        - pm_rvol floor adjustment (B3 → 5x?)

      Each individual ship goes through standard SSoT update flow:
      docs/setups/magna53_ep.md change log entry, backtest evidence,
      reversion-flag.

      **Relation to live cutover**: NOT a hard blocker, but if Gate 3
      paper_r_expectancy_validation stays red (cohort currently
      -$2,041 over 4 methodology trades), this review is the natural
      unblock path. If Gate 3 turns green at current selectivity, this
      review is still worth completing for live-$ risk reduction.

      **Scope warning**: this review is EXHAUSTIVE intentionally — but
      not every dimension ships. Phase 1 picks ~3-5 highest-signal
      dimensions. Avoid scope creep: shipping all 30+ filters at once
      is overfit and unsupportable.

      Origin: 2026-05-14 user mandate. "EP should be rare, a handful
      per quarter, not 100+. Current system is not selective enough."
      Reference: NBIS (700%+ revenue growth, system missed) vs the
      87-alert / 10-day current state.

      **Timeline reality**:
        Phase 1 diagnostic — 1-3 day session. Data already exists.
          Earliest start 2026-05-15 (tomorrow); user signaled
          "tomorrow or over the weekend" so 5/15-5/17 window.
        Phase 2 shadow telemetry — 30-day window after Phase 1.
        Phase 3 ship — N>=20 shadow settled with measurably better R.
        Estimated full path: 5-7 weeks from Phase 1 start.

      Phase 1 entry point: build the master cohort table (P1.1),
      then iterate through P1.2 per-dimension breakdowns and P1.3
      new-dimension prototypes. P1.4 catalyst-prose labeling is
      operator-driven and can run in parallel.

      Cross-references to existing reviews (avoid duplication):
        - stop_too_wide_outcome_cohort — A13 dimension already filed
          separately; N=2/10 currently
        - orb_cutoff_extension — C6 dimension already filed
        - adv_probe_retirement — rank-21-50 cohort outcomes (related to
          B/A1 dimensions)
        - conviction_floor_extension — gap[10,15)+strong cell already
          filed (related to B1/B2)
        - perplexity_hallucination_keyword_leak — affects D1 catalyst
          fetch (filed today)
