         Detects lead patterns ("No recent catalysts", "No direct
         information", "I dont have information" (note ASCII apostrophe
         convert), "Nearest match", "Closest match", "Search results
         reference") in the first 100 chars and returns
         (clean_text, is_disclaimer). Conservative — only strip when
         pattern is in the LEAD, not when it appears mid-content as a
         legitimate quote.

      2. Hook at ep_detector.py (~line 898) before catalyst_texts list
         is built. When is_disclaimer=True, pass empty string for
         catalyst_texts[1] so Polygon news headlines (different source)
         drive the M&A check alone. Emit
