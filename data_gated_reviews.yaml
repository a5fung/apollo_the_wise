      lose/observe gate. Verified: quarterly_review.py:96 runs scripts/_b78_decliner_band_bounce_sign
      al.py, and mi_job_runs shows monthly_backward_check_sweep succeeded 2026-08-01 18:00 ET. The re
      gistry copy was a second surface for a check that now runs itself.
