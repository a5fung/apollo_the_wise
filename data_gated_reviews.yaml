  - review_id: intraday_failed_break_signal_n10
    title: "Intraday failed-break detector (#94 follow-up class)"
    question: |
      Sister detector to #94 (intraday flag-break) and complement to #145
      (idempotency guard for already-broken candidates).

      Mechanic: a ticker that triggers #94 (price crosses base_high with
      volume) but then closes back BELOW base_high before EOD has
      structurally failed the breakout. Operationally distinct from the
      EOD-classified INVALIDATED stage — captured in real-time the
      moment the failure occurs, not at 5:25 PM.

      Hypothesis: failed-break signal predicts negative forward returns
      stronger than just "didn't break" or "broke and held". If
      confirmed, gives operator a real-time exit/avoid signal for
      tickers already in active scrutiny.

      Why deferred (filed 2026-05-28, not shipped same day): adding a
      new methodology detector late in a heavy ship day risks subtle
      bugs that surface only at next-day first-fire (the #94/#95/#96
      shipped detectors all had subtle bugs caught at first-fire).
      Design properly in a fresh session.

    # ⚠ FLAGGED 2026-08-15 (sweep): the proxy population has NEVER occurred — 0 of
    # 160 mi_flag_breaks rows all-time have parent_invalidated_eod=TRUE. The flag is
    # set ONLY by flag_detector's EOD reconcile for SAME-DAY parent invalidation
    # (break_date = the day the parent hit INVALIDATED), i.e. break-then-collapse
    # intraday — apparently never observed. The gate cannot ripen as written; what
    # should count as a "failed break" (e.g. close back below base_high, next-day
    # failure) is detector semantics — operator/design call, not a re-gate here.
    predicate_sql: |
      SELECT COUNT(*) FROM mi_flag_breaks
      WHERE break_date >= CURRENT_DATE - INTERVAL '90 days'
        AND parent_invalidated_eod = TRUE;  -- proxy: these failed by EOD
    threshold: 10
    earliest_review_date: 2026-07-15
    action_when_ready: |
      Phase 1: ship shadow detector that adds 3 columns to
      mi_flag_breaks: `failed_at`, `low_after_break`, `bars_until_fail`.
      Extend existing run_intraday_flag_break_scan to poll today's
      breaks and update on reversal-below-base_high.

      Phase 2 at N≥10: forward-return analysis. Did failed breaks
      avoid losses vs holding through EOD? If signal is positive
      (failed-flag forward return is significantly worse), ship as
      operator-facing alert.

      Phase 3: paper-phase entry/exit gating. Defer to N≥30.

    status: pending
    added_on: 2026-05-28

  - review_id: partial_exit_hardening_n7_clean_cycles
    title: "P0 — Partial-exit architecture stable for N=7 consecutive paper cycles"
    severity: P0
    live_cutover_blocker: true
    question: |
      The partial-exit code path has shipped two distinct bug classes
      in two days (2026-05-27 cancel→new race, 2026-05-28 str-vs-numeric
      Pydantic). Each "fix" broke a different assumed-invariant. Per
      advisor 2026-05-28, the permanent solution is architectural:
      split execute_partial_exit into named pure steps with PERSISTED
      state between each, plus preflight G6 integration test, plus
      outcome-history circuit breaker.

      Full proposal in task #151.

      This review predicate gates live-cutover on PROOF that the
      architecture survives real broker variance — N=7 consecutive
      scheduled partial-exits complete cleanly on paper AFTER the
      architectural split lands.

    predicate_sql: |
      -- Count partial_exit_committed audit events that landed without a
      -- partial_exit_aborted/partial_exit_sell_failed/partial_exit_rollback_failed
      -- companion event for the same trade_id, after the architectural split.
      -- ANCHOR FIXED 2026-08-15: the planned 'partial_exit_architecture_split_deployed'
      -- marker event was NEVER logged by anything (verified 0 rows on prod), so the
      -- old MAX() subselect returned NULL and this count was stuck at 0 FOREVER while
      -- the real quantity accrued (22 partial_exit_committed all-time, 6 post-split).
      -- The split is #361 (commits 59e1245/b68f872, deployed 2026-06-23, verified
      -- live 2026-06-24 QURE 66sh) => literal anchor date below.
      -- WHAT WRITES THE COUNTED QUANTITY: broker/order_manager's 3:45 PM ET
      -- market-hours partials job logs 'partial_exit_committed' per completed partial
      -- (~1-2/week at current cohort); abort/fail companions same trade_id+day mark a
      -- cycle unclean. Value with the fixed anchor on 2026-08-15: 4 of 7, accruing.
      SELECT COUNT(*) FROM (
        SELECT (detail::jsonb)->>'trade_id' AS trade_id
        FROM mi_audit_log
        WHERE event_type = 'partial_exit_committed'
          AND created_at >= '2026-06-23'
          AND NOT EXISTS (
            SELECT 1 FROM mi_audit_log e
            WHERE e.event_type IN (
              'partial_exit_aborted',
              'partial_exit_sell_failed',
              'partial_exit_rollback_failed'
            )
            AND (e.detail::jsonb)->>'trade_id' = (mi_audit_log.detail::jsonb)->>'trade_id'
            AND e.created_at::date = mi_audit_log.created_at::date
          )
