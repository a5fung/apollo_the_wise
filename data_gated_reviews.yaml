      secondaries, today's first red T2108.

      Our system has the same DATA (most of it) but presents it
      one-day-at-a-time in regime + briefing text. We don't see
      "primary indicators have been red 5 days running, now
      secondaries are joining" without manual SQL.

      Two ideation prongs (this review is ideation-only; not
      shipping until shape decided):

      A. **Cluster matrix render** — produce a 10-row × N-column
         table (date × indicator) in a Telegram code block or
         dashboard, color-coded red/green/yellow per cell. Highlight
         vertical runs (consecutive red days in a column) as the
         primary signal. Same data we already have, new shape.

      B. **Compute-vs-surface gap + truly missing indicators** —
         CORRECTION 2026-05-15 (user feedback): we compute MORE than
         the evening briefing surfaces. Inventory:

         COMPUTED AND SURFACED (evening briefing breadth line):
            - 50%/1M ✓ (briefing.py:199-205, `50%/M` label)
            - 25%/3M ✓ (briefing.py:206-212, `25%/Q` label)

         COMPUTED BUT NOT SURFACED IN BRIEFING:
            - 25%/1M (regime.py:254, never rendered in evening brief)
            - +/-4% ratio rolling 5d/10d (in regime signals list, NOT
              the breadth section)
            - Consecutive 700+ down-4% days (signals list)
            - T2108 (signals list, but not in the matrix-style cell)

         TRULY MISSING — not computed:
            - up/down 13%+ in 34 days (Wm O'Neil thrust-style)
            - up 20%+ in 5 days (Pradeep thrust — see 2026-05-24 SPY
              annotation, Screenshot 2026-05-24 161935.png)
            - Worden Common Stocks (closed-source; needs A/D-line
              or similar proxy if we want to fill the column)

         Two-tier work: (i) low-cost surfacing of already-computed
         25%/1M into the briefing breadth section closes the most
         obvious user-visible gap; (ii) compute 13%+/34d + 20%+/5d
         from `mi_daily_closes` if cluster matrix becomes the render.

      Reference matrix (2026-05-24 Pradeep screenshot 162223 —
      full Stockbee cluster view we want to render):
         Primary (4 cols): up_4%_today · down_4%_today ·
                           5d_ratio · 10d_ratio
         Secondary (6 cols): up_25%/Q · down_25%/Q ·
                             up_25%/M · down_25%/M ·
                             up_50%/M · down_50%/M
         Far right (3 cols): Worden_common · T2108 · S&P
         Rows: 10 most-recent trading dates (newest on top).
         Per-cell color encoding visible — green / pale yellow
         neutral / red. Operator can spot vertical-run signals
         (e.g., past 5 days red in down-cols).

      Color-rule design constraint (2026-05-24 evidence):
        Metrics do NOT all share a monotone "high=green, low=red"
        rule. Four distinct classes; cluster-matrix render cannot
        ship until the per-metric rule table is explicit:

         CLASS A — Paired up/down counts (matrix columns above)
            up_X%/N and down_X%/N are SIBLING columns. Up cell
            green when high; down cell red when high. Both can
            light up independently. This covers MOST of the
            cluster-matrix cells.

         CLASS B — Unpaired thrust metric (NOT in matrix; separate
                   signal class)
            up_20%+/5d alone, up_13%+/34d alone — single-direction
            surge counts without a paired sibling. Pradeep
            2026-05-24 SPY annotation (Screenshot 162223 sibling
            162038): "historically such high readings result in
            stalling action / pullbacks." High isn't green, it's
            amber exhaustion-warning. RSI-shape logic.

         CLASS C — Contrarian extremes (T2108)
            low <20 = green (oversold-bounce setup, ALREADY in
            briefing.py:243 today); high >85 = amber (overbought
            caution, NOT yet wired).

         CLASS D — Persistence (sequence-as-signal)
            Consecutive 700+ down-4% days — single-day color not
            meaningful; the SEQUENCE is the signal. Render as
            count-of-consecutive at far right of date row.

      Open design questions:
        - Render target: Telegram monospace table, or a new dashboard
