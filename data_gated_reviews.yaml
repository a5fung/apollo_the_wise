  - review_id: alpaca_stop_trigger_reliability
    title: "P0 — Alpaca paper stop trigger silently fails despite SIP-confirmed cross"
    severity: P2  # DOWNGRADED 2026-06-03 from P0
    live_cutover_blocker: false  # DOWNGRADED 2026-06-03 (operator-ratified, order-record-grounded)
    resolution_2026_06_03: |
      DOWNGRADED from P0 live-cutover blocker -> entry fill-rate/opportunity-cost
      (operator-ratified). RESOLVED via the authoritative Alpaca ORDER RECORD
      (mi_live_orders.raw_response), NOT the price tape:
        - Entry ea918c50 (stop_limit, stop 204.86 / limit 205.88): filled_qty=0,
          status canceled. NO position ever opened.
        - OTO child stop 1434b7c5 (stop-MARKET 197.31): status HELD throughout
          (never activated — correct OTO with an unfilled parent), cancelled with
          the parent at 10:00, filled_qty=0. (raw exit_reason='stop_hit' is a
          mislabel; filled_qty=0 = never fired.)
      => ENTRY-side, NOT an exit-side protective-stop/naked-position failure (the
      child never needed to activate; no position existed). Per advisor criterion
      "entry never filled -> opportunity cost, reframe earned." NVTS (this session)
      = same entry-side run-through class.
      WHY no fill: stop-limit gap/no-trigger — limit (205.88) too tight vs SIP high
      (207.20, operator TradingView); on Alpaca paper (IEX) the trigger never fired
      (IEX max ~203 < 204.86). Either way no fill/no position; likely gap-through on
      live too.
      FIX (gated, not a safety blocker): entry-tuning — widen limit OR stop-market
      entry w/ chase cap (CHANGE_PROCESS). #180 = the would-have-filled auto-classifier.
      EXIT-side protective-stop ACTIVATION (a resting stop on an OPEN position
      firing when price breaches) is a DISTINCT surface, NOT this gate — and the
      pure "Alpaca fires a placed stop" is BROKER-side, identical paper vs live
      (so NOT a cutover-differential risk). It stays covered by #123 order-status
      reconcile (catches a resting stop diverging from broker state) + submission
      stop-leg verify (place_bracket_order:303-315) + #142 + #128 + #137.
      RESIDUAL (verify-not-relax, separate from this safety gate): Apollo paper uses
      IEX; IEX can miss crosses SIP shows -> paper may UNDER-fill entries vs the live
      (real-exchange/SIP) path -> cohort representativeness. Filed #182.
      RE-ESCALATE only if an exit-side activation failure (child accepted/active on
      an OPEN position then no-fill) is ever observed.
      CORRECTION 2026-06-03 (SIP-confirmed, supersedes the IEX/gap-through mechanism
      above): Apollo's DATA feed = SIP (ALPACA_DATA_FEED=sip, prod-confirmed) — NOT
      IEX. The ALPACA PAPER account fills off IEX (Alpaca docs). SIP (Polygon) shows
      AVAV hit 207.20 at 9:48 ET, continuously through the 204.86 trigger + 205.88
      limit -> it WOULD fill ~205.88 on LIVE (NOT gap-through). Paper missed it only
      because Alpaca's paper IEX fill-sim didn't see the off-IEX breakout. So: entry
      fills on real $; #182 (paper under-fills vs live) is CONFIRMED; #183 = the
      clean_miss classifier reads IEX/wrong-window (logged max_h=203 vs SIP 207.20).
      #150 downgrade conclusion (no position opened, entry-side) is unchanged.
    evidence_2026_06_12_lyg: |
      LYG (9M Day 2, trade #214) — CLEANEST CONFIRMATION YET of the paper-IEX
      trigger mechanism, investigated same-morning off the auto-alert:
        - 09:31:12 ET stop-limit buy submitted (stop 5.46 / limit 5.49);
          order CONFIRMED LIVE (pending_new -> new reconciled 09:32:00) —
          NOT the RDW stuck-pending_new class.
        - SIP 09:32 bar H=5.46: the consolidated tape printed EXACTLY the
          trigger in-window (then never above; faded to 5.42).
        - IEX in 09:31-10:00: max 5.455 (and NO 09:32 bar at all — zero IEX
          trades that minute). The trigger price never printed on IEX.
        - Order sat `new` untouched for 28 min -> 10:00 cleanup cancelled.
      => Paper engine demonstrably triggers off IEX last-trades, not the
      consolidated tape. On LIVE this triggers at 09:32 (and fills ~5.46,
      limit 5.49 reachable). Class/conclusion UNCHANGED (entry-side,
      paper-only differential, #182-confirmed; live unaffected).
      Side observation (methodology, NOT this gate): the ORB bar was a
      ONE-CENT range (O=H=5.46 L=5.45, 0.18%) — trigger == open == high,
      a degenerate-range Day 2 entry. If a min-ORB-range floor is ever
      proposed it goes through CHANGE_PROCESS with N>=10, separately.
    escalation_note_2026_05_28: |
      Initially filed with threshold=3 per default N=1 protocol. Operator
      pushed back same session: the failure chain (detect → alert → submit
      → price hits trigger → status `new → canceled` with no trigger
      event) is a confirmed execution-path bug, not an ambiguous methodology
      signal. N=1 with this severity is sufficient evidence to dig in.
      Threshold reduced to 1; status reclassified as live-cutover blocker.
    question: |
      AVAV 2026-05-28 surfaced a NEW entry-reliability bug class distinct
      from RDW #142 (stuck-pending_new):

      - 09:31:10 ET: ORB stop-limit buy submitted (stop $204.86, limit $205.88)
      - 09:45:00 ET: Alpaca status pending_new → new (in book)
