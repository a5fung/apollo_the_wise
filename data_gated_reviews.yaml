  - review_id: rmv_phase2_evaluation
    title: "RMV Phase 2 — divergence vs fresh_tightening (#54)"
    question: |
      Phase 1 telemetry (commit a3a237c, 2026-05-09) persists rmv_5d
      and rmv_15d on every mi_flag_candidates row. Phase 2 evaluates
      whether RMV-low among structurally-valid candidates catches
      setups Apollo's existing _compute_fresh_tightening misses, OR
      is redundant with it. Earliest review 2026-06-09 (Phase 1 +
      30 trading days).

      Predicate status 2026-05-24: 1543 rmv-populated rows / 200
      threshold (7.7x over). 530 rows qualify as RMV-low (≤10) +
      structurally-valid + Apollo at WATCH/TIGHTENING (not COILED) —
      strong divergence signal. Forward-return evaluation IS the
      remaining work; calendar floor is the only blocker.

      **Concrete forward-looking example (2026-05-22)**: BB Q-rev
      breakout — Richard Moglen tweet flagged "low RMV the day
      before BB broke out from the range" plus "range sitting on
      the 10ema (moving average of note)". Our data confirms:
      BB rmv_15d hit 0 (floor) on 5/20; 5/22 saw rmv_15d=100
      (expansion / breakout). BB was at WATCH the whole window
      because range_contraction_ratio and vol_contraction_ratio
      stayed ~1.0 — `_compute_fresh_tightening` missed it.
      Moglen's MA-anchored framing matches our locked Phase 2
      structural guards (`breakout_close > sma_10 AND sma_10 >
      sma_20`) — when the review fires, BB should appear in
      `rmv_catches_apollo_misses` with a measurable forward edge
      if RMV is the right additional axis.

      **RESULT — RAN 2026-06-16 (overdue; the RMV-miss session).**
      Two findings: (1) the LOCKED SQL above was BUGGY — it gates on
      `breakout_close`, which flag_detector sets ONLY on TRIGGERED rows
      (flag_detector.py:637), while filtering for WATCH/TIGHTENING →
      the catch set is structurally ALWAYS empty (the 5/24 "530" was
      never reproducible via this SQL). FIX = use the candidate's
      current close at scan_date (mi_daily_closes) for MA-alignment;
      corrected query = `scripts/_rmv_phase2_eval_54_fixed.sql`. A locked
      review query that was never run-and-verified hid a latent bug —
      exactly the idle-review class this session set out to mitigate.
      (2) VERDICT (fixed query, 35d window): rmv_low_n=811,
      rmv_catches_apollo_misses=728; forward fwd_5d_max_high median
      baseline 5.69% vs RMV-low-catch 5.86% = **+0.17pp lift << the 5pp
      bar** → per the locked decision rule, **RMV-low is REDUNDANT with
      `_compute_fresh_tightening` for forward edge → CLOSE OUT, keep
      rmv_5d/rmv_15d as DIAGNOSTIC telemetry (do not drop, do not
      promote to a COILED qualifier).** Converges with #270 STEP 0
      (`docs/analysis/anticipation_rmv_step0_270.md`): RMV-low is not a
      load-bearing entry edge. Caveat: fwd_5d_max_high is favorable-
      excursion, not realized P&L; one 35d window. Operator to RATIFY
      the close.
    predicate_sql: |
      SELECT COUNT(*) FROM mi_flag_candidates
      WHERE rmv_5d IS NOT NULL
        AND scan_date > CURRENT_DATE - 35
    threshold: 200
    earliest_review_date: 2026-06-09
    action_when_ready: |
      LOCKED Phase 2 spec (advisor 2026-05-09) — divergence
      comparison MUST filter on structural validity. Run:

      -- RMV-low among structurally-valid candidates
      WITH rmv_low AS (
        SELECT scan_date, ticker, stage, rmv_5d
        FROM mi_flag_candidates
        WHERE rmv_5d <= 10
          AND base_age >= 3
          AND sma_10 IS NOT NULL AND sma_20 IS NOT NULL
          AND breakout_close > sma_10 AND sma_10 > sma_20
          AND scan_date > CURRENT_DATE - 35
      )
      SELECT
        COUNT(*) AS rmv_low_n,
        COUNT(*) FILTER (WHERE stage = 'COILED') AS overlap_coiled,
        COUNT(*) FILTER (WHERE stage IN ('WATCH','TIGHTENING')) AS rmv_catches_apollo_misses
      FROM rmv_low;

      Then attach forward returns to evaluate edge. For each
      `rmv_catches_apollo_misses` row, compute fwd_5d_max_high_pct
      from mi_daily_closes joined on ticker + scan_date. Compare
      median fwd_5d_max_high to baseline of all flag candidates over
      the same period.

      Decision rule:
      - Lift ≥ 5pp over baseline → Phase 3 (add `rmv_5d ≤ 10` as
        alternative COILED qualifier alongside existing paths;
        same ma_aligned + bodies_tight structural guards apply).
      - Lift < 5pp → close out, RMV redundant with
        _compute_fresh_tightening; consider dropping the columns
        (or keep for diagnostic).
      - Sample too thin (rmv_low_n < 30 after structural filter) →
        defer 30 more days.

      Origin: 2026-05-09 DeepVue/TraderLion review + advisor approval.
      See TI6 in project_trading_ideas_backlog.md for full design.
    status: done  # RATIFIED by operator 2026-06-19 (#54) — verdict: RMV stays diagnostic telemetry, the COILED gate stays ≤7%-range + base_run (no new gate). See PLAN #291.
    added_on: 2026-05-09

