    title: "Sugar Baby Convergence — backtest forward returns once N≥10 fires settle"
    question: |
      Sugar Baby Convergence shipped 2026-05-22 (#83 Stage 1 + #84
      Stage 2) as pure observability — tags HIGH MAGNA53/9M EP alerts
      that fire on a Pradeep-cohort ticker recently in COILED/
      TIGHTENING/TRIGGERED. Two visual classes:
        - convergence_class='breakout'     (TRIGGERED + EP fire)
        - convergence_class='anticipatory' (COILED/TIGHTENING + EP fire)

      Hypothesis: convergence-tagged HIGH alerts have measurably
      better 5d forward returns than non-convergence HIGH alerts.
      Pradeep's "day one of swing + catalyst" framing predicts the
      breakout class outperforms; anticipatory class is the
      Qullamaggie-style "ripe base + catalyst" pattern.

      Earliest review: 2026-08-01 (estimated 6-10 weeks for N≥10 to
      accumulate given 0-2 convergences/week initial fire rate).

      MUST validate via feedback_validate_metric_before_decision.md
      discipline: compare convergence-tagged 5d returns vs baseline
      non-convergence HIGH-alert 5d returns over the same period.
      If both score similarly, the tag is drift-dominated and the
      convergence signal is noise. Don't ship anything based on
      convergence alone scoring high — the comparison is the data.
    # ⚠ FLAGGED 2026-08-15 (sweep): 'sugar_baby_convergence_alert' has fired ZERO
    # times ALL-TIME since the 05-22 ship (writer exists — ninem_detector.py:403 +
    # briefing.py:2820 — and sugar_baby_convergence_check_failed is also 0, so the
    # check runs and returns falsy every time). The estimated "0-2/week" fire rate
    # was off by everything; either the condition is miscalibrated or ultra-rare.
    # The rolling 90d window also FORGETS any fires that do come. Cannot ripen as-is
    # — needs a detector-side look, not a re-gate here.
    predicate_sql: |
      -- Predicate: ≥10 distinct (ticker, alert_date) convergence fires.
      -- Counts unique ticker-day pairs to avoid per-scan-tick inflation
      -- (audit dedup is 1h-window via mi_audit_log on the write path,
      -- but reads should still COUNT DISTINCT to be defensive — see
      -- Monday-fix followup re: 1h-vs-trading-day dedup window).
      SELECT COUNT(*) FROM (
          SELECT DISTINCT
                 SUBSTRING(summary FROM '^([A-Z]+)') AS ticker,
                 created_at::date AT TIME ZONE 'America/New_York' AS et_date
          FROM mi_audit_log
          WHERE event_type = 'sugar_baby_convergence_alert'
            AND created_at >= NOW() - INTERVAL '90 days'
      ) sub;
    threshold: 10
    earliest_review_date: 2026-08-01
    action_when_ready: |
      1. Pull all convergence fires (mi_audit_log event_type=
         'sugar_baby_convergence_alert'), parse ticker + alert_date +
         class from summary string (format contract: "{TICKER}
         {SOURCE} — class={class} cohort={N}x stage={stage}").
      2. Join to mi_daily_closes for forward 5d returns from
         open_d0 → close_d+5.
      3. Build baseline cohort: HIGH MAGNA53/9M alerts in same window
         that did NOT fire convergence tag. Apply mi_security_types
         filter (CS/ADRC only) + dedup per #59 hygiene.
      4. Stratify by class — breakout vs anticipatory vs neither.
      5. Decision per feedback_sample_size_discipline:
         - If breakout class shows ≥+5% better 5d returns over baseline
           at N≥10: file followup to consider promoting convergence
           from operator_only → escalation tier in mi_stocks_in_play
           (ADR work).
         - If anticipatory class shows similar lift at N≥10: same.
         - If both classes score within ±2% of baseline: convergence
           is informational only; keep operator_only, don't promote.
         - If sample still N<10 at review_date: re-set
           earliest_review_date +30d and continue accumulating.

      DO NOT ship any methodology change off convergence tagging
      without this backward check + advisor review.

      Origin: 2026-05-22 #84 ship plan ("File as data-gated review at
      first convergence fire"). Filed retroactively 2026-05-22 PM per
      advisor review of the day's ship list.
    status: pending
    added_on: 2026-05-22

  - review_id: orb_bar1_wick_outlier_persistence_filter
    title: ORB bar-1 high single-tick outlier filter (#122)
    question: |
      Does the 9:30-9:31 minute bar high suffer from single-tick outliers
      (wick prints that don't hold) often enough to justify a structural
      filter on ORB entry triggers? Spec: persistence filter (≥3 sec at
      high) OR fall back to second-highest 1s bar high OR wick_ratio cap
      on bar-1.
    predicate_sql: |
      -- Count last-90d ORB-triggered entries where bar-1 wick_ratio ≥ 0.70.
      -- wick_ratio = (high − max(open, close)) / (high − low), computed
      -- from mi_intraday_bars 9:30 minute bar.
      -- NOTE: 2026-05-26 measurement found N=1 across 90d (OMCL 4/28).
      -- Also surfaced that mi_intraday_bars is missing 9:30 data for
      -- ~87% of live ORB entries — separate issue, doesn't block this
      -- predicate from accruing once coverage improves OR as more
      -- live trades land. Re-run at threshold.
      WITH bars AS (
          SELECT ticker,
                 bar_time::date AS bar_date,
                 open AS o, high AS h, low AS l, close AS c
          FROM mi_intraday_bars
          WHERE bar_time::date > NOW()::date - INTERVAL '90 days'
            AND EXTRACT(hour FROM bar_time AT TIME ZONE 'America/New_York') = 9
            AND EXTRACT(minute FROM bar_time AT TIME ZONE 'America/New_York') = 30
      )
      SELECT COUNT(*)
      FROM mi_live_trades lt
      JOIN bars b ON b.ticker = lt.ticker AND b.bar_date = lt.alert_date
      WHERE lt.alert_date > NOW()::date - INTERVAL '90 days'
        AND lt.entry_price IS NOT NULL
        AND (b.h - b.l) > 0
        AND ((b.h - GREATEST(b.o, b.c)) / (b.h - b.l)) >= 0.70;
    threshold: 10
    discriminates_on: [mi_live_trades.signal_type, mi_live_trades.account_mode]  # backfilled 2026-08-30 (#573) from the verified 2026-08-17 table->column mapping
    earliest_review_date: 2026-08-15
    action_when_ready: |
      1. Re-run scripts/orb_wick_outlier_backwardcheck.py on prod to get
         the full cohort with stop-out vs winner breakdown.
      2. If wick-outliers + same-day stop-out signature dominates (≥70%
         of the cohort): design fix from data — pick between (a)
         persistence filter via 1-second bars, (b) bar-1 close gate (e.g.
         require close ≥ 50% of range), (c) wick_ratio cap on the bar-1
         high used as orb_high. Cheapest first.
      3. If counter-evidence (held/winner outliers) is ≥30% of cohort:
         the filter would harm more than help — defer permanently with
         "filter hurts winners" note + close.
      4. Consult advisor before writing a 1-second-bar fetcher — that's
         a new data path and may be unnecessary if (b) or (c) work.

      Origin: 2026-05-26 measurement showed N=1 across 90d live ORB
      entries — too thin to ship. mi_intraday_bars coverage gap (87%
      missing 9:30 bars) is a separate hygiene issue that also limits
      the measurement; track but don't block this predicate.
    status: pending
    added_on: 2026-05-26

  - review_id: theme_clustering_coherence_guard
    title: Theme clustering-coherence guard (#126)
    question: |
      Does the theme engine produce semantically-incoherent clusters
      often enough to justify a coherence guard? LINC (Lincoln
      Educational Services) appeared in the "Firearms & Personal
      Defense Manufacturing" theme alongside SWBI on 2026-05-26 — clear
      sector mismatch (Consumer Defensive / Education vs Industrials /
      Aerospace & Defense). Description-quality guard #125 doesn't
      catch this (both tickers mentioned, description not malformed).
    predicate_sql: |
      -- Count active theme-ticker pairs where ticker's sector differs
      -- from the modal sector of all theme members. Requires sector
      -- data on ≥2 members; themes with all-unknown sectors are
      -- excluded as not yet evaluable.
      WITH theme_members AS (
          SELECT DISTINCT t.name, t.theme_date, unnest(t.tickers) AS ticker
          FROM mi_themes t
          WHERE t.theme_date > NOW()::date - INTERVAL '30 days'
            AND t.stage != 'Retired'
      ),
      with_sector AS (
          SELECT tm.name, tm.theme_date, tm.ticker, o.sector
          FROM theme_members tm
          LEFT JOIN mi_ticker_overrides o ON o.ticker = tm.ticker
          WHERE o.sector IS NOT NULL AND o.sector != ''
      ),
      sector_counts AS (
          SELECT name, theme_date, sector, COUNT(*) AS n_in_sector
          FROM with_sector
          GROUP BY name, theme_date, sector
      ),
      modal_sector AS (
          SELECT name, theme_date,
                 (SELECT sector FROM sector_counts sc
                  WHERE sc.name = ws.name AND sc.theme_date = ws.theme_date
                  ORDER BY n_in_sector DESC, sector LIMIT 1) AS modal,
                 COUNT(*) AS total_with_sector
          FROM with_sector ws
          GROUP BY name, theme_date
          HAVING COUNT(*) >= 2
      )
      SELECT COUNT(DISTINCT (ws.name, ws.ticker))
      FROM with_sector ws
      JOIN modal_sector ms ON ms.name = ws.name AND ms.theme_date = ws.theme_date
      WHERE ws.sector != ms.modal;
    threshold: 10
    action_when_ready: |
      1. Pull the 30-day cohort of sector-mismatch theme-ticker pairs
         via the predicate SQL.
      2. Audit each pair: legitimate cross-sector theme (rare; some
         macro themes like "AI Infrastructure" span Tech + Industrials)
         vs accidental RS-correlation cluster (LINC/SWBI class).
      3. If ≥70% are accidental: design the coherence guard. Options:
         (a) sector-coherence gate at theme ASSIGNMENT (require modal
             sector match within theme), (b) Sonnet "is this coherent"
             judge at validation, (c) tighter description-segment
             keyword overlap rule. Pick from data — cheapest first.
      4. If <70%: defer permanently; the cluster outputs aren't
         systematically broken, just have occasional outliers operators
         can spot from the theme name + members list.
      5. Consult advisor before shipping any guard — methodology
         change at theme detection requires the same N≥10 + backtest
         discipline as setup detection.

      Sector-data hygiene fix shipped same day (#126): rs_engine's
      nightly _enrich_sectors now also pulls active theme members
      (was top-300-RS only, leaving ~19% of theme tickers without
      sector). One-shot backfill ran on 2026-05-27 (26/32 tickers
      enriched, 6 unmatched are ETFs or deprecated tickers).
    status: deferred
    earliest_review_date: 2026-11-01
    regated_on: 2026-08-06
    regate_kind: date
    regate_reason: >-
      RE-GATED 2026-08-06 — it was ANSWERED and deferred on 8/03 by its own <70% rule; it reads ripe 
      only because that deferral never moved the dates. Its honest re-open trigger is the Nascent<->R
      etired flip-flop force-clustering RECURRING, not elapsed time.
    deferred_on: 2026-08-03
    deferred_reason: |
      ANSWERED AND DEFERRED BY THE REVIEW'S OWN RULE (>=70% accidental -> build a guard;
      <70% -> defer permanently). All 36 mismatched pairs audited individually against each
      theme's description and day-by-day membership: only 7 of 36 (19%) are genuinely accidental
      RS-correlation clustering.

      The other 29 are sector-VENDOR tagging noise around thematically-correct clusters -- crypto
      miners split Technology vs Financial Services, space/satellite Technology vs Industrials,
      steel Industrials vs Basic Materials. Real GICS-boundary ambiguity in the sector data, not a
      clustering mistake; every one of those themes is a coherent business story.

      The predicate also inflates its own count: 13 of the 36 come from 2-member themes where
      "modal sector" is an alphabetical tie-break between two singletons -- a coin flip, not a
      disagreement.

      SEPARATE, NARROWER BUG FOUND UNDERNEATH (not what this review asked, and NOT fixed): all 7
      genuine cases trace to one mechanism. `Regulated Gas & Electric Distribution Utilities`
      flip-flops Nascent<->Retired night to night; on the nights it is Retired, its orphaned members
      get force-clustered into the nearest sector-adjacent theme (`U.S. Petroleum Refining`) rather
      than left unassigned. Recurred 3 of the last 7 trading days, self-corrects within a day --
      which makes it LESS spottable than this review assumed, not more.

      Honest re-open trigger: that instability recurring, NOT elapsed time.
    added_on: 2026-05-27

