      narrative from text) so lower urgency — but theme-context input stays lossy until
      fixed. Layer-2 architecture (free params) -> DESIGN before build, not a cram.

      2ND TEST CASE (2026-05-30, operator-spotted) — SOFTWARE re-rating INTO the AI
      theme (punished on "AI eats SaaS" -> recovering on "SaaS ships AI"). RS slope
