  - review_id: stop_too_wide_outcome_cohort
    title: "Stop-too-wide rejection outcome cohort (#11 ATR Part 2 trigger)"
    question: |
      The MAGNA53 `setup:stop_too_wide` filter rejects HIGH-tier alerts when
      ORB range > 1.5× ATR_14. Two cases since 5/05 have raised the question
      of whether this filter sheds winners:
        - STRL 5/05: rejected stop_too_wide; 5d close +17.0%, 5d max +22.2%
        - AIP  5/13: rejected stop_too_wide (ORB $3.18 / ATR $3.02 = 1.05x);
                     score 115.2 HIGH, AI semis catalyst (MIPS, earnings)

      Per `feedback_sample_size_discipline`, N=2 is below the N≥10 backtest
      threshold for a methodology change. Track every `setup:stop_too_wide`
      rejection going forward; once N≥10 settled with 5d/20d outcomes,
      evaluate whether to (a) widen the multiple (1.5x → 2.0x), (b) switch
      stop anchor (ORB-low → VWAP / prior-day-low), or (c) keep as-is
      because the cohort genuinely has poor R:R.
    predicate_sql: |
      -- Count distinct mi_live_trades rows with skip_reason starting
      -- `setup:stop_too_wide`. Each represents one rejection where the
      -- missed-EP outcomes pipeline will populate 5d/20d forward returns.
      -- ⚠ FIXED 2026-08-17: this counted EVERY strategy's stop_too_wide skip, not
      -- MAGNA53's. Verified on prod the same day: 9 magna53 + 8 9m_day2 share the
      -- prefix, so the gate read 13+ and fired while the cohort this review is ABOUT
      -- stood at 9 — below its own N>=10 bar. Same defect class as
      -- exposure_family_cap_promotion (#517): an entry that marks itself READY on a
      -- question it cannot answer.
      -- ⚠ SCOPE IS DELIBERATE AND WAS WRONG TWICE ON 2026-08-17, so it is written
      -- out here rather than left implicit. Prod breakdown that day:
      --     9m_day2 / paper   8      <- a DIFFERENT filter, must never be counted
      --     magna53 / live    4
      --     magna53 / paper   5
      -- The original predicate filtered NEITHER column and read 17. My first fix added
      -- signal_type only and read 9. The readiness check then flagged it AGAIN for the
      -- unfiltered account_mode, which is how the paper/live split was found at all.
      -- DECISION: account_mode is deliberately NOT filtered. These rows are SKIPS — no
      -- position was ever taken, so the stock's forward outcome is account-independent
      -- and paper rejections are legitimate evidence for this question. signal_type IS
      -- filtered, because 9m_day2 is a different filter answering a different question.
      -- The readiness flag on account_mode therefore stands as a DECLARED exemption,
      -- and the surface's category breakdown keeps it visible instead of implicit.
      SELECT COUNT(*) FROM mi_live_trades
      WHERE skip_reason LIKE 'setup:stop_too_wide%'
        AND signal_type = 'magna53'
        AND alert_date >= '2026-05-05'
        AND alert_date <= CURRENT_DATE - INTERVAL '25 days';
        -- 25-day lag = 20d forward outcome settled + buffer
    threshold: 10
    discriminates_on: [mi_live_trades.signal_type, mi_live_trades.account_mode]  # backfilled 2026-08-30 (#573) from the verified 2026-08-17 table->column mapping
    earliest_review_date: 2026-08-08
    # >> RAN 2026-07-13 (Opus): CANONICAL table mi_ep_missed_outcomes (matches this review's own
    #    recorded STRL +17.0%/+22.2% exactly — fractions). Settled N=5 (EVER/STRL/AIP/GO/PONY):
    #    ret_5d avg +1.8%, ret_20d avg +1.2% — MIXED (STRL +17% win, GO -12% loss, rest ~flat),
    #    NOT a clear winner-shedder → early lean = KEEP AS-IS. N=5 < N>=10-settled bar; the 7
    #    rejections from 5/19+ are NOT yet populated in mi_ep_missed_outcomes (population lag/gap
    #    — verify the missed-outcomes refresh). Defer ~8/8 for N>=10; decide on realized-R (not
    #    forward return — the filter is an R:R gate), operator's call (THE LINE).
    action_when_ready: |
      1. Pull the cohort with forward outcomes via mi_ep_missed_outcomes
         (which joins mi_live_trades rejections to mi_daily_closes):
           SELECT lt.ticker, lt.alert_date, lt.ep_score, lt.skip_reason,
                  mo.ret_5d, mo.ret_20d, mo.max_high_5d, mo.max_high_20d
           FROM mi_live_trades lt
           LEFT JOIN mi_ep_missed_outcomes mo
                  ON mo.ticker=lt.ticker AND mo.alert_date=lt.alert_date
           WHERE lt.skip_reason LIKE 'setup:stop_too_wide%'
             AND lt.alert_date >= '2026-05-05'
           ORDER BY lt.alert_date;

      2. Compute cohort stats:
         - Hit rate at 5d ≥ +10% threshold
         - Median ret_5d, ret_20d, max_high_5d (max-favorable-excursion)
         - Score distribution by ep_score band (50-69 MOD, 70-99, 100+)

      3. Decision matrix:
         - 5d hit-rate ≥ 30% AND median max_high_5d ≥ +8% → REVISIT.
           Filter is shedding winners. Options to test in shadow:
             (a) Widen multiple 1.5x → 2.0x — measure how many additional
                 candidates pass + their cohort outcomes
             (b) Replace stop anchor: stop = VWAP at ORB-low or stop = max(ORB_low, prior_day_low). Wider effective
                 stop for high-ATR names while keeping ORB-high entry.
             (c) Tier the gate: keep 1.5x for MODERATE, loosen to 2.0x for
                 HIGH (score ≥ 80). Score-conditional looseness.
         - 5d hit-rate < 20% OR median max_high_5d < +3% → KEEP. Filter
           correctly rejecting low-R:R setups.

      Origin: STRL 5/05 single-case anomaly (#11 filed 2026-05-13 session 2).
      AIP 5/13 second case raised priority to formal cohort review.
      Related backlog: project_market_intelligence_backlog item #11.
    status: pending
    added_on: 2026-05-13
    last_run_inconclusive_on: 2026-08-17
    last_run_note: >-
      RAN 2026-08-17 and returned to PENDING — it fired early on the mis-scoped
      predicate above. Real MAGNA53 cohort is 9 (5 settled and fill-plausible), so the
      N>=10-settled bar was never met. Findings kept because they are real:

      AIP — one of the two seed cases that motivated this review — does NOT survive
      contact with our actual mechanics. Run through the real bracket, AIP nets -1.14
      ADR (a genuine loser) while STRL nets +1.31 ADR (a genuine winner, near the
      baseline's own top decile). Half the original worry was an artifact of judging on
      raw forward return instead of what our bracket would have kept.

      The properly-scoped comparison is a WASH: the 5 settled fill-plausible rejects
      (STRL, EVER, AIP, CORT, AEVA) sit at -0.31 ADR median against a baseline of -0.35
      ADR. Two more (GO, PONY) were excluded as near-certain non-fills — a call
      validated against 77 real fill outcomes, where near-zero headroom predicts
      non-fill 95% of the time.

      🔑 ONE MECHANICAL FINDING WORTH CARRYING regardless of this filter: the profit
      target is fixed in DOLLAR terms, so a wide-opening-range name must travel roughly
      2.5x more of its OWN daily range to reach it. That is a structural headwind on
      wide-range names under the current bracket, independent of stock quality. It bears
      on both (a) widen the multiple and (b) change the anchor without resolving either.

      VERDICT: no change, and explicitly NOT a finding that the filter is correctly
      tuned — there is not enough signal either way at this N. Re-fires at a true
      MAGNA53 N>=10 under the corrected predicate.
      Doc: docs/analysis/stop_too_wide_outcome_cohort_2026-08-17.md

      ⚠ THIRD CORRECTION, same day, found by the NEW readiness check (#517) rather
      than by anyone reading the entry: after scoping to magna53 the predicate still
      did not filter account_mode, and the 9 rows are 4 live + 5 paper. The scope is
