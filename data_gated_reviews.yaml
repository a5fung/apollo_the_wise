  - review_id: rel_volume_small_cap_biotech_floor_evidence
    title: "rel_volume floor 0.5× for small-cap biotech/pharma EP entries"
    question: |
      Weekly review 2026-05-24 proposal #1: RLAY 2026-05-21 had
      rel_volume=0.14 at ORB-entry time, vol_percentile=0.0,
      stopped out at -$642 in 5.4 min, highest_price_seen ==
      entry_price (zero post-fill uplift). Sister case to CSCO
      2026-05-14 (large-cap variant tracked at
      `rel_volume_large_cap_floor_evidence`) at rel_volume=0.04.

      Hypothesis: small-cap biotech/pharma gapping with
      rel_volume < 0.5x at ORB time has no follow-through —
      gap is sentiment without participation. ADV gate at $50M
      separates this from the large-cap class (which has its
      own pending review). Sector restriction to biotech/pharma
      reflects the observed pattern; expand to other sectors
      ONLY if evidence supports broader bug class.

      Per feedback_sample_size_discipline: N≥10 before ship.
    # ⚠ PREDICATE FIXED 2026-07-30 — the original JOINed EVERY mi_stock_scores row
    # with score_date <= alert_date, so ONE alert counted ONCE PER HISTORICAL SCORE
    # ROW. It reported 159 when the real cohort is 4 — a ~40x inflation — and this
    # review sat "READY (159>=10)" for weeks on a number that was pure artifact.
    # The LATERAL takes the LATEST score row before the alert, which is also the
    # methodologically right read: judge the stock's ADV/sector AS OF the alert,
    # not "at any point in its history".
    predicate_sql: |
      SELECT COUNT(*) FROM (
        SELECT DISTINCT a.ticker, a.alert_date
          FROM mi_ep_alerts a
          JOIN LATERAL (
            SELECT adv_20, close, sector
              FROM mi_stock_scores s
             WHERE s.ticker = a.ticker AND s.score_date <= a.alert_date
             ORDER BY s.score_date DESC LIMIT 1
          ) s ON TRUE
         WHERE a.alert_date >= CURRENT_DATE - 90
           AND a.score_tier = 'HIGH'
           AND a.rel_volume IS NOT NULL
           AND a.rel_volume < 0.5
           AND s.adv_20 IS NOT NULL
           AND (s.adv_20 * s.close) < 50000000
           AND (s.sector ILIKE '%biotech%'
                OR s.sector ILIKE '%pharma%'
                OR s.sector ILIKE '%health%')
      ) x;
    # ── RUN 2026-07-30 (inline, read-only). VERDICT: NO SHIP — INSUFFICIENT EVIDENCE.
    # THE GATE FIRED ON AN ARTIFACT (see above). Entry-aware cohort, the methodology
    # this review's own action_when_ready demands: on the looser any-score-row read,
    # 12 distinct alerts -> 7 NEVER FILLED (cancelled/skipped) -> 5 closed (3 paper,
    # 2 live), 1 winner = 20% WR (paper -$1,910, live -$26.53). On the CORRECTED
    # as-of-alert predicate the cohort is 4.
    # The decision matrix says WR<30% -> ship the filter, and 20% clears it — BUT it
    # requires N>=10 ENTRY-AWARE and there are FIVE (four by the corrected read).
    # CHANGE_PROCESS demands N>=10 for any criterion change. Shipping an ENTRY FILTER
    # on 5 trades is precisely the overfitting that rule exists to prevent. NOT SHIPPED.
    # ⚠ INDEPENDENTLY WEAKENS THE CASE: 7 of 12 never filled at all. A thin name often
    # doesn't trade through its ORB high, so the setup is ALREADY partly self-filtering.
    # Re-look when the CORRECTED predicate reaches 10 entry-aware CLOSES — not 10 alerts.
    threshold: 10
    earliest_review_date: 2026-07-01
    action_when_ready: |
      Pull N≥10 cohort with `mi_live_trades` join (entry-aware,
      per the large-cap review's 2026-05-18 methodology
      correction — close-to-close fwd_5d_pct is drift-not-entry).

      Decision matrix:
        WR < 30% → ship `rel_volume ≥ 0.5x AND ADV < $50M AND
          sector IN biotech/pharma` filter for HIGH alerts.
          Audit event `filter:orb_rvol_too_low_smallcap_biotech`.
        WR 30-50% → defer, evidence borderline.
        WR > 50% → small sample unlucky; don't ship, retire review.

      Cross-check with large-cap variant outcome: if BOTH ship,
      consider unifying as `rel_volume ≥ 0.5x` floor agnostic of
      ADV/sector. If only one ships, keep them targeted.
    status: pending
    added_on: 2026-05-24

  - review_id: large_cap_relvol_floor_shadow_evidence
    title: "Large-cap rel_volume floor — FORWARD shadow confirmation (operator shadow-approved 2026-07-19)"
    question: |
      Forward-tracking successor to `rel_volume_large_cap_floor_evidence` (the
      retrospective review above). That review's entry-aware mi_live_trades
      analysis found large-cap (ADV$ >= $50M) HIGH EP alerts with
      rel_volume < 0.5 at alert time went 3/20 closed trades (15% WR,
      -$4,263 total) vs 25% WR for the >=0.5 control — directionally strong
      but retrospective, and rel_volume (today's cumulative volume / ADV) is
      TIME-SENSITIVE: a candidate open concern is whether <0.5 flags genuine
      thin-participation vs. is just an artifact of alerting early in the
      session (mechanically low rel_volume regardless of real participation).

      Per THE LINE, no live gate ships on retrospective evidence alone — a
      SHADOW observer was built (`_emit_large_cap_relvol_floor_shadow` in
      ep_detector.py, gated `LARGE_CAP_RELVOL_FLOOR_SHADOW_ENABLED`, default
      ON, audit-only) that writes ONE `filter:large_cap_relvol_floor_shadow`
      mi_audit_log row per qualifying HIGH alert (ADV$ >= $50M AND
      rel_volume < 0.5), capturing rel_volume, adv_dollar, and the alert's
      clock time (alert_timestamp_et/alert_time_et) — WITHOUT skipping the
      alert or touching score_tier/grade/entry. This review triggers once
      enough FRESH (post-shadow-ship) shadow-flagged entries have settled
      forward outcomes to (a) confirm the cohort keeps underperforming and
      (b) rule out the timing-artifact explanation via the captured
      alert-time distribution.

      PRICE BASIS (note for the reviewer): ADV$ here = `adv_20 * prev_close`
      (the PRE-GAP price, same basis as `mi_stock_scores.close` and this
      review's own predicate/action-query joins) — NOT `current_price`
      (today's already-gapped price). Using the gapped price would run every
      ADV$ figure hot by the gap size and admit names the retrospective
      cohort would have excluded. Both raw `adv_20` and `prev_close` are
      captured in the payload alongside the derived `adv_dollar` so either
      definition can be reconstructed if this needs reconciling.

      SAMPLING/TIMING BASIS (note for the reviewer): a ticker is scored
      (and its `mi_ep_alerts` row inserted) EXACTLY ONCE per day — the
      first scan tick it clears every filter (`already_today` dedup,
      ep_detector.py ~1963-1967, `continue`s any ticker already in
      today's mi_ep_alerts; the INSERT has no ON CONFLICT). rel_volume is
      therefore FROZEN at that single tick — there is no later/"settled"
      reading to fall back to, and this is the SAME frozen value a live
      gate would evaluate (it would reuse this same field, evaluated at
      the same scoring tick — see action_when_ready's R6-carve-out-style
      implementation note). Do NOT re-derive/re-sample; the timing-
      artifact check is done by STRATIFYING on the captured
      `alert_time_et`, not by re-sampling rel_volume at a different tick
      (e.g. the ORB window) — that would silently exclude the pre-market
      alert class this review's founding CSCO case belongs to (rel_volume
      0.04, a pre-market-timed reading) and desync the shadow from what
      a live gate would actually see.
    predicate_sql: |
      -- NEW events only (post-shadow-deploy, this card) with a settled
      -- (closed) mi_live_trades outcome for the same ticker/alert_date.
      SELECT COUNT(*) FROM mi_audit_log a
      WHERE a.event_type = 'filter:large_cap_relvol_floor_shadow'
        AND a.created_at > '2026-07-19'  -- post-shadow-deploy (this card)
        AND EXISTS (
          SELECT 1 FROM mi_live_trades lt
          WHERE lt.ticker = (a.detail::jsonb ->> 'ticker')
            AND lt.alert_date = (a.detail::jsonb ->> 'alert_date')::date
            AND lt.status = 'closed'
        );
    threshold: 10
    discriminates_on: [mi_live_trades.signal_type, mi_live_trades.account_mode]  # backfilled 2026-08-30 (#573) from the verified 2026-08-17 table->column mapping
    earliest_review_date: 2026-09-01
    action_when_ready: |
      1. Pull the N>=10 settled cohort:
           SELECT a.created_at, a.detail::jsonb ->> 'ticker' AS ticker,
                  (a.detail::jsonb ->> 'alert_date')::date AS alert_date,
                  (a.detail::jsonb ->> 'rel_volume')::float AS rel_volume,
                  (a.detail::jsonb ->> 'adv_dollar')::float AS adv_dollar,
                  a.detail::jsonb ->> 'alert_time_et' AS alert_time_et,
                  lt.status, lt.total_pnl, lt.closed_at
           FROM mi_audit_log a
           JOIN mi_live_trades lt
             ON lt.ticker = (a.detail::jsonb ->> 'ticker')
            AND lt.alert_date = (a.detail::jsonb ->> 'alert_date')::date
           WHERE a.event_type = 'filter:large_cap_relvol_floor_shadow'
             AND a.created_at > '2026-07-19'
             AND lt.status = 'closed'
           ORDER BY alert_date;

      2. Compute win rate + avg P&L for this cohort; compare against the
         SAME-PERIOD >=0.5 large-cap HIGH control (closed mi_live_trades,
         ADV$ >= $50M, rel_volume >= 0.5) using the same entry-aware
         methodology as the 2026-05-18 retrospective re-run (join to
         mi_live_trades, not close-to-close fwd_5d_pct — that metric is a
         drift signal, not an ORB-trade outcome; see the sibling review's
         2026-05-18 notes for why the first pass there was wrong).

      3. Timing-artifact check: bucket the cohort by alert_time_et (e.g.
         9:30-9:35 / 9:35-9:45 / 9:45+). If the <0.5 flags are overwhelmingly
         early-window (9:30-9:35) AND those early-window cases show MIXED
         (not uniformly poor) outcomes, that's an artifact — rel_volume<0.5
         is just "alerted early," not "genuinely thin" — do NOT ship, retire.
         If poor outcomes persist across the time-of-day distribution
         (including alerts well past 9:45 where rel_volume has had time to
         normalize), that supports genuine thin-participation.

      4. Decision:
           WR < 30% AND worse than the >=0.5 control AND NOT a timing
             artifact -> bring to the operator for the LIVE flip sign-off:
             `LARGE_CAP_RELVOL_FLOOR_ENABLED=true` gate in ep_detector.py
             (skip HIGH entries with ADV$ >= $50M AND rel_volume < 0.5),
             per CHANGE_PROCESS.md (Trigger/Evidence/Anticipated
             effect/Reversion-flag/Status fields) + a magna53_ep.md
             change-log entry. NEVER auto-flip this — operator signs
             THE LINE decision explicitly.
           Otherwise (WR >= 30%, OR not worse than control, OR the poor
             outcomes are a timing artifact) -> the retrospective finding
             did not hold prospectively (or was a time-of-day artifact) ->
             do NOT ship the live gate; retire this review with the finding
             logged in the change-log for the record. Cross-check against
             the sibling `rel_volume_small_cap_biotech_floor_evidence`
             review's outcome too (if that one also shows the same
             timing-artifact pattern, the whole rel_volume<0.5 hypothesis
             family is suspect, not just the large-cap variant).
    status: pending
    added_on: 2026-07-19

