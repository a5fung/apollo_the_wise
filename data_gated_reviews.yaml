  - review_id: flag_detector_graduation_evidence_n30
    title: "Flag detector TRIGGERED-as-EOD-classification is structurally wrong (#92 — re-framed)"
    question: |
      INITIAL FRAMING (2026-05-23 AM): "Does TRIGGERED stage earn
      paper-phase graduation at N≥30 settled cases with positive
      forward returns?"

      RE-FRAMED (2026-05-23 PM, user-corrected): TRIGGERED-as-currently-
      implemented is a POST-HOC EOD CLASSIFICATION, not an entry
      trigger. The 5:25 PM ET scan asks "did close > base_high?"
      AFTER the actual intraday breakout moment has passed. Our
      detector can't execute the methodology-correct entry; we're
      measuring an artifact, not a trading signal.

      Continuation-flag detector (`mi_flag_candidates`, shipped shadow
      phase 2026-05-04) initial evaluation:

        Stage      | N    | avg 10d  | WR≥+5% 10d
        -----------+------+----------+-----------
        TRIGGERED  |    5 |  -4.51%  |    0.0%
        COILED     |   26 |  -1.94%  |   23.1%
        TIGHTENING |  123 |  +1.14%  |   24.4%
        WATCH      |  486 |  -2.23%  |   20.6%

      Re-framed conclusion: STRUCTURAL NO-GO regardless of N. The
      -2.66% TRIGGERED return at realistic D+1-open entry isn't
      evidence the breakout methodology is bad — it's evidence that
      EOD-entry-after-the-intraday-move is structurally wrong. The
      data signature confirms: TRIGGERED stocks fade -2.03% from D
      close to D+1 open on average (sellers-into-strength after
      breakout-day close). The move plays out intraday; by EOD it's
      done.

      To trade flag breakouts properly requires an INTRADAY range-
      break detector (real-time 5-min scan; alert when price >
      base_high with volume confirmation; bracket entry at that
      moment). Filed as ADR 0005 / #94 separately. TIGHTENING
      watchlist surface filed as #93.

      Bright spot: TIGHTENING (pre-breakout stage) shows +1.73% avg
      10d / 28.8% WR / 21.2% big-winners ≥+10% — entry-aware metric.
      This is the move "leaking out" while we wait for EOD
      classification. Confirms breakouts ARE happening intraday;
      our scan just can't catch them.

      Re-evaluation auto-refreshes monthly via quarterly_review.py.
      Monthly script tracks whether TIGHTENING signal sustains so
      the intraday detector ships against current evidence, not stale.
    predicate_sql: |
      -- N>=30 settled TRIGGERED cases (10d forward window populated)
      WITH stage_rows AS (
          SELECT DISTINCT ON (ticker, scan_date) ticker, scan_date
          FROM mi_flag_candidates
          WHERE scan_date <= CURRENT_DATE - INTERVAL '12 days'
            AND stage = 'TRIGGERED'
      )
      SELECT COUNT(*) FROM stage_rows s
      LEFT JOIN mi_daily_closes d0
          ON d0.ticker = s.ticker AND d0.trade_date = s.scan_date
      LEFT JOIN LATERAL (
          SELECT close FROM mi_daily_closes
          WHERE ticker = s.ticker AND trade_date > s.scan_date
          ORDER BY trade_date ASC OFFSET 9 LIMIT 1
      ) d10 ON TRUE
      WHERE d0.close > 0 AND d10.close IS NOT NULL;
    threshold: 30
    earliest_review_date: 2026-08-15
    action_when_ready: |
      RE-FRAMED 2026-05-23 PM: this review's structural conclusion
      DOES NOT change with more N. EOD TRIGGERED classification is
      not an entry trigger; more N just confirms the same artifact.

      Action at every monthly re-run:
      1. Verify TRIGGERED-EOD signal remains weak (negative or near-
         zero forward returns at D+1-open entry). Drift to positive
         would warrant investigation but is not expected given the
         structural nature of the issue.
      2. Track TIGHTENING-stage signal sustainment. If +1%/25% WR
         holds steadily over the next 3+ months, it confirms the
         "move leaks out before EOD" thesis and strengthens the case
         for the intraday detector.
      3. Once intraday flag-break detector (ADR 0005 / #93) ships,
         this review can be CLOSED and superseded by an intraday-
         entry-aware evaluation review.

      Decision branches:
      - Intraday detector (#93) ships and accumulates N≥30 settled
        intraday-entry cohort: file NEW review evaluating that
        cohort's R-expectancy. Close this review.
      - Intraday detector NOT shipped by 2026-08-15: re-evaluate
