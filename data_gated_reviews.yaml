      DESIGN HOME: docs/decisions/0007-theme-engine-nascent-discovery-fix.md (the fix design — 5 vectors + read-only validation plan, advisor-reviewed 2026-05-31) + 0006-catalyst-discovery-loop.md — the investigator+advisor
      loop is the dynamic version of this synthesis pass; its §6 acceptance test validates
