# Data-gated reviews registry
#
# Items here are pending reviews that require data accumulation (n alerts, days
# elapsed, etc.) before they can be answered. The Sunday weekly system review
# auto-surfaces items whose predicate has flipped to ready.
#
# Schema per entry:
#   review_id: short unique id (snake_case)
#   title: 1-line summary surfaced in Telegram
#   question: what we're trying to answer
#   predicate_sql: must return single integer count; ready when count >= threshold
#                  OR set predicate_sql=null and rely on earliest_review_date alone
#   threshold: int — predicate must reach this for ready=true
#   earliest_review_date: ISO date — never surface as ready before this
#   action_when_ready: what the user should do when surfaced
#   status: pending | ready | done — flip to done after action taken
#   added_on: ISO date when entry was created (for audit)
#
# Update flow:
#   - New item: append entry, set status=pending
#   - When Sunday digest surfaces ready: act, then set status=done
#   - Done entries are kept (audit trail); parser skips them

reviews:

  - review_id: conviction_floor_extension
    title: "Conviction floor extension to gap[10,15)+strong band"
    question: |
      Does the gap∈[10,15) + catalyst='strong' cell carry enough forward edge
      to justify lifting MODERATE alerts in this band to a HIGH conviction
      floor at 55, 58, or 60?
    predicate_sql: |
      SELECT COUNT(*) FROM mi_audit_log
      WHERE event_type = 'conviction_floor_eligible'
        AND created_at > NOW() - INTERVAL '90 days'
        AND created_at < NOW() - INTERVAL '10 days'
    threshold: 15
    earliest_review_date: 2026-06-28
    action_when_ready: |
      docker exec apollo-market python -m scripts.fishhook_explorer
        --moderate-band-eval --days 90 --label-threshold 0.10
        --out /tmp/fishhook_moderate_band.csv
      Eyeball positive-label rate. If ≥ 35% pick the level (55/58/60) with the
      cleanest precision and promote to live conviction floor in ep_detector.py.
      Telemetry origin: fishhook_explorer 2026-04-29 cohort had n=1 eligible.

      ⚠ Dead-zone dependency (2026-04-29): gap[10,15)+strong stocks with thin
      pre-market shares (<25K floor) are systematically dead-zoned by the
      9:30-9:44 raw rel_volume ≥ 2x ADV gate, then projected only after 9:45
      (out of ORB window). FTAI/PI/GKOS this morning are this exact shape.
      Until the dead zone is resolved (see scripts/backfill_dead_zone.py
      step in next session), this cohort under-counts. If predicate hits
      threshold before dead-zone fix lands, prefer waiting another 30d to
      re-eval after gate calibration.

      📉 PRIOR EVIDENCE — leaning DON'T LIFT (2026-05-04, n=6 ORB sim):
      Pulled 6 historically-filtered candidates matching gap≥10% + strong
      catalyst (EL 5/01, ROKU 5/01, PWR 4/30, ELVR 4/28, ARM 4/24, DFTX 4/20)
      and ran ORB-high entry / ORB-low stop simulation against 1-min Polygon
      bars. Results diverged sharply from stock returns:
        EL    +3.4% close  / never_triggered
        ROKU  +6.1% close  / stopped 09:32  (-1R)
        PWR   +15.8% close / filled, held   (+0.99R)
        ELVR  +7.9% close  / stopped 10:24  (-1R)
        ARM   +14.8% close / stopped 09:55  (-1R)
        DFTX  +2.2% close  / stopped 09:32  (-1R)
      Net: 1/6 win, -3.01R total, -0.50R avg. Five of six closed green but
      stopped intraday — the early-dip-then-recover pattern blew through
      ORB-low. PWR is the lone hold-to-close winner.
      Methodology caveat (advisor): MAGNA53 zero-rates float/neglect/vol_conv
      for large-caps near 52w highs by design (Qullamaggie/Pradeep doctrine).
      PWR's "institutional gap" shape may belong in a separate detector
      class (Institutional Gap), not a MAGNA53 floor patch. n=6 too small
      to act on alone — keep this review pending until predicate fires at
      n≥15, then weigh against this prior. If the 90d cohort retains the
      ~1/6 win rate, close as "filter doing its job"; if it improves
      (≥3/6 or +R positive), lift the floor.
      Sim script: scripts/orb_sim_filtered_candidates.py.
    status: pending
    added_on: 2026-04-29

