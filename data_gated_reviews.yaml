      are inert and the judge reads evidence over flags, so stop treating them
      as load-bearing; (b) grades rise -> the false "no" WAS suppressing, and
      the pre-fix cohort deserves a re-read for names we under-graded; (c)
      grades fall -> unexpected, investigate before accepting.
      Do NOT tune anything off this read; it is a measurement.
