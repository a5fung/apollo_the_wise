  - review_id: regime_sizing_vs_tail_recheck
    title: "Regime sizing vs where the tail actually is — RECURRING as regime cells fill (#571/#508)"
    question: |
      Operator 2026-08-17, after the exit_regime_separability read: "we should keep
      monitoring this / review across more regimes to see if we need to adjust the
      position sizing."

      WHAT THE FIRST READ FOUND (n=3/3/1 winners — directional only, not a result).
      Conditional on working, non-bull winners ran FURTHER: among live magna53 trades
      reaching at least +1.5R, Bull averaged +2.22R, Correcting +2.98R, Choppy +7.92R,
      while the non-winners were indistinguishable across regimes (+0.51 / +0.40 /
      0.00). The whole difference sat in the tail. His reading: a true EP winner in a
      non-bull tape is one strong enough to resist the market's pull, so it runs
      further — though winners may be rarer there.

      THE TENSION THIS REVIEW EXISTS TO RE-TEST. REGIME_SIZING_ENABLED is live with
      Bull 1.00 / Choppy 0.75 / Correcting 0.50 / Crisis 0.25. R is risk-normalised,
      so the multiplier changes no R number — but in DOLLARS it halves exactly the
      cohort that showed the biggest runs. That is real downside protection doing its
      job AND a haircut on the best tail. Both are true, and at n=3/3/1 neither side
      is established.

      ⚠ THE HALF WE STILL CANNOT TEST: whether winners are genuinely RARER outside
      Bull. Hit rate among trades we TOOK was 33% Bull / 43% Correcting / 25% Choppy,
      which shows no scarcity — but scarcity would appear at the ALERT-to-ENTRY
      conversion stage, not among fills. Each run must measure conversion per regime
      from the alert population, not the fill population, or it answers the wrong
      question.

      ⚠ CONFOUND TO CARRY FORWARD: exit-era. Pre-2026-08-05 trades ran without the
      +2R partial and pre-2026-08-16 trades ran on the ORB-low stop (a different R
      unit). Peak REACHED is immune to the partial but NOT to the stop change, since
      that redefines R. Segment by era or the comparison silently breaks.
    predicate_sql: |
      -- Live magna53 records reaching +1.5R, per regime. Fires when a SECOND regime
      -- cell reaches 5 such trades, i.e. when any pair is comparable on more than the
      -- 3-vs-3 the first read had. Counts winners, not trades: the finding lives
      -- entirely in the tail, so tail count is what makes it readable.
      SELECT COALESCE(MIN(w), 0) FROM (
        SELECT COUNT(*) FILTER (WHERE r.peak_r >= 1.5) AS w
        FROM mi_sell_discipline_records r
        JOIN mi_market_regime g ON g.regime_date = r.alert_date
        WHERE r.account_mode = 'live' AND r.signal_type = 'magna53'
        GROUP BY g.regime
        ORDER BY 1 DESC LIMIT 2
      ) top2
    threshold: 5
    discriminates_on: [mi_sell_discipline_records.signal_type, mi_sell_discipline_records.account_mode]  # backfilled 2026-08-30 (#573) from the verified 2026-08-17 table->column mapping
    earliest_review_date: 2026-09-15
    status: pending
    action_when_ready: |
      Re-run the per-regime tail comparison on the larger cohort, SEGMENTED BY EXIT
      ERA, and additionally measure alert-to-entry conversion per regime so the
      "winners are rarer outside Bull" half finally gets tested. Then state plainly
      whether the tail really is bigger outside Bull, and whether the current
      multipliers are cutting it. ⚖ Sizing is THE LINE — report the finding and the
      fork; propose no multiplier. Any change is CHANGE_PROCESS + backtest + his
      sign-off. Record as a dated doc so the series stays comparable.
    added_on: 2026-08-17
    cross_refs: ["task #571", "task #508", "task #306", "review exit_regime_separability", "docs/analysis/exit_regime_separability_2026-08-17.md"]

  - review_id: exit_tune_cohort_review
    title: "Exit-rule cohort review — RECURRING at n=20/40/60/80/100 closed live trades (#503/#306)"
    question: |
      Re-run the exit-side forensic on the accumulated live cohort and re-decide
      the profit-taking rule. Operator 2026-07-25: this is deliberately NOT
      one-and-done - "it needs to run a bunch more times as n grows... it needs
      different regimes, themes, conditions to get right."

      Each run re-answers, on the LARGER cohort:
      (a) per-trade forensic - entry vs plan, MFE-before-exit, exit reason,
          holding period, regime at alert; classify variance / entry-quality /
          entry-mechanics / exit-discipline / regime (method:
          docs/analysis/503_zero_for_nine_forensic_2026-07-25.md);
      (b) the INTRADAY partial sweep - sell 1/3 at trigger L then stop to
          breakeven; sweep L over %, R-multiple and ADR/ATR bases (method:
          docs/analysis/306_intraday_partial_analysis_2026-07-25.md);
      (c0) SEGMENTED BY REGIME (operator 2026-08-01, asked repeatedly): "runners
          probably happen more often in bull markets, so one possibility is that we
          have more aggressive profit take on bear markets and let runners go in
          bull markets. The ask is to have all permutations ready once we have the
          samples." BUILT 2026-08-01 in _508_exit_rule_replay.py: 34 candidates
          incl. a regime-CONDITIONAL family (`rgm_<bull>/<chop>/<corr>`, where an
          arm of None = hold/no profit-take in that regime), plus a per-regime
          breakdown table that prints n per cell.
          ⚠ NOT READABLE YET, and the reason is structural, not sample size:
          REGIME IS CONFOUNDED WITH COHORT. Bull is 22/23 paper; Correcting is 7/7
          live; only Choppy has both sides (4 live / 2 paper). So today's grid
          cannot separate "bull markets run further" from "paper trades behave
          differently from live ones". What makes it readable is LIVE trades in a
          Bull tape - not merely more trades. Re-read (c0) at every run of this
          review and state which regimes have become separable;

          📌 RE-MEASURED 2026-08-06, and it is starker than the 08-01 note: of the
          14 closed LIVE trades, the regime split is Correcting 7 / Choppy 6 /
          Crisis 1 - **ZERO in a Bull tape, ever.** The entire 0-for-14 live record
          was compiled in non-bull conditions, on a momentum methodology that is
          explicitly a bull-market strategy. That does not excuse the record, but
          it does mean every exit-rule conclusion drawn from this cohort - INCLUDING
          (e) below - is a non-bull conclusion and must not be generalised without
          re-testing. The tape turned Bull ~2026-08-04 (evening brief 08-06: "Regime
          BULL, 3rd day"), so bull-tape live trades begin accruing NOW. That is the
          single most valuable data this series can acquire, and it is why
          `exit_tune_bull_regime_read` exists as a separate trigger below rather
          than waiting for the next n-milestone;

      (e) STOP GEOMETRY - entry-stop WIDTH relative to the stock's own volatility,
          and whether a floor on it helps. Added 2026-08-06 (operator: "we need to
          continue to perform this periodically as we have more trade samples and
          experience different market types/regimes").
          Method + full result: docs/analysis/live_cohort_day0_stopout_2026-08-06.md
          Re-runnable harness: scripts/probes/_stop_floor_forward_replay.py
          FINDINGS TO CARRY FORWARD, so they are not re-derived or re-proposed:
            * The ORB-low stop lands at 0.15x-1.18x of the stock's ADR20 with no
              relationship to the stock's character - measured twice now, on two
              different cohorts (07-25: 0.15-1.19x; 08-06: 0.15-1.18x). The stop's
              width is essentially random.
            * A volatility FLOOR on that stop was tested and REFUTED. Day-0 survival
              looked decisive (4 of 14 rescued, and they were the 4 biggest movers)
              but the forward replay showed survival was DELAY: all four hit the
              wider stop within 1-6 sessions. Realized: k=0 (deployed) -7.33R,
              k=0.5 -5.67R, k=0.75 -9.00R, k=1.0 -12.33R. Floor alone, partial off:
              -14.00R at every k, zero winners.
            * ⚠ THE MECHANISM, which is the durable lesson and generalises beyond
              this axis: widening the stop widens the R-unit, which RAISES the +2R
              target. MANE's target moved 121.98 -> 132.32 against a 129.80 peak, so
              the floor DESTROYS the partial on the very trade it was meant to save.
              Stop width and profit-take trigger are NOT independent axes. Any future
              candidate that changes the R-unit must be swept jointly with the
              take-profit level, never in isolation.
            * k=0.5's entire edge over k=0 is ONE trade (HUT). n=14. Not evidence.
          RE-TEST CONDITION (do not simply repeat it): re-run at each n-milestone AND
          on the first bull-tape read, because every trade above was non-bull. A floor
          that fails when nothing trends may behave differently when things run - that
          is a genuine open question, not a rehabilitation of a dead idea. State
          plainly at each run whether the refutation still holds;
      (c) SEGMENTED BY CHARACTER (operator 7/25: fast/gappy/small-cap/high-ADR
          names need more aggressive taking than slow large caps). Key this on
          ADR20 (the frozen probe convention). NOT pivot_analysis.character_profile
          - verified 2026-07-25 to be the WRONG tool: it profiles MA-respect and
          pullback depth (the trail-side axis) and carries no run-rate notion.
          The ADR% convention already exists in flag_detector; reuse that;
      (d) holding-period distribution - the n=9 cut showed live mean 0.28 DAYS
          vs paper winners 4-24 days, every paper winner held >=4 days.

      The n=9 baseline could NOT populate (c): ~2-3 trades per character bucket.
      Populating the segmentation is the main reason this recurs.
    predicate_sql: |
      -- ⚠ ERA-SCOPED 2026-08-22 (operator: "fix the trigger, stop wasting my time").
      -- BEFORE: this counted EVERY closed live trade ever, so the n=20 run on 2026-08-22
      -- fired on a 22-trade record in which 21 trades ran under exit rules that had
      -- ALREADY been replaced — it re-measured a stop the operator had widened on 08-16
      -- and told him the old one was too tight. Redundant by construction.
      -- NOW: count only trades ENTERED under the exit rules being tested. Bump
      -- _EXIT_ERA_START in the SAME commit as any future exit-rule change, or this
      -- review will once again grade a mixture dominated by superseded rules.
      -- _EXIT_ERA_START = 2026-08-16 (the operator-signed 2R stop).
      SELECT LEAST(
        (SELECT COUNT(*) FROM mi_live_trades
          WHERE account_mode = 'live' AND status = 'closed'
            AND created_at >= DATE '2026-08-16'),
        -- ── RUNNER GATE (2026-07-30, REPLACED a winner gate the operator broke) ──
        -- My first version required 2 live WINNERS. The operator caught the catch-22:
        -- "if our sell rules need improvement, current 3-day profit take may not yield
        -- 2 winners for a long time." Exactly right — live trades die at 1.5 days, never
        -- reach the day-3 partial, and always close ~-1R, so the gate waited on an
        -- outcome the rule under test structurally prevents. It could never open.
        --
        -- THE FIX, and the conceptual correction: the COST of a profit-taking rule is
        -- priced by trades that RAN PAST the trigger, NOT by trades that WON. MANE
        -- reached +7.92R and closed -0.23R: take 1/3 at +2R and you can price exactly
        -- what that third gave up on the run to 7.92R. A give-back trade is a PERFECT
        -- laboratory — you have the whole path. I had conflated "did the trade work"
        -- with "can we price the rule"; they are different questions.
        --
        -- So: count live trades whose peak ran WELL past any candidate trigger, which
        -- is what makes both benefit AND cost measurable. Satisfiable under the current
        -- rule, because running does not require surviving to day 3.
        --
        -- ── RE-KEYED TO ADR 2026-08-01: the gate was written in R, and R is not a unit ──
        -- docs/analysis/508_exit_trigger_unit_2026-08-01.md measured entry-to-stop
        -- distance at 0.15-1.17 ADR across the same 12 live trades - a 7.7x spread. So
        -- `peak_r >= 4` does not mean "ran a long way"; it partly means "had a tight
        -- stop". CRSR (paper) recorded +12.36R on 0.06 of a daily range. The gate was
        -- keyed in the very unit the review exists to interrogate - it inherited the
        -- flaw it was built to study, and it counted the evidence 1-vs-5.
        --
        -- Threshold picked to PRESERVE THE ORIGINAL INTENT, not to manufacture
        -- readiness: 4R against a ~2R candidate trigger was "~2x past it", so the ADR
        -- analogue of 1.5x the 1-ADR candidate is peak_adr >= 1.5 -> today 2 trades
        -- (NVCR 2.35, SMCI 1.68) -> 20. Note `peak_adr`, NOT `peak_atr`: peak_adr is
        -- what the recorder actually stores; no peak_atr column exists.
        --
        -- ⚠ This re-key does NOT open the gate. LEAST() still binds on the FIRST term:
        -- 12 closed live trades vs threshold 20. The runner term simply stops being the
        -- artificial blocker, so cohort size - the honest constraint - governs again.
        (SELECT 10 * COUNT(*) FROM mi_sell_discipline_records
          WHERE account_mode = 'live' AND peak_adr >= 1.5
            AND created_at >= DATE '2026-08-16')
      );
    # RUN 2026-08-22 at n=22 -> docs/analysis/exit_tune_cohort_review_2026-08-22.md
    # VERDICT: the stop this record was compiled under was TOO TIGHT — median stop
    # 0.42 of ONE normal day's trading range (18 of 21 under a single day's range),
    # and 17 of 22 live trades died the day they were opened.
    # Eras, never averaged: A (ORB-low stop, no partial) n=15 -9.73R; B (+2R partial)
    # n=6 -3.93R; C (the signed 2R stop, live 08-16) n=1 — said, not smoothed.
    # 7 trades reached +2R; the 5 with NO partial banked -2.93R out of +18.9R of peaks,
    # while the one trade under the new stack kept +3.42R of a +5.39R run.
    # Regime hypothesis NOT settled: the confound MOVED, it did not die — every Bull
    # trade ran under the new exit stack and every non-Bull under the old, so realized-R
    # by regime compares exit stacks, not tapes. Non-Bull era-C closes settle it.
    # Threshold RESET to 20 — the counter now starts from zero on the current exit era,
    # so the n=20/40/60/80/100 ladder restarts against the rules actually under test.
    # At 2026-08-22 the era-C count is 1, so this correctly will not fire again for a while.
    threshold: 20
    discriminates_on: [mi_live_trades.signal_type, mi_live_trades.account_mode, mi_sell_discipline_records.signal_type, mi_sell_discipline_records.account_mode]  # backfilled 2026-08-30 (#573) from the verified 2026-08-17 table->column mapping
    earliest_review_date: 2026-08-01
    status: pending
    action_when_ready: |
      ⚠ STALL CLAUSE (added 2026-08-01, mirroring cooldown_admission_unassumed).
      THE KILL/SCALE BANDS ACTIVATE AT THE SAME n=20 (PLAN #503, projected
      ~2026-08-20) and on a 0-for-12 start REDUCE is the modal outcome with KILL
      live. If a band action, /pause or a demotion halts live accrual, this
      predicate freezes below threshold and is NEVER surfaced again -
      escalate_overdue_reviews only reports READY or ERRORING reviews, so a
      healthily-pending 12/20 goes silent permanently. So: if live accrual halts,
      OR n < 20 by 2026-10-01, RUN THIS REVIEW AT WHATEVER n EXISTS. A smaller
      honest read beats an indefinite wait.
      ⚠ RE-BASELINE, do not blend: if #503 changes the ENTRY, trades taken under
