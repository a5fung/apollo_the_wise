      new theme name with "Interconnect" in it, then pulled SNDK in
      either:
      (a) by ticker similarity grouping (NAND flash → memory chip
          interconnect → "interconnect" theme),
      (b) by description keyword overlap ("wafer" or "semiconductor"
          in SanDisk's description matching the new theme name), or
      (c) by structural placement during a split — if "AI Memory &
          Storage" got split and Sonnet had to redistribute orphans.

      Need to diagnose the mechanism by reading 2026-05-14 theme run
      audit events around SNDK + the new theme creation.

      Refinement options (pick after diagnosis):
      1. Tighten prompt: require the LLM to state the ticker's CORE
         BUSINESS in a one-sentence rationale field, then reject
         assignments where the rationale contradicts the theme thesis.
      2. Post-LLM sector filter: if ticker.sector ≠ majority sector
