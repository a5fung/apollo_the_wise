        - If 9M Day 2 cohort R is negative AND flag-detector subset
          shows positive: deprecate mechanical, rely on flag-detector
        - If 9M Day 2 cohort R is negative AND no flag-detector subset
          shows edge: deprecate entirely (Option A)

      Phase 3 — Ship decision:
        (A) Deprecate: set 9m_day2 strategy phase='shadow', rely on
