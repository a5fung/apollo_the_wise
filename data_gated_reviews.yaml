  - review_id: gate_5g_historical_coverage
    title: "Gate 5 G retroactive coverage — would the gate have caught CRMD/KLAR/ARM/BW/AIXI?"
    question: |
      Gate 5 G shipped 2026-05-17 (commit fd31e5b) — static-analysis
      check that fails the deploy on any (column, function) write pair
      not in ALLOWED_WRITERS. The gate's value depends on whether it
      would have actually CAUGHT the five trade-state corruption bugs
      from May at their introducing commits.

      If YES on all five: compelling regression evidence for the
      live_cutover_decision composite review — Gate 5 G structurally
      prevents the bug class.
      If NO on any: file as gate-coverage refinement; expand
      ALLOWED_WRITERS' strictness OR add complementary check.

      Five bugs to walk:
        1. CRMD (2026-05-14 commit 35c1f6c) — entry-fill UPDATE added
           lowest_price_seen/highest_price_seen NUMERIC columns sharing
           $2 with double precision entry_price. Type-collision bug.
        2. KLAR (2026-05-15) — entry-fill UPDATE writing stop_price =
           trade["orb_low"] for 9M Day 2 (wrong; should be prior_day_low).
        3. ARM (2026-05-07 stop-fill state desync) — purpose-tagging
           routing fix; stop_order_id stale ID class.
        4. BW (2026-05-14) — wrapping UPDATE wrote partial_taken=TRUE
           optimistically before broker fill confirmed.
        5. AIXI (2026-05-14 splits_ingest) — phantom split detection.
           Adjacent class; may or may not be in scope of Gate 5 G.

      Methodology: for each bug, identify the introducing commit's diff,
      check whether the new writer (function) was already in
      ALLOWED_WRITERS for the columns it touched. If absent → Gate 5 G
      would have blocked the deploy. If present → Gate 5 G would have
      passed; bug class not covered.
    predicate_sql: |
      -- Predicate: Gate 5 G shipped + at least one deploy completed
      -- with the [5c/5] step green (proxy: SSoT entry exists).
      -- Audit log proxy: any deploy verification entry mentioning Gate 5 G.
      SELECT COUNT(*) FROM mi_audit_log
      WHERE event_type = 'dual_account_boot_verified'
        AND created_at::date >= '2026-05-17';
    threshold: 1
    earliest_review_date: 2026-05-18
    action_when_ready: |
      30-min investigation:
      1. git show 35c1f6c -- agents/market_intelligence/broker/trade_stream.py
         → check if the new column writes (lowest/highest_price_seen) had
         _process_entry_fill in their ALLOWED_WRITERS entry at commit time.
         If those columns didn't exist pre-commit, the bug was a
         type-mismatch on $2 param, NOT a column-ownership violation —
         Gate 5 G would NOT have caught it (Gate 5 B prepare validation
         is the correct gate for this class).
      2. Pre-d6fa74c trade_stream._process_entry_fill: did it write
         stop_price? If YES, _process_entry_fill was in ALLOWED_WRITERS
         (today's T1.1 removed it). Gate 5 G would have passed —
         retroactively allowing the bug. Document this honestly.
      3. ARM stop-fill desync: was the introducing commit a writer
         addition? Likely was a SELECT-based routing bug, not a column
         write. Gate 5 G not applicable.
      4. BW: pre-c0fa67f live_tracker wrapping UPDATE wrote partial_taken.
         At BW time, partial_taken was likely in ALLOWED_WRITERS for
         live_tracker.update_open_positions_live. Gate 5 G would have
         passed — Friday's ALLOWED_WRITERS design (single owner
         finalize_partial_exit only) wouldn't have existed yet.
      5. AIXI splits_ingest: completely different file/table; out of
         Gate 5 G's scope (mi_live_trades only).

      Expected outcome: Gate 5 G's NET value is forward-looking — it
      prevents future regressions where someone adds a new writer to a
      sensitive column without explicit ALLOWED_WRITERS update. For the
      five May bugs, Gate 5 G's retroactive coverage is partial at best.

      File outcome in docs/setups/safeguards.md change log + amend
      live_cutover_decision composite review notes.
    status: done
    added_on: 2026-05-17
    closed_on: 2026-05-17
    outcome: |
      Walked all five May trade-state bugs against today's Gate 5 G
      allow-list at their introducing commits. Honest verdict:

      CRMD (35c1f6c, 2026-05-10): NOT applicable. Bug was type-mismatch
      on $2 param (numeric vs double precision). Gate 5 B prepare
      validation is the correct gate; caught the class when shipped
      2026-05-14. Introducing commit added lowest/highest_price_seen
      writes to `_process_entry_fill` — the legitimate writer for paired
      columns. Gate 5 G would have passed.

      KLAR (pre-d6fa74c, 2026-05-15): WOULD NOT catch. _process_entry_fill
      was already an authorized stop_price writer. Bug was WRONG VALUE
      (trade["orb_low"] vs trade["stop_price"]) written by an authorized
      writer. Gate 5 G structurally cannot catch wrong-value-by-
      authorized-writer. Today's T1.1 removed stop_price from this
      UPDATE entirely — that's the proper resolution.

      ARM (pre-6843141, 2026-05-07): NOT applicable. Stop-fill state
      desync was a SELECT/routing bug (stop_order_id matching), not a
      column-write violation. Fix shipped 2026-05-08 (purpose-tagged
      routing).

      BW (pre-c0fa67f, 2026-05-14): WOULD catch under today's narrowed
      allow-list. Pre-Friday, live_tracker.update_open_positions_live
      was a writer to partial_taken. Today's ALLOWED_WRITERS narrows
      partial_taken to just finalize_partial_exit — any new writer
      attempting partial_taken from outside finalize_partial_exit now
      fails the deploy. Concrete forward-looking win.

      AIXI (splits_ingest, 2026-05-14): NOT applicable. Wrong-units
      phantom-split data corruption on mi_daily_closes — different
      table. Gate 5 G's scope is mi_live_trades only.

      Net: Gate 5 G is FORWARD-LOOKING. Retroactive coverage is partial
      (1 of 5 under today's design). The other 4 are different bug
      classes covered by different gates:
        - Type-mismatch   -> Gate 5 B prepare validation
        - Wrong-value     -> no current gate
        - Routing/SELECT  -> purpose-tagged orders (shipped)
        - Cross-table     -> different gate per table

      Implication for live_cutover_decision composite: Gate 5 G is
      NECESSARY BUT NOT SUFFICIENT. Closes one recurring class (multi-
      writer column ownership) and adds friction for future co-writer
      additions. Adequate for live cutover when paired with Gate 5
      A/B/C/D/E + stop-ACK timeout watchdog.

      Future-work filed: "value-invariant" gate for sensitive columns
      (stop_price > 0, stop_price < entry_price for long positions,
      hard_stop <= stop_price, etc.). Defensive belt-and-suspenders.
      Could become Gate 5 H if KLAR-class bugs recur. Not blocking
      live cutover.

  - review_id: gate5h_value_invariant_proposal
    kind: tripwire
    title: "Gate 5 H: value-invariant preflight for sensitive trade-state columns"
    question: |
      Gate 5 G column-write authority preflight (shipped 2026-05-17) closes
      the multi-writer ownership class. It does NOT catch the KLAR class:
      WRONG VALUE written by an AUTHORIZED writer. KLAR bug: pre-d6fa74c
      trade_stream._process_entry_fill wrote `trade["orb_low"]` to
      stop_price for 9M Day 2 (correct shape would be `trade["stop_price"]`
      = prior_day_low). Gate 5 G would have passed (entry_fill was an
      authorized writer at the time); the bug was VALUE not OWNERSHIP.

      Proposed: a new preflight gate that asserts row-state invariants on
      every mi_live_trades INSERT/UPDATE-prepared SQL. Examples:
        - stop_price > 0 (never zero/negative)
        - stop_price < entry_price for long positions (stop below entry)
        - hard_stop <= stop_price always (trail moves up, never below floor)
        - remaining_shares <= entry_shares (can't exceed initial)
        - remaining_shares >= 0
        - status IN ('order_placed', 'submitting', 'filling', 'filled',
                     'closed', 'cancelled', 'skipped')

      Two implementation paths:
        A) Postgres CHECK constraints on the table — declarative,
           runtime-enforced, fails INSERT/UPDATE if violated. Tightest
           guarantee but might break existing paths that legitimately
           transition through invalid intermediate states.
        B) Application-level invariant checker — runs as preflight before
           commit, can have escape hatches. Less strict but more flexible.

      Defensive belt-and-suspenders. Not blocking live cutover today.
      Ship when the next KLAR-class wrong-value-by-authorized-writer bug
      surfaces (predicate fires the review).
    predicate_sql: |
      -- Predicate fires when a KLAR-class wrong-value bug recurs.
      -- Definition: a methodology-wrong stop_price exists on a closed
      -- trade where (a) entry_price > stop_price was always required for
      -- long, and (b) hard_stop > stop_price (a real ordering violation,
      -- not just trail-to-BE).
      --
      -- Today's data: zero such cases (the KLAR fix d6fa74c reconciled
      -- everything 5/15). When predicate fires, ship Gate 5 H.
      SELECT COUNT(*) FROM mi_live_trades
      WHERE status = 'closed'
        AND closed_at >= '2026-05-15'
        AND stop_price IS NOT NULL AND hard_stop IS NOT NULL
        AND entry_price IS NOT NULL
        AND (stop_price <= 0
             OR stop_price > entry_price
             OR hard_stop > stop_price + 0.01)  -- 1c tolerance for trail rounding
        AND pnl_attribution IS NULL;
    threshold: 1
    discriminates_on: [mi_live_trades.signal_type, mi_live_trades.account_mode]  # backfilled 2026-08-30 (#573) from the verified 2026-08-17 table->column mapping
    action_when_ready: |
      Predicate fires when ≥1 trade closed since the KLAR fix shows a
      stop_price ordering violation (the bug class Gate 5 G can't catch).

      When fires:
        1. Investigate the offending trade: what code path wrote the wrong
           value? Is it an authorized writer (Gate 5 G allowed) writing
           wrong data, or an unauthorized writer slipping through?
        2. If authorized writer with wrong value → Gate 5 H is needed.
           Choose implementation path A (Postgres CHECK) or B (app-level
           invariant) based on the specific column + transition shape.
        3. If unauthorized writer → tighten ALLOWED_WRITERS instead.
        4. Ship the fix + corresponding test (similar to
           tests/test_db_update_prepare.py for Gate 5 B).

      Until fires: monitor via daily L1 anomaly scan. Predicate query is
      cheap; could be added to audit_invariants.py as
      `check_stop_price_ordering` for proactive detection (vs reactive).
    status: pending
    earliest_review_date: 2026-09-01
    regated_on: 2026-08-06
    regate_kind: date
    regate_reason: >-
      RE-GATED 2026-08-06 — the tripwire's 3 hits are all FALSE POSITIVES: FPS 6/25, IBM 6/10, GOOGL 
      5/19 are trailed stops sitting above entry on winners, which its own comment says should not co
      unt. The `stop_price > entry_price` disjunct is wrong for a ratcheting trail. Zero true orderin
      g violations exist.
    added_on: 2026-05-18

