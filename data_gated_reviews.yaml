    predicate_sql: |
      SELECT COUNT(DISTINCT date_trunc('day', created_at AT TIME ZONE 'America/New_York'))
      FROM mi_audit_log
      WHERE event_type = 'ep_adv_probe_synthesized'
        AND created_at > NOW() - INTERVAL '14 days'
