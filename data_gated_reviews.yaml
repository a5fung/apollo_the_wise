  - review_id: paper_r_expectancy_validation
    title: "Paper R-expectancy positive over recent N≥10 (GATE 3 of live cutover) — COHORT RESET 2026-05-12"
    question: |
      **GATE 3 of 3 for live-$ cutover decision** (advisor 2026-05-10:
      methodology validation gate is positive R-expectancy in paper, not
      "enough trades to justify going live"; current 0/3 live cohort needs
      reset by N≥10 closed trades trending positive).

      **COHORT RESET (advisor 2026-05-11):** four methodology changes
      shipped on 2026-05-11 (#72 catalyst prose downgrade, #73 re-entry
      gap-through gate, #79 deal-pin filter, #80 proximity scaling).
      The R-expectancy gate must measure stable system behavior, not the
      changes it's validating readiness for. Counting starts from
      2026-05-12 — the first trading day under the new gates.

      Over the most recent 10 closed paper trades **from 2026-05-12
      onward**, is total R-expectancy positive? Pradeep/Qullamaggie
      methodology accepts low win rates (~25-30%) so long as winners
      run multiples of risk. The validation threshold is +R cumulative
      across N≥10, not win-rate.

      ## Corruption windows (must be excluded or re-evaluated post-fix)

      **2026-05-14 CRMD naked position**: tagged via pnl_attribution,
      auto-excluded by predicate. No further action needed.

      **2026-05-07 → 2026-05-15 stop_price clobber** (fixed 2026-05-15
      commit d6fa74c, reconciled same day):
      - ARM #107 (5/07): stop_price was $218 (orb_low clobber), true
        was $220.10 (prior_day_low). Not in cohort (closed pre-5/12)
        but corrupted R-expectancy reads for any cohort window.
      - KLAR #149 (5/15): stop_price was $15.74, true was $14.96.
        IN cohort. Pre-reconcile R = -3.20R fictional. Post-reconcile
        R = -1.03R real. **Difference: +2.17R fictional loss.**
      - GOOGL #56 (5/01): possibly affected; investigation pending
        Sunday. If contaminated, file as third reconcile.

      **Modeling concern — entry_price == stop_price for some closed
      trades** (FTRE #72, SMCI #82): risk basis = $0 → r_multiple
      undefined. Likely a breakeven-trail moved stop up to entry.
      Gate 3 R-calc currently uses `entry_price - stop_price` but
      stop_price reflects CURRENT (possibly trailed) stop, not
      ORIGINAL risk. Filed as `gate3_initial_stop_modeling`
      followup — R calc should use the original stop set at INSERT,
      not the trailed value.
    predicate_sql: |
      -- 2026-05-14: added pnl_attribution IS NULL filter to exclude
      -- bug-attributable trades from methodology evaluation. CRMD #137
      -- tagged 'incident_2026_05_14_naked_position' after the naked-position
      -- incident — its -$778 includes ~-$558 of bug damage (vs intended
      -- stop at -$220). Actual P&L still hit the account; only the
      -- methodology gate excludes.
      SELECT COUNT(*) FROM mi_live_trades
      WHERE account_mode = 'paper'
        AND status = 'closed'
        AND closed_at >= '2026-05-12'
        AND pnl_attribution IS NULL
    threshold: 10
    earliest_review_date: 2026-05-22
    action_when_ready: |
      Compute R-expectancy on the most recent 10 closed paper trades
      from the post-2026-05-12 cohort, excluding bug-attributable trades.

      IMPORTANT (2026-05-18 update — gate3_initial_stop_modeling resolved):
      risk_per_share uses `hard_stop` (immutable INSERT value) NOT
      `stop_price` (current/trailed). Trail-to-breakeven would otherwise
      collapse risk_per_share → 0 and break r_multiple.

        WITH recent AS (
          SELECT id, ticker, alert_date,
                 entry_price, hard_stop, stop_price, entry_shares, total_pnl,
                 (entry_price - hard_stop) AS risk_per_share,
                 ((entry_price - hard_stop) * entry_shares) AS initial_risk_dollars
          FROM mi_live_trades
          WHERE account_mode = 'paper'
            AND status = 'closed'
            AND closed_at >= '2026-05-12'
            AND pnl_attribution IS NULL    -- exclude bug-attributable
          ORDER BY closed_at DESC
          LIMIT 10
        )
        SELECT
          COUNT(*) AS n,
          SUM(CASE WHEN total_pnl > 0 THEN 1 ELSE 0 END) AS wins,
          ROUND(AVG(total_pnl)::numeric, 2) AS avg_pnl,
          SUM(total_pnl) AS total_pnl,
          ROUND(AVG(total_pnl / NULLIF(initial_risk_dollars, 0))::numeric, 2) AS avg_r
        FROM recent;

      Decision:
        - Total_pnl > 0 across N=10 → GATE 3 GREEN. Methodology validated.
        - Total_pnl ≤ 0 across N=10 → DEFER cutover by another N=10. Either
          methodology is broken (re-evaluate setup definitions) or sample
          variance — accumulate more paper data.
        - If 0 wins across N=10 → STOP. Investigate detection-side bugs
          before continuing. Compare cohort to backtest expectancy.

      Note: R computation here is approximate (uses entry_price - stop_price
      as denominator). For precise R, multiply per-share P&L by entry shares,
      divide by initial $ risked. Apollo doesn't currently store an "R" column
      — rely on total_pnl direction + cumulative sign as the validation
      proxy. If precision matters, file a per-trade R column followup.

      Origin: 2026-05-10 advisor live-cutover gate review.
      Cohort reset: 2026-05-11 advisor review after 4 methodology ships
      contaminated the prior week's cohort (sample-size discipline
      violation; see memory feedback_sample_size_discipline).
    status: done
    added_on: 2026-05-10
    resolution_2026_07_04: |
      GATE-3 CLOSED (operator 7/4): raw cohort read -12.73R/n=20 since 5/12 — adjudicated at the GO as an IEX feed artifact by the #223 SIP-replay (selection delta +2.51R; GO-supportive, operator-ratified 6/19). The raw-paper-R premise was superseded by the SIP-reconstruction standard; live R accrual (kill/scale bands + the #413 lifecycle watch) is the going-forward measure.
