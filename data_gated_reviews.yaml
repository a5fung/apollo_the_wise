  - review_id: gate3_initial_stop_modeling
    title: "Gate 3 R-calc should use INITIAL stop, not current (trailed) stop"
    question: |
      Discovered 2026-05-15 during Track 4 damage assessment: FTRE #72
      and SMCI #82 both have entry_price == stop_price → risk basis
      $0/share → r_multiple undefined.

      Root cause: stop_price column reflects CURRENT stop (after any
      trail updates including breakeven). When a winner gets trailed
      to breakeven and then exits at profit, current stop ≈ entry, so
      `entry_price - stop_price = 0`. R calc breaks.

      Pradeep/Qullamaggie R-multiple definition: P&L / INITIAL_RISK
      (the risk at trade ENTRY). Trail updates don't change R basis.

      Need a separate column `initial_stop` (or `risk_per_share`)
      set ONCE at INSERT and never updated. Gate 3 R-calc reads
      initial_stop, not stop_price.
    predicate_sql: |
      -- Predicate: trades where current Gate 3 calc produces NULL R
      -- due to entry==stop trail collapse.
      SELECT COUNT(*) FROM mi_live_trades
      WHERE account_mode='paper' AND status='closed'
        AND ABS(entry_price - stop_price) < 0.01
        AND closed_at >= '2026-05-12';
    threshold: 1
    earliest_review_date: 2026-05-18
    action_when_ready: |
      1. Add column `initial_stop NUMERIC` to mi_live_trades (idempotent
         migration via db.py _ensure_schema).
      2. Populate at INSERT in entry_pipeline.py:358 — copy
         order_spec["stop_loss_price"] into both stop_price AND
         initial_stop.
      3. Backfill historical rows: `initial_stop` from
         `orb_order_placed` audit log entries.
      4. Update Gate 3 R-calc SQL: use initial_stop, not stop_price.
      5. Update CRMD post-mortem note: stop_price is current; initial
         risk is initial_stop.
      6. Add to BACKLOG.md done.
      Origin: 2026-05-15 Track 4 methodology damage assessment.
    status: done
    added_on: 2026-05-15
    closed_on: 2026-05-18
    outcome: |
      PIVOTED from Option A (add new initial_stop column) to Option B
      (use existing hard_stop as immutable risk basis) per advisor 2026-05-18.

      Discriminator query confirmed hard_stop is intact across the
      methodology cohort:

        signal_type | n  | min_risk | max_risk | zero_risk_count
        ------------+----+----------+----------+----------------
        9m_day2     |  2 |  $1.15   |  $3.90   |  0
        magna53     | 13 | -$0.09   |  $7.68   |  0

      The single negative (CRMD #137, -$0.09) is the incident trade
