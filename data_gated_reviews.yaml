      2. Join to mi_daily_closes for forward 5d returns from
         open_d0 → close_d+5.
      3. Build baseline cohort: HIGH MAGNA53/9M alerts in same window
         that did NOT fire convergence tag. Apply mi_security_types
         filter (CS/ADRC only) + dedup per #59 hygiene.
      4. Stratify by class — breakout vs anticipatory vs neither.
