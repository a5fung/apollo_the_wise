    #     GDC  2026-05-06   14.8x  fwd_5d +13.7%  <- the ONLY genuine hit
    #     SLP  2026-05-06    3.8x  fwd_5d  +5.8%
    #
    # ⚠ ERNA IS A CORPORATE-ACTION ARTIFACT, not a missed winner. `split_applied
    # | ERNA 2026-05-04 25:1 — 171 bars overwritten` (2026-05-07 00:18). A 25:1
    # reverse split against unadjusted volume manufactures exactly this shape;
    # ERNA's rel_volume collapses to 4.9x on 05-08 and 3.2x on 05-13 once the
