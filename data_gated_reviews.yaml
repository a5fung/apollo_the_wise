  - review_id: ep_cooldown_resetup_admission
    title: "EP 60-day cooldown → extension/structure-aware re-setup admission"
    question: |
      The 60-day EP cooldown ("alerted within last 60 days") uses TIME as a
      proxy for "still extended from the prior EP" — but it is catalyst- AND
      structure-blind. A name that ran on an EP, then PULLED BACK + based/
      flagged, then re-breaks out on a FRESH catalyst is a re-SETUP (no longer
      extended), not a re-fire — arguably higher-quality than a first gap
      (Qullamaggie continuation). The cooldown suppresses exactly that case.
      Proposed: ADMIT a re-setup (pulled-back + re-based/not-extended + fresh
      strong/game_changer catalyst); SUPPRESS only a still-extended re-fire.
      Reuse the existing forward extension gate ("already up X% in prior 5d").
      Catalyst-freshness is one input; "is it still extended" is the bigger one.
    predicate_sql: |
      SELECT COUNT(*) FROM mi_ep_scan_log
      WHERE scan_date >= '2026-04-01'
        AND filter_reason ILIKE 'EP cooldown%'
        AND gap_pct >= 15;
    threshold: 10
    earliest_review_date: 2026-06-08
    action_when_ready: |
      Evidence ALREADY EXISTS (no forward wait): pull mi_ep_scan_log rows with
      filter_reason ILIKE 'EP cooldown%' AND gap_pct >= 15 over ~90d. For each,
      classify re-setup vs still-extended (pulled back/based since the prior
      alert? use MIN-close-since-prior-alert / distance-from-base vs the forward
      extension logic) + JOIN forward returns. Decision: if re-setups show
      positive fwd edge AND the cooldown is suppressing them, add an
      extension/structure + fresh-catalyst override. Ship shadow-first
      (cooldown_override_admit audit → observe → live). CHANGE_PROCESS: read EP
      SSoT, advisor, SSoT-in-same-commit.
    example_cases:
      - ticker: FLNC
        date: 2026-06-01
        note: |
          Fired EP HIGH 2026-05-07 (score 96, gap 29.7%, pre-earnings). Pulled
          back to $18.88 (below pre-EP) + based/flagged. 2026-06-01 re-broke out
          on a FRESH NVDA-deal catalyst, gap 20%+ from pre-market — but every
          scan tick was filtered "EP cooldown — alerted within last 60 days"
          (mi_ep_scan_log; prev_close 18.88 + gap seen correctly). A re-setup
          wrongly suppressed as a re-fire; caught by the 9M intraday track at
          1:45 PM instead. Also a flag-breakout — cross-ref #94/#95/#98 +
          Stocks-in-Play (re-based structure + fresh catalyst + EP gap in one).
    backward_check_2026_06_01: |
      Read-only backward-check (mi_ep_scan_log, ~6wk since 4/20). DIRECTIONAL,
      not ship-ready (see caveats).
      COHORT: 55 cooldown-suppressed ticker-days; 22 at gap>=15%, 9 at >=20%
      (~3-4 significant/wk — not rare).
      DISCRIMINATOR = days-since-prior-alert, and it is SHARP:
        - days_since <=7 (~10: FLNC 5/08, CRSR 5/28, VCX, RDW, MRAM, TE, PCT):
          day-after continuation of the SAME EP, still extended -> suppress CORRECT.
        - days_since >=10 (~12, several 25-59d: HIMX 56d +31%, YSS 59d, FLNC 25d
          +36%, CMPS 28d +28%, APLD 28d, HLIT 14d, ELPW 53d): fresh weeks-later
          gap -> re-setup -> suppress WRONG.
      FORWARD EXCURSION (max high over next ~7td, suppressed re-setups w/ data):
      YSS +40%, HIMX +36% & +22%, ELPW +42%, CMPS +18%, HLIT +16% — 6 of 10 ran
      >=+16% after suppression = lost-alpha signal. (INBX/MICC fizzled.)
      IMPLICATION: 60-day cooldown is ~6-8x longer than the ~7-10d that actually
      separates extended-continuation (suppress) from re-setup (admit). Candidate
      fix: shorten cooldown to ~10d, OR a re-based/not-extended + fresh-catalyst
      override beyond ~10d.
      BETA BASELINE (run 2026-06-01 — RESOLVES caveat 2): alerted high-gap
      (>=15%) cohort, SAME window + SAME fwd_max metric (n=105): median +8.8%,
      avg +13%, 28% ran >=+15%, 13% >=+25%. Suppressed re-setups (n=10): median
      ~+17%, 60% >=+15%, 30% >=+25% — ~2x the baseline on median AND hit-rate
      (holds even ex-ELPW). The edge SURVIVES the bull-tape beta check — it is
      NOT beta. Core thesis GREEN; #167 now owes only realized-R (ORB+stop) +
      the exact threshold/extension classifier.
      CAVEATS — do NOT ship on this alone:
        (1) fwd_max is BEST-CASE excursion, not realized R (ORB entry+stop gets
            only part; ELPW +42% high but -87% low = $6 lottery ticket, not a win).
        (2) NO alerted-cohort baseline yet -> some upside is bull-tape beta; run
            the same fwd_max on the ALERTED cohort to net it out
            (feedback_validate_metric_before_decision).
        (3) small N + mixed quality (small-caps inflate).
      #167 TODO: alerted-cohort baseline; realized-R model; re-based/extension
      classifier (confirm pullback vs still-extended); THEN CHANGE_PROCESS ship
      decision on cooldown length / override.
    cross_refs: [theme_axis_gating_logic, "task #170", "task #171 (/setup+/why observability)"]
    status: done   # normalised from 'resolved' 2026-08-03 — the schema vocabulary is pending|done|deferred  # 2026-07-12 SITTING: NO-GO ratified — the 7/11 full-history backtest (docs/analysis/170_resetup_backtest_table_2026-07-11.md, N=89) answered the owed realized-R + like-for-like baseline: the admitted cohort runs BELOW the live EP book (+5.6% vs +7.4% median) and the gap filter is anti-selective; the 6/01 N=22 edge did not replicate. Cooldown stays as-is; task #170 closed.
    added_on: 2026-06-01

