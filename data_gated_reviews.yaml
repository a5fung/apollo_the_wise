  - review_id: l2_baseline_window_trending_metrics
    title: "L2 baseline window too sluggish for trending metrics (earnings-season transitions)"
    question: |
      30d trailing median lags on metrics with secular trend, producing
      false-positive L2 alerts during transitions (post-earnings tail-off,
      etc). Confirmed evidence (2026-05-20):
        - 2026-05-19 L2 9m_alerts_per_day: today=8, 30d median=17.5,
          z=-3.17. Verified FP — earnings season ended, monotonic
          decline 45 → 8 over 13 days.
        - 2026-05-12 L2 HIGH_ep_entry_rate: today=10, fired against
          baseline trending down. Likely FP — same range as 5/06=10,
          5/14=11 during the burst.

      Candidate fixes:
        (a) Shorter window (7-14d) for trending metrics
        (b) EWMA (exponentially weighted MA) — recent days weighted more
        (c) Trend-aware test — if 30d shows monotonic decline, treat
            current as within trend rather than anomalous
        (d) Seasonal-aware — flag known transition periods (earnings
            close, holiday weeks) and use conditional baselines

      Need cohort evidence to pick. Each fix has tradeoffs (shorter
      window = more noise; EWMA = lag drift; trend-aware = false-
      negative risk during real anomalies).
