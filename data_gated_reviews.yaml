      -- but reads should still COUNT DISTINCT to be defensive — see
      -- Monday-fix followup re: 1h-vs-trading-day dedup window).
      SELECT COUNT(*) FROM (
          SELECT DISTINCT
                 SUBSTRING(summary FROM '^([A-Z]+)') AS ticker,
                 created_at::date AT TIME ZONE 'America/New_York' AS et_date
          FROM mi_audit_log
          WHERE event_type = 'sugar_baby_convergence_alert'
            AND created_at >= NOW() - INTERVAL '90 days'
