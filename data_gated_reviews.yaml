  - review_id: dead_zone_telemetry_smoke
    title: "Dead-zone telemetry deploy — writer smoke test"
    question: |
      After 2026-04-30 dead-zone telemetry deploy, did all three writers
      populate as designed? (1) mi_ep_scan_log.scan_time_et + new columns
      from ep_detector._scan_row, (2) mi_ep_alerts.detected_at from
      insert_ep_alert COALESCE($16::TIMESTAMPTZ, NOW()), (3)
      mi_ep_scan_outcomes from outcome_tracker._compute_ep_scan_outcomes.
      If any are empty/NULL on first Monday after deploy, a writer is
      silently broken.
    predicate_sql: null
    threshold: 0
    earliest_review_date: 2026-05-03
    action_when_ready: |
      On Hetzner, run all four checks in psql:

        -- (1) scan_log new columns populated
        SELECT COUNT(*) AS rows_with_scan_time
        FROM mi_ep_scan_log WHERE scan_time_et IS NOT NULL;
        -- expect: > 0

        -- (2) append-only behavior confirmed (multi rows per ticker/date)
        SELECT COUNT(*) AS multi_row_pairs FROM (
          SELECT ticker, scan_date FROM mi_ep_scan_log
          WHERE scan_date >= CURRENT_DATE - 7
          GROUP BY 1,2 HAVING COUNT(*) > 1
        ) t;
        -- expect: > 0 (some tickers re-scanned within a day)

        -- (3) detected_at populating on new alerts
        SELECT COUNT(*) AS alerts_with_detected_at FROM mi_ep_alerts
        WHERE alert_date >= '2026-05-01' AND detected_at IS NOT NULL;
        -- expect: matches HIGH alert count for the period

        -- (4) outcomes job ran nightly
        SELECT COUNT(*) AS outcome_rows FROM mi_ep_scan_outcomes;
        -- expect: > 0 after first nightly run

      If any check returns 0 unexpectedly: tail apollo-market logs for the
      affected job (`run_outcome_tracker` for #4, `_log_ep_scan` writes
      for #1/#2, alert insert path for #3) and trace the silent failure.
      Origin: 2026-04-30 dead-zone telemetry deploy verification.
    status: pending
    added_on: 2026-04-30

