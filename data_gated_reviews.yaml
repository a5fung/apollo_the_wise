      1. TOP-DOWN LLM emerging-theme SYNTHESIS pass (the capability gap operator flagged
         2026-05-30): Apollo HAS the data to GENERATE candidate cohorts (coordinated
         RS-slope: names with rs_1m >> rs_6m, or co-gappers same day) but NO tool
         SYNTHESIZES "these move together — what's the story — is it a theme." Build:
         feed each coordinated cohort + members' catalyst narratives to an LLM ->
         propose + name emerging themes. GROUNDED in RS/price (not free-form theme
         invention) + validated like the existing theme-validation (anti-hallucination).
         This is the bottom-up RS-clustering's missing TOP-DOWN complement.
      2. catalyst_type (C1) is the per-ticker half (narrative->type, routes around the
         blank-sector blindness); the synthesis pass is the cross-ticker half. Together
         = the reasoning a human did in the 2026-05-30 OKTA/software conversation.
      3. Fix the sector-enrichment gap (blank sector outside top-300) OR cluster on
