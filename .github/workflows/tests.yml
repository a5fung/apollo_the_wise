# CI: full unit suite + the two host-side AST preflight gates on every push/PR.
# This is the automation backstop for the local discipline — the suite is pure-unit
# (broker/DB/LLM all stubbed via tests/conftest.py; ~10-15 min serial), so a red run means a real
# regression, not a flaky integration. Deploy-time integration checks (paper-broker
# smoke, safeguard walk) stay in scripts/deploy.sh — they need prod credentials and
# deliberately do NOT run here.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # 15 -> 25 (2026-10-27): the suite (~12.8k tests) now runs 10-15 min on the runner and slow runners hit
    # the old 15-minute cap, which cancels the run (reads as 'cancelled', not a test failure).
    # 25 -> 45 (2026-10-29): three runs in a row (d0e44011, 9b9942e9, 8a4a4a4e) were cancelled at the 25-minute
    # cap at 56-57% of the suite; the last green run (d23ab632) took 20 min. The long stretches are the #711
    # as-is analysis tests (test_asis_*: ~5 min locally, ~9.5 min on the runner) and test_context_rules — heavy
    # synthetic runs by design, not hangs. 13 min locally for the whole suite (~13.1k tests).
    timeout-minutes: 45
    steps:
      # v5/v6 = the Node 24 builds (GitHub deprecates Node 20 runners
      # 2026-06-16; v4/v5 emitted a deprecation warning on every run).
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/base.txt
      - run: pip install -r requirements/base.txt
      - run: python scripts/preflight_datetime_hygiene.py
      - run: python scripts/preflight_model_registry.py
      - run: python -m pytest tests/ -q
