version: "3.9"

# Apollo Assistant — Production (VPS)
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Differences from dev:
# - No ports exposed externally (Tailscale handles access)
# - Only Telegram webhook + TradingView webhook ports exposed via reverse proxy
# - Restart policies: always
# - Resource limits
# - Production logging

# Shared production logging (#435 — was the identical json-file/50m/5-file block
# copy-pasted into all 6 services). One anchor, aliased via `logging: *default-logging`.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: apollo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apollo}
      POSTGRES_USER: ${POSTGRES_USER:-apollo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # loopback only — for SSH-tunneled rs-theme-dash
        # (adopted from a prod-local hotfix 2026-06-10; was blocking deploys as
        # an uncommitted server-side diff. NOT exposed externally.)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apollo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: apollo-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.orchestrator
    container_name: apollo-orchestrator
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      ENVIRONMENT: production
    ports:
      # Only expose the webhook port — protected by Tailscale + Nginx
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /etc/ssl/certs:/etc/ssl/certs:ro  # System CA certs
    restart: always
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G

  market-agent:
    # #256 W2 CUTOVER PERFORMED 2026-06-13 (operator-authorized, markets closed).
    # This service is now the INTELLIGENCE half: no creds, reaches apollo-execution
    # over HTTP. It keeps its name so the orchestrator /task URL stays valid.
    # ROLLBACK to combined: delete the SERVICE_ROLE/EXECUTION_MODE/EXECUTION_SERVICE_URL/
    # ALPACA_* lines below + `docker compose stop apollo-execution` +
    # `deploy.sh market-agent`. See docs/ops/execution_split_cutover.md.
    build:
      context: ..
      dockerfile: docker/Dockerfile.market
    container_name: apollo-market
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      ENVIRONMENT: production
      SERVICE_ROLE: intelligence
      EXECUTION_MODE: http
      EXECUTION_SERVICE_URL: http://apollo-execution:8006
      ALPACA_PAPER_API_KEY: ""      # creds isolation — overrides .env to blank
      ALPACA_PAPER_SECRET_KEY: ""
      ALPACA_LIVE_API_KEY: ""
      ALPACA_LIVE_SECRET_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /home/apollo/apollo_the_wise/logs:/app/logs  # persists across rebuilds
      - /home/apollo/apollo_the_wise/PLAN.md:/app/PLAN.md:ro  # #435: LIVE PLAN.md bind-mount (was COPY-baked → #426 blocking-count went stale on PLAN-only sessions)
    # Event-loop liveness probe. If uvicorn stops responding for ~3 min,
    # Docker restarts the container and scheduler catch-up logic re-fires
    # missed briefings/data-pulls on startup.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8006/live', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: always
    logging: *default-logging
    deploy:
      resources:
        limits:
          # 512M → 1536M (2026-06-10): the 17:00 nightly RS burst (~9,700
          # stocks) OOM-killed uvicorn at a ~510MB peak (kernel memcg kill,
          # 21:00:07 UTC) — root cause of the 6/01–6/05 'aborted' nightly rows
          # AND today's orphan 'running' row (the #263 false-alarm class was
          # partly THIS, not deploy interruptions). Resting RSS ~330MB leaves
          # no burst headroom at 512M; host has ~2.2G available.
          memory: 1536M

  # ── apollo-execution (#256 W2, profile: split — does NOT auto-start) ─────────
  # The execution half of the service split: broker, trade streams, safeguards,
  # execution scheduler jobs — the ONLY service with Alpaca creds. Same image as
  # market-agent; the role is chosen by SERVICE_ROLE=execution.
  #
  # PROFILED so a bare `docker compose up -d` does NOT start it. Starting it while
  # market-agent still runs as `combined` would run execution jobs + trade streams
  # in BOTH containers = double order execution / double fill processing (the #1
  # cutover risk). It is started ONLY at the gated cutover, AFTER market-agent is
  # flipped to intelligence — see docs/ops/execution_split_cutover.md and
  # `bash scripts/deploy.sh execution`.
  #
  # Internal port stays 8006 (Dockerfile.market CMD); the container NAME
  # differentiates, so intelligence reaches it at http://apollo-execution:8006.
  apollo-execution:
    profiles: ["split"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.market
    container_name: apollo-execution
    env_file: ../.env          # Alpaca creds live HERE (post-cutover, ONLY here)
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      ENVIRONMENT: production
      SERVICE_ROLE: execution
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /home/apollo/apollo_the_wise/logs:/app/logs
      - /home/apollo/apollo_the_wise/PLAN.md:/app/PLAN.md:ro  # #435: shared Dockerfile.market no longer COPYs PLAN.md
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8006/live', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: always
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1536M

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: apollo-uptime
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "127.0.0.1:3001:3001"  # Access via SSH tunnel or Tailscale only
    restart: always
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  redis_data:
  uptime_kuma_data:

networks:
  default:
    name: apollo-network
    # In production, Tailscale handles inter-service networking
    # Sub-agents are NOT accessible from outside the Docker network
